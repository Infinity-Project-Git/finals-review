<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Semester 1</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1a1f24; --muted:#55606b; --faint:#646f7a;
    --line:#d8dee4; --line2:#e7ebef;
    --accent:#1d6fb8;
    --good:#1e7d4f; --review:#a8421b;
    --tipbg:#fff6e0; --tipink:#5c4708; --tipline:#e8c45a;
    --whybg:#eef4fb; --whyink:#1f3b54; --whyline:#bcd6ef;
    --c-eng:#6f46b0; --c-chem:#1d6fb8; --c-hist:#a8481f; --c-span:#1d6b42; --c-zoo:#0f6168;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px;}

  header{padding:calc(env(safe-area-inset-top) + 18px) 0 4px;}
  .eyebrow{font-size:12px; letter-spacing:.9px; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0;}
  h1{font-size:26px; margin:2px 0 0; letter-spacing:-.3px;}
  .daterow{display:flex; align-items:center; gap:10px; margin-top:10px; min-height:14px;}
  .dotrow{display:flex; gap:7px;}
  .dotrow i{width:9px; height:9px; border-radius:99px; background:#c3ccd4; display:block;}
  .dotrow i.on{background:var(--good);}
  .dotrow i.now{background:var(--accent); box-shadow:0 0 0 3px rgba(29,111,184,.18);}
  .daterow .when{font-size:13px; color:var(--muted);}

  main{max-width:560px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 40px);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:0 2px 10px rgba(16,24,32,.055);}
  .chip{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.3px;
    color:#fff; background:var(--accent); border-radius:99px; padding:3px 11px;}
  .mins{font-size:13px; color:var(--muted); margin-left:8px;}
  .card h2{font-size:20px; margin:13px 0 0; line-height:1.3; letter-spacing:-.2px;}
  .card .lede{font-size:14.5px; color:var(--muted); margin:7px 0 0;}

  ol.steps{margin:16px 0 0; padding-left:0; list-style:none; counter-reset:s;}
  ol.steps li{counter-increment:s; position:relative; padding:9px 0 9px 34px; font-size:15px; border-top:1px solid var(--line2);}
  ol.steps li:first-child{border-top:none;}
  ol.steps li::before{content:counter(s); position:absolute; left:0; top:9px;
    width:23px; height:23px; border-radius:99px; background:#eef1f4; color:var(--muted);
    font-size:12.5px; font-weight:800; text-align:center; line-height:23px;}

  .btn{display:block; width:100%; border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:13px 14px; border-radius:12px; font-size:15px; font-weight:650; cursor:pointer;
    font-family:inherit; text-align:center; -webkit-appearance:none;}
  .btn:focus-visible,.linkbtn:focus-visible,.tab:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-size:17px;
    font-weight:800; padding:17px 14px; box-shadow:0 4px 14px rgba(16,24,32,.14);}
  .btn.primary small{display:block; font-size:13px; font-weight:600; margin-top:3px; opacity:.94;}
  .btn.good{background:var(--good); border-color:var(--good); color:#fff;}
  .btn.rev{background:var(--review); border-color:var(--review); color:#fff;}
  .btnrow{display:flex; gap:9px; margin-top:12px;}
  .btnrow .btn{margin-top:0;}
  .actions{margin-top:20px; display:flex; flex-direction:column; gap:9px;}
  .linkbtn{background:none; border:none; color:var(--muted); font-size:13.5px; text-decoration:underline;
    cursor:pointer; font-family:inherit; padding:8px; display:block; margin:0 auto;}
  .lowkey{color:var(--muted); font-size:13.5px; text-align:center; margin:18px 6px 0; line-height:1.55;}

  /* question card */
  .qtext{font-size:18px; font-weight:650; margin:0; line-height:1.4;}
  .answer{font-size:15.5px; border-top:1px solid var(--line2); padding-top:15px; margin-top:16px; display:none;}
  .card.revealed .answer{display:block;}
  .answer .lbl{display:block; font-size:11px; letter-spacing:.8px; text-transform:uppercase;
    color:var(--faint); font-weight:800; margin-bottom:5px;}
  .callout{margin-top:12px; padding:10px 12px; border-radius:10px; font-size:13.5px;}
  .why{background:var(--whybg); border-left:3px solid var(--whyline); color:var(--whyink);}
  .tip{background:var(--tipbg); border-left:3px solid var(--tipline); color:var(--tipink);}
  .callout .tag{font-weight:800; text-transform:uppercase; font-size:10.5px; letter-spacing:.7px;
    display:block; margin-bottom:2px;}

  /* win / done */
  .center{text-align:center;}
  .mark{width:62px; height:62px; border-radius:99px; background:var(--good); color:#fff;
    font-size:32px; line-height:62px; margin:0 auto 14px;}
  .bigline{font-size:22px; font-weight:800; margin:0 0 5px; letter-spacing:-.2px;}
  .subline{color:var(--muted); font-size:15px; margin:0;}
  .statline{font-size:14px; margin:16px 0 0; color:var(--muted);}
  .statline b{color:var(--ink);}

  /* practice-on-my-own */
  .tabs{display:flex; gap:7px; flex-wrap:wrap; margin:0 0 14px;}
  .tab{flex:1 1 auto; min-width:92px; border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:10px 8px; border-radius:11px; font-size:13.5px; font-weight:700; cursor:pointer;
    font-family:inherit; text-align:center;}
  .tab.on{color:#fff;}
  .ring{display:block; margin:0 auto;}
  .classname{margin:14px 0 2px; font-size:19px; text-align:center;}
  .classstat{color:var(--muted); font-size:14px; margin:0 0 18px; text-align:center;}

  /* Everything list */
  .counter{font-size:13.5px; color:var(--muted); margin:0 0 12px; font-weight:650;}
  .grouphead{font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--faint);
    font-weight:700; margin:22px 0 8px;}
  .rows{display:flex; flex-direction:column; gap:8px;}
  .row{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:12px; padding:13px 14px; cursor:pointer; font-family:inherit; color:var(--ink);
    -webkit-appearance:none; box-shadow:0 1px 4px rgba(16,24,32,.045);}
  .row:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .rowmark{flex:0 0 20px; width:20px; height:20px; border-radius:99px; background:#eef1f4;
    color:#fff; font-size:12px; font-weight:800; line-height:20px; text-align:center;}
  .rowdone .rowmark{background:var(--good);}
  .rowmain{flex:1 1 auto; min-width:0;}
  .rowtitle{display:block; font-size:15.5px; font-weight:650; line-height:1.3;}
  .rowmeta{display:block; font-size:12.5px; color:var(--muted); margin-top:3px;}
  .rowdone .rowtitle{color:var(--muted); text-decoration:line-through;}
  .rowchev{flex:0 0 auto; color:var(--faint); font-size:20px; line-height:1;}
  .backlink{margin:0 0 12px; padding-left:0; text-align:left;}

  /* check-in screen */
  .clist{margin:18px 0 0; display:flex; flex-direction:column; gap:9px;}
  .crow{display:flex; align-items:center; gap:10px; font-size:13.5px;}
  .cname{flex:0 0 40%; font-weight:650;}
  .cbar{flex:1 1 auto; height:9px; background:#e7ebef; border-radius:99px; overflow:hidden;}
  .cbar i{display:block; height:100%; background:var(--accent); border-radius:99px;}
  .cnum{flex:0 0 auto; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px;}
  .bgtag2{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--faint);
    font-weight:800; margin:20px 0 6px;}
  ul.donelist{margin:0; padding-left:19px; font-size:14px; color:var(--muted);}
  ul.donelist li{margin:3px 0;}

  .empty{background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
    padding:30px 22px; text-align:center; color:var(--muted); font-size:15px;}
  .empty b{color:var(--ink); display:block; font-size:17px; margin-bottom:7px;}
  .hide{display:none !important;}
  .demobar{background:#fff4e0; color:#6b4800; border:1px solid #e8c45a; border-radius:10px;
    padding:9px 12px; font-size:13px; font-weight:700; text-align:center; margin-bottom:14px;}

  /* parent-only answer key index */
  .keyhead{font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted,#667);
    font-weight:700; margin:18px 0 6px;}
  .keygrp{margin:0 0 10px;}
  .keygrp h4{font-size:13.5px; margin:10px 0 4px; color:var(--muted,#667); font-weight:700;}
  .keylist{list-style:none; margin:0; padding:0;}
  .keylist li{margin:0; border-top:1px solid rgba(128,128,128,.22);}
  .keylist li:first-child{border-top:none;}
  .keylist a{display:flex; align-items:center; gap:8px; padding:9px 2px; text-decoration:none;
    color:inherit; font-size:15px; min-height:44px;}
  .keylist a:hover{text-decoration:underline;}
  .keylist .pdf{font-size:10.5px; font-weight:800; letter-spacing:.5px; opacity:.55;
    border:1px solid currentColor; border-radius:3px; padding:1px 4px;}
  .keylist .isnew{font-size:10.5px; font-weight:800; letter-spacing:.5px;
    background:#1d6fb8; color:#fff; border-radius:3px; padding:1px 5px;}
  .keylist .allrow a{opacity:.72; font-size:14px;}
  .sechead{font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted);
    font-weight:700; margin:22px 0 8px; text-align:center;}
  .seclist{display:flex; flex-direction:column; gap:7px; margin:0 0 4px;}
  .sec{display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    border:1px solid var(--line); background:#fff; border-radius:11px; padding:12px 13px;
    font-family:inherit; font-size:13.5px; color:var(--ink); min-height:44px;}
  .sec:hover{border-color:var(--accent);}
  .sec:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .secname{flex:1 1 auto; font-weight:650; line-height:1.3;}
  .sec .cbar{flex:0 0 52px;}
  .swlink{margin-top:12px; font-size:13px;}
  .swhead{font-size:11.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted);
    font-weight:700; margin:16px 0 7px; text-align:center;}
  .swtabs{margin:0 0 2px; justify-content:center;}
  .swtabs .tab{flex:0 1 auto; font-size:13px; padding:9px 12px;}
  .syncnote{margin-top:14px; font-size:12.5px; opacity:.85;}
  .segwrap{margin-top:12px;}
  .seg{display:flex; background:var(--line2); border-radius:999px; padding:3px; gap:3px;}
  .segbtn{flex:1 1 50%; border:none; background:none; cursor:pointer; font-family:inherit;
    font-size:14.5px; font-weight:650; color:var(--muted); padding:9px 10px; border-radius:999px;
    min-height:44px; transition:background .15s, color .15s;}
  .segbtn.on{background:var(--ink); color:#fff;}
  .segbtn:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="eyebrow" id="eyebrow">Semester 1</p>
    <h1 id="title">Today</h1>
    <div class="daterow" id="daterow"></div>
    <div class="segwrap" id="segwrap"></div>
  </div>
</header>

<main id="app"></main>

<script>
/* ==================================================================
   CONTENT
   ------------------------------------------------------------------
   TASKS: pulled from Alex's Google Classroom 2026-09-20. Only the work he
   can actually finish himself. The three Illuminate assessments whose testing
   window closed are deliberately NOT here: they need an email to Mrs. Finch,
   not homework time. CLASSES[].units is still empty, cards come next.

   CLASSES[key].units[].cards[] = { q, a, why?, tip? }        -> "learn it"
   TASKS[]                      = { id, cls, title, steps[], mins } -> "do it"
   ================================================================== */

var CLASSES = {
  eng:  { name:"English 10",        teacher:"Walters", color:"var(--c-eng)",  units:[
      { name:"Week 4: Parts of Speech and A Problem", cards:[
        { q:"What is a noun?", a:"A person, place, thing, or abstract idea.", why:"A noun names something, so it can be the thing a sentence is about.", tip:"Her examples include ability, excitement, playground, teacher, zoo, and David." },
        { q:"Quick way to check whether a word is a noun?", a:"Put a or an in front of it. If that sounds right, it is a noun.", why:"The words a and an introduce nouns, which is why her test works.", tip:"a playground sounds right, so playground is a noun." },
        { q:"What is a pronoun?", a:"A word that replaces a noun.", tip:"Her examples: I, he, you, she, it, we, they, him." },
        { q:"Besides the obvious ones (I, he, you, she, it, we, they, him), what else is on her pronoun list?", a:"one, their, this, those, few, many, some, both, which.", why:"They all stand in for a noun instead of naming it.", tip:"The vague ones (few, many, some, both) are the easy ones to miss." },
        { q:"What is a verb?", a:"A word for a physical action, a mental action, or a state of being.", tip:"Most of the time they are doing words." },
        { q:"Her three kinds of verbs, with an example of each?", a:"Physical action (jump), mental action (think), state of being (is).", why:"A state of being word like is, exist or become counts as a verb too, even though nothing moves." },
        { q:"What is a preposition?", a:"A word that shows time or location.", why:"It places one thing in relation to another, in space or in time." },
        { q:"Name five prepositions from her list.", a:"Any five of: above, after, against, along, among, before, between, in, off, opposite, toward, with, without.", tip:"After and before are the two that answer when. Most of the rest answer where." },
        { q:"What is an adjective?", a:"A word that describes or modifies a noun or a pronoun.", tip:"Her examples: narrow, fuzzy, happy." },
        { q:"What is an adverb?", a:"A word that describes or modifies a verb, an adjective, or another adverb.", tip:"Her examples: slowly, surprisingly, calmly." },
        { q:"Do all adverbs end in -ly?", a:"No. Usually, but not always.", why:"Words like tomorrow, then, now and also are adverbs with no -ly on them." },
        { q:"Which adverbs on her list are about time?", a:"tomorrow, then, everyday, now." },
        { q:"Which adverbs on her list are transitions?", a:"also, therefore, moreover." },
        { q:"Adjective and adverb: which one modifies what?", a:"An adjective modifies nouns and pronouns. An adverb modifies verbs, adjectives and other adverbs.", tip:"Adverb has verb inside it, and a verb is the main thing it modifies." },
        { q:"What is a conjunction?", a:"A word that connects other words or groups of words." },
        { q:"What does FANBOYS stand for?", a:"For, And, Nor, But, Or, Yet, So.", tip:"Seven letters, seven conjunctions, in that order." },
        { q:"Conjunctions she listed that are not in FANBOYS?", a:"although, therefore, because, however, while, when." },
        { q:"What is a conjunctive adverb?", a:"It connects two clauses, but not two independent clauses.", why:"The limit in her definition is the not two independent clauses part." },
        { q:"Name three conjunctive adverbs.", a:"Any three of: therefore, nonetheless, moreover, consequently, thus." },
        { q:"Can one word be more than one part of speech?", a:"Yes. Therefore is on her adverb list and on her conjunction list.", why:"She wrote that caveat on the slide herself, so a word showing up twice is not a mistake." },
        { q:"Flat or stock character?", a:"A character with just one or two traits, not a lot to them.", tip:"Flat like a sheet of paper: one side, nothing behind it." },
        { q:"Round or complex character?", a:"A character with many traits, faults and virtues." },
        { q:"Static character?", a:"A character who does not change throughout the story.", tip:"Static means staying put." },
        { q:"Dynamic character?", a:"A character who changes, develops and learns from experiences in the story." },
        { q:"Flat and round, static and dynamic: what does each pair measure?", a:"Flat and round are about how many traits a character has. Static and dynamic are about whether the character changes.", why:"The two pairs come from her two separate definitions, traits and change." },
        { q:"Who wrote A Problem?", a:"Anton Chekhov." },
        { q:"Which three characters are named in her notes on A Problem?", a:"Sasha, Ivan Markovich, and the Colonel." },
        { q:"How does Sasha appear while he waits for judgment?", a:"Meek, but not really humble.", why:"Her note puts a question mark on meek and adds not really humble." },
        { q:"What do Sasha's thoughts and actions show readers about him?", a:"He does not take responsibility, he feels no guilt, and he is immature." },
        { q:"What does Ivan Markovich do in A Problem?", a:"He gives a speech saying they should pay the IOU, because Sasha is not the one to blame." },
        { q:"What does Ivan Markovich's speech show about him?", a:"He believes in second chances, and he is persuasive or manipulative.", why:"Her notes list both sides from the same speech, the kind one and the manipulative one." },
        { q:"The sentence frame she required for a family council verdict?", a:"Our verdict is that ___ because ___. The strongest evidence is ___. However, someone might disagree because ___.", tip:"Four blanks in order: verdict, reason, evidence, the other side." }
      ]}
    ] },
  chem: { name:"Conceptual Chemistry", teacher:"Porter", color:"var(--c-chem)", units:[
      { name:"MSDS Project", cards:[
        { q:"What does MSDS stand for?", a:"Material Safety Data Sheet.", why:"A real one is a safety sheet for a chemical. Porter's version is a joke one about herself, written in the same shape as the real thing." },
        { q:"What sections does the MSDS project need?", a:"General Information, Occurrence, Physical Properties, Chemical Properties, and the element tile.", tip:"Two info sections, two property sections, then the tile." },
        { q:"What goes under General Information?", a:"Who discovered you.", why:"Porter put her parents, Jerry and Mary Brandow." },
        { q:"What goes under Occurrence?", a:"Where you are found, and where you are hardly found at all.", why:"Porter put large deposits in warm places like Key West, and very small amounts in Antarctica." },
        { q:"What is a physical property?", a:"Something you can observe without changing what it is." },
        { q:"What is a chemical property?", a:"How something reacts." },
        { q:"Fast way to tell the two property sections apart?", a:"Physical is what you look like and what changes your state. Chemical is what you react to.", tip:"Look at me, versus react to me." },
        { q:"'Brown hair with highlights, blue/green eyes, glasses, short.' Which section?", a:"Physical properties.", why:"You can see all of it without changing anything." },
        { q:"Porter wrote 'Boils when people lie to her.' Which section?", a:"Physical properties.", why:"Boiling is a change of state, and changes of state sit with the physical ones." },
        { q:"Porter wrote 'May explode if her car gets damaged.' Which section?", a:"Chemical properties.", why:"Exploding is a reaction to something." },
        { q:"Which two change-of-state words does Porter use?", a:"Boils and melts.", tip:"Boils when people lie to her, melts in the hot tub on a cool night." },
        { q:"The line about joyful, grateful and impressed states is standing in for what?", a:"States of matter.", why:"She swapped moods in for the states a real substance can be found in." },
        { q:"Which reaction words does Porter use in Chemical Properties?", a:"Attracted to, repelled by, explodes, does not react, neutral.", tip:"Pulled in, pushed away, blows up, or nothing happens." },
        { q:"What do 'repelled by' and 'attracted to' mean on the sheet?", a:"Repelled is what pushes you away. Attracted is what pulls you in.", why:"Hers: repelled by being cold, attracted to beaches or pools." },
        { q:"Two ways Porter says something has no effect on her?", a:"Does not react, and is neutral to.", why:"It snows and she does not react. Making dinner is neutral." },
        { q:"What four things go on the element tile?", a:"Atomic number, element symbol, element name, atomic mass." },
        { q:"Porter's atomic number is 51. Where did that number come from?", a:"Her age.", tip:"Yours would be 15." },
        { q:"Her element name is Portium. What is the pattern?", a:"Last name plus -ium." },
        { q:"How is an element symbol written?", a:"Two letters, capital first, lowercase second.", why:"Hers is Rp." }
      ]}
    ] },
  hist: { name:"World History",     teacher:"Flores",  color:"var(--c-hist)", units:[
      { name:"Forms of Government", cards:[
        { q:"Bell work: what does \"government\" mean, in your own words?", a:"A government is the group that makes the rules for a place and makes sure people follow them. It has two powers: the power to make laws, and the power to enforce them.", why:"Every form of government on this list is a different answer to one question: who holds that power?" },
        { q:"Theocracy: a form of government where ___ rule in the name of God.", a:"Religious leaders. Priests, clerics, or other religious officials hold the power. The laws come from religious teaching.", tip:"Theos means god in Greek. A theocracy is god rule." },
        { q:"Autocracy: a form of government where one leader has ___ power.", a:"Unlimited power. You may also see it written as absolute or total. No court, no parliament, and no election can legally stop that one leader.", tip:"Auto means self in Greek. In an autocracy one person rules alone." },
        { q:"Autocracy, type one: ___ (power taken through force).", a:"Dictatorship. A dictator takes power by force, usually with the military. A dictator is not elected, and does not inherit the job from family." },
        { q:"Autocracy, type two: ___ monarchy (power given through ruling family).", a:"Absolute monarchy. A king or queen inherits total power from their family and keeps it for life. No elected group can limit them.", why:"Both types are autocracy because one person holds all the power. Only the way they got it is different." },
        { q:"Oligarchy: a form of government where a ___ ___ of rich and powerful people have all of the power.", a:"A small group. In an oligarchy a handful of wealthy or powerful people rule. Citizens do not pick them and cannot vote them out.", tip:"Oligo means few in Greek. An oligarchy is rule by a few." },
        { q:"In an oligarchy, decisions are made that usually benefit the ___ group.", a:"The ruling group. The small group in charge makes choices that help themselves and keep their own power, not choices that help everyone else." },
        { q:"What is a similarity between oligarchy and autocracy?", a:"In both, the people have no say. Citizens do not choose the rulers and cannot remove them. The main difference is one ruler versus a small group of rulers." },
        { q:"Constitutional monarchy: power is held by ___ person, who inherits the power through ___.", a:"One person, a king or queen. They inherit the power through birth, meaning through their family line.", why:"The monarch is one person, but the monarch is not the one really in charge." },
        { q:"In a constitutional monarchy, who has the authority to tax and make new laws?", a:"An elected body, such as a parliament. The monarch wears the crown and is mostly a symbol. The lawmakers the people elected hold the real power.", tip:"A constitution is a set of written rules that limits a ruler's power. That limit is the idea in the name." },
        { q:"What is the difference between an absolute monarchy and a constitutional monarchy?", a:"In an absolute monarchy the king or queen holds all the power. In a constitutional monarchy they inherit the title, but elected lawmakers hold the power to tax and make laws." },
        { q:"Communism: the government controls the whole ___ (goods, services, and production).", a:"The economy. Under communism the government owns and runs the farms, factories, and businesses. People do not own businesses privately." },
        { q:"Communist states are usually ruled by a communist ___, and there is ___ political party.", a:"Ruled by a communist party, and there is only one political party. Because there is no other party, voters have no real choice." },
        { q:"Socialism: the government takes an active role in controlling the ___.", a:"The economy. The government owns or controls key parts of it, such as healthcare, energy, or transportation. Private business still exists alongside it." },
        { q:"What is a similarity between socialism and communism?", a:"Both give the government control over the economy. The difference is how much. Communism controls all of it. Socialism controls only part of it." },
        { q:"Direct democracy means \"rule by the ___\". Citizens directly ___ in government.", a:"Rule by the people. Citizens directly vote, or participate, in government. They vote on the laws themselves instead of sending someone to do it.", tip:"Demos means people and kratos means power. Democracy is people power." },
        { q:"Representative democracy is also known as a ___. It is governed by representatives ___ by citizens.", a:"Also known as a republic. It is governed by representatives elected by citizens. The United States is one example.", why:"Republic and representative democracy mean the same thing here, so a question can use either word." },
        { q:"What is a similarity between direct and representative democracy?", a:"In both, the power comes from the people. Citizens have a real say in government. The difference is only whether they vote on laws themselves or elect someone to vote for them." },
        { q:"Fascism: a strong ___ government led by a charismatic ___.", a:"A strong central government, led by a charismatic leader. Fascism uses strict control over social and economic life and pushes extreme patriotism.", why:"Charismatic means the leader is exciting to listen to, so crowds follow willingly." },
        { q:"What is feudalism?", a:"A system where peasants and vassals work a powerful lord's land. In exchange, the lord protects them and takes care of their economic needs.", why:"Feudalism was common in Europe during the Middle Ages." },
        { q:"Which form of government is similar to feudalism, and which is similar to fascism? (One for each)", a:"Feudalism is most like oligarchy. A few powerful lords hold the land and the power.\nFascism is most like autocracy. One strong leader holds all the power." },
        { q:"What is anarchy?", a:"Anarchy is the absence of government. Nobody is in charge, so there are no laws and no one to enforce them. It can happen when a government collapses.", tip:"The prefix an- means without. An plus archy is without a ruler." },
        { q:"What are the 11 forms of government in the \"Bears in Government\" list?", a:"Autocracy (dictatorship or absolute monarchy)\nOligarchy\nCommunism\nSocialism\nDirect democracy\nRepresentative democracy\nConstitutional monarchy\nFascism\nFeudalism\nTheocracy\nAnarchy" }
      ]},
      { name:"Hinduism and Buddhism", cards:[
        { q:"What does the Buddha Bumper Stickers assignment ask you to do?", a:"Make two bumper stickers. Cut printer paper in half the long way. Each half is one sticker. Write a short statement on each one, based on a Hinduism or Buddhism idea, then decorate it with colored pens or pencils.", why:"The worksheet says to get your ideas from its lists of Hinduism and Buddhism concepts. Those terms are the rest of these cards." },
        { q:"How are Hinduism and Buddhism related?", a:"Buddhism began in India as a reform of Hinduism. That is why it shares many of the same ideas, like karma, reincarnation, and the goal of escaping rebirth.", why:"It is why the same terms show up on both sides of the worksheet's list." },
        { q:"What is the caste system?", a:"It is how traditional Indian society was ranked. People were born into a group called a caste. Your caste set your job, who you could marry, and your place in society. You could not move to a different caste.", tip:"The four castes in order, top to bottom: priests, warriors, merchants, laborers." },
        { q:"Who were the Brahmans?", a:"The priests, and the highest of the four castes. They studied the sacred texts, led the rituals, and taught religion. Only Brahmans could perform the most important ceremonies.", tip:"Brahmans with an s are the priests. Brahman with no s is the universal soul. Two different words on this worksheet." },
        { q:"Who were the Kshatriyas?", a:"The warriors, and the second caste. Kings, nobles, and soldiers came from this group. Their duty was to protect and govern everyone else.", why:"The Buddha was born into this caste, not the priest caste." },
        { q:"Who were the Vaisyas?", a:"The merchants, and the third caste. They were traders, shopkeepers, and farmers. They ran the everyday economy." },
        { q:"Who were the Shudras?", a:"The laborers, and the lowest of the four castes. They did the hard physical work and served the three castes above them. They were usually not allowed to study the sacred texts." },
        { q:"Who were the Untouchables?", a:"People below all four castes, outside the system entirely. They did work seen as unclean, like handling garbage, dead bodies, or animal skins. Other people avoided touching them. Today they are usually called Dalits.", why:"They show how strict the system was. Being outside it was worse than being at the bottom of it." },
        { q:"What were sadhus, also called samanas?", a:"Wandering monks. They gave up home, property, and family to travel, beg for food, and search for spiritual truth.", why:"Living this way put a person outside normal caste life. The Buddha lived as one before his enlightenment." },
        { q:"What is reincarnation?", a:"The belief that after you die, your soul is born again in a new body. The same soul lives many lives in a row. What you come back as depends on how you lived this time.", why:"Karma, samsara, and moksha each describe a different part of this same cycle." },
        { q:"What is karma?", a:"The good and bad you do adds up. Good deeds build good karma, bad deeds build bad karma. Your total karma decides what you are reborn as in your next life.", tip:"Karma is the score. Reincarnation is the next round." },
        { q:"What is maya?", a:"Illusion. The physical world we see is not true reality. It is a kind of cover over what is actually real. The worksheet says the earth often stood for maya." },
        { q:"What is samsara?", a:"The false world that illusion produces. It is also the endless cycle of birth, death, and rebirth you are stuck inside.", tip:"Maya is the illusion. Samsara is the world the illusion creates." },
        { q:"What is yoga?", a:"The process of meditation. It is training for the mind and body that helps a person settle down, focus, and move toward spiritual truth.", tip:"On this worksheet, yoga means meditation. It does not mean a stretching class." },
        { q:"What is a yogi?", a:"A spiritual teacher or adviser. A yogi has practiced meditation for a long time, so other people come to them for guidance.", tip:"Yoga is the practice. A yogi is the person who guides it." },
        { q:"What is atman?", a:"The individual soul. It is the divine part inside one person, the piece that does not die when the body dies. Atman is what moves on and is reborn." },
        { q:"What is Brahman?", a:"The universal soul, the divine, God. Brahman is the one reality behind everything that exists. Every individual atman is a piece of it.", tip:"Brahman with no s is the universal soul. Brahmans with an s are the priests." },
        { q:"What is enlightenment, also called liberation or nirvana?", a:"The realization that atman and Brahman are identical. Your soul and the universal soul were never separate. Once you truly see that, you are released from the cycle of rebirth.", why:"This is the goal of the whole system. Every other term either explains what traps you or how to get out.", tip:"Nirvana comes from a word meaning to blow out, like a flame. What gets blown out is desire." },
        { q:"What is dharma?", a:"Your duty, or the right way to live. Dharma means doing what your role in life asks of you, honestly and well." },
        { q:"What is kama?", a:"Pleasure. It covers enjoyment, love, beauty, and the good feelings of life. Hinduism does not treat pleasure as evil. It is one of the four things a person aims for." },
        { q:"What is artha?", a:"Wealth, money, and material possessions. It also covers success and security: a job, a home, and the means to support a family." },
        { q:"What is moksha?", a:"Liberation. It is release from the cycle of rebirth. The worksheet also calls it retirement, because it comes last, when a person sets aside work and family duties to seek that release." },
        { q:"What do dharma, kama, artha, and moksha have in common?", a:"The worksheet lists them together as the stages of life. A person pursues duty, pleasure, and wealth during ordinary life. Moksha comes last, and it is the one that ends the cycle.", tip:"Moksha is always the final one. The other three belong to life inside the world." },
        { q:"What are the Four Noble Truths of Buddhism?", a:"1. Life is suffering.\n2. The cause of suffering is desire and selfishness.\n3. Suffering can be stopped.\n4. The way to stop it is the Eightfold Path.", why:"The four lines at the bottom of the worksheet are these truths, even though it does not name them. They are the core of what the Buddha taught.", tip:"It runs like a doctor visit. Name the problem, find the cause, say it can be cured, give the treatment." },
        { q:"What does \"life is suffering\" actually mean?", a:"It does not mean life is always miserable. It means nothing lasts. Things you enjoy end, people change, bodies get sick and old. Wanting things to stay the same is where the pain comes from." },
        { q:"Why does Buddhism say desire causes suffering?", a:"Because wanting has no end. You get the thing you wanted, feel good for a while, then want something else. Selfishness works the same way, keeping you at the center and never satisfied." },
        { q:"What is the Eightfold Path?", a:"The Buddha's eight step guide for ending suffering:\n1. Right view\n2. Right intention\n3. Right speech\n4. Right action\n5. Right livelihood\n6. Right effort\n7. Right mindfulness\n8. Right concentration", why:"It is the fourth noble truth spelled out. It is also called the Middle Way, because it avoids both luxury and extreme self denial.", tip:"Every step begins with the word right. They group into how you think, how you act, and how you train your mind." }
      ]},
      { name:"Christianity", cards:[
        { q:"Who were the first Christians, and what did they believe?", a:"They were Jews who were waiting for a messiah, or savior. They believed they had found him in Jesus of Nazareth. They believed he was the son of God, born to a virgin named Mary, and the deliverer promised in the Jewish Torah.", why:"This is the first box on the worksheet. It wants two things: who they were, and what they believed." },
        { q:"What does the word messiah mean, and why is Jesus called Christ?", a:"Messiah means savior, or deliverer. Early Christians believed Jesus was the deliverer promised in Jewish scripture. Christ is the title they gave him. It means the same thing as messiah.", tip:"Christ is a job title, not a last name. Jesus Christ means Jesus the Savior." },
        { q:"Why do Christians celebrate Christmas?", a:"Christmas, each December, celebrates the birth of Jesus. Christians believe God's son took on an earthly form to save people from sin, which means wrongdoing. The story says shepherds from nearby fields came to Bethlehem to honor him.", why:"The worksheet asks you to copy a portion of the text in quotation marks that best explains why Christians celebrate Christmas. Use this sentence from the reading: \"Jesus's immaculate conception and birth signifies to Christians that while divine by nature, God's son, took on an earthly form in order to save his followers from sin, or wrongdoing.\"" },
        { q:"What does the shepherd image mean in the Christmas story?", a:"Shepherds came to Bethlehem to honor the newborn Jesus. Your reading says this reminds Christians that Christ is like a shepherd, always tending and caring for his flock of sheep, meaning his believers.", why:"The worksheet box says \"Christ and Baptism, Main Idea.\" This is the main idea of that section." },
        { q:"What is baptism?", a:"Baptism is a washing that stands for washing away sin. As a young adult, Jesus asked his cousin John to baptize him in the River Jordan. Churches today use either a small sprinkle of water or full immersion." },
        { q:"Why did the Jewish leadership turn against Jesus?", a:"As Jesus grew more popular, the Jewish leadership grew more hostile to him and his followers. They thought he might have come to overthrow the Roman government. That would put their own power at risk.", why:"This is where the crucifixion story starts. It explains what happens next." },
        { q:"What is Passover?", a:"Passover is a Jewish holiday. It remembers the exodus, when the Jews left Egypt. Jesus and his followers came to Jerusalem to celebrate it.", why:"Passover is the week Jesus was arrested and killed. In your reading, it is also the reason his followers could not return to his tomb for three days." },
        { q:"What happened when Jesus rode into Jerusalem?", a:"A very large crowd gathered around him. People waved palm branches at his feet while he rode into the city on a donkey. Christians believe he was filling the role of Messiah described in the Torah.", why:"This public welcome is what the Jewish leadership could not tolerate. It led to the charges against him." },
        { q:"What does heresy mean?", a:"Heresy means an opinion or statement that goes against religious teachings. In your reading, the Jewish leadership saw the crowd treating Jesus as the Messiah as a show of heresy." },
        { q:"What does blasphemy mean?", a:"Blasphemy means profaning the name of God. Profaning means treating it with disrespect. The Jewish leadership had Jesus charged with blasphemy.", tip:"Blasphemy is about disrespecting God's name. Heresy is about beliefs that do not match the official teaching." },
        { q:"Who ordered Jesus to be put to death, and how did he die?", a:"Pontius Pilate, the Roman governor, sentenced Jesus to death on a cross. Jesus was crucified alongside two criminals. Crucifixion was a common form of punishment at that time.", why:"Pilate could not calm the crowd or satisfy the accusers, so he gave the sentence. Christians believe the death was necessary so Jesus could take on the sins of people." },
        { q:"What do Christians mean by the resurrection?", a:"Jesus's followers were allowed to take his body to an empty tomb. They laid him there and sealed it. Because it was Passover, they could not return for three days. When they did, the tomb was empty. Christians believe Jesus had risen.", why:"The worksheet asks you to summarize the crucifixion and resurrection. Four beats cover it: arrest, cross, sealed tomb, empty tomb." },
        { q:"What is the ascension?", a:"Christians believe Jesus appeared to several different people after he rose. Then he ascended, which means rose, to heaven. They believe he sits at the right hand of God, and that they will also rise and live forever in heaven." },
        { q:"What are the Gospels?", a:"The Gospels are four books about the life and teachings of Jesus. Gospel means good news. They were written by Matthew, Mark, Luke, and John, and they are the first four books of the New Testament.", tip:"My Mother Loves Jesus gives you Matthew, Mark, Luke, John in the right order." },
        { q:"What is the Christian Bible made of?", a:"Two parts.\nOld Testament: the Jewish Torah and scriptures, written before Jesus.\nNew Testament: the four Gospels, plus epistles, which are letters written by early church leaders, plus two other books.\nTestament means covenant, or agreement.", why:"The worksheet asks you to sketch your understanding of the Old and New Testament. Two stacked boxes with those labels is enough." },
        { q:"How did Christianity first spread?", a:"Soon after Jesus died, the Romans destroyed Jerusalem and scattered its people. Those people carried the faith across the Mediterranean, including the Roman and Byzantine empires. Wherever they went they evangelized, which means spreading the good news.", why:"They were also persecuted. Christians and Jews were blamed for harm and misfortune." },
        { q:"What did Constantine do in 313 CE?", a:"Constantine was the Roman emperor. By 313 CE he had converted to Christianity and declared it a legal religion. Your reading calls it a political move to win the favor of Christians.", tip:"313 is the year being Christian stopped being a crime in the Roman Empire." },
        { q:"What is the Nicene Creed?", a:"A statement of faith. Constantine gathered a council to write it so Christian teaching would be the same everywhere. It says God is three persons in one, called the Holy Trinity: the Father who creates, the Son who is Christ, and the Holy Spirit.", why:"Your reading adds that the Holy Spirit is the part that stays active in the world, like the conscience of God." },
        { q:"What was the Great Schism?", a:"The split of the Christian church into two branches. The Eastern church became the Orthodox Church. The Western church stayed the Roman Catholic Church. They kept the same beliefs but worship in different ways.", why:"Your reading ties the split to the Roman Empire splitting in the 5th and 6th centuries, which is the 400s and 500s. That is the version your worksheet is built on. Outside of class, historians usually date the final break to 1054.", tip:"Schism means split. East is Orthodox, West is Roman Catholic." },
        { q:"What was the Reformation?", a:"A time in Europe when people started to question their place in the universe, and their place in the church. Several reformers spoke out against church practices. The church split further because of it.", why:"Luther, Calvin, and Henry VIII all belong to this stretch of the reading." },
        { q:"Who was Martin Luther, and what did he object to?", a:"Luther was a German priest during the Reformation. He spoke out against indulgences, which was money people paid the church for their own sins and for the sins of dead family members. He also translated the Bible into German.", why:"He translated it because he thought people should be able to read the scriptures for themselves." },
        { q:"What did John Calvin teach?", a:"Calvin was a French church reformer. He taught predestination. That is the idea that God has already decided who will be saved, before a person is born.", tip:"Predestination is pre plus destination. Your destination is set ahead of time." },
        { q:"Why did England start its own church?", a:"King Henry VIII wanted to divorce his wife and the pope refused. So Henry made himself head of the church in England. Later, Queen Elizabeth I established the Church of England, also called the Anglican or Episcopal Church.", why:"One thing to know: your reading calls Elizabeth I his granddaughter. She was actually his daughter. The reading has this wrong, so answer with the reading if the worksheet asks, but the real fact is daughter." },
        { q:"Who were the Puritans and Pilgrims?", a:"English Christians who wanted a simpler faith, free of harsh rules and laws. They wanted to get away from Catholic influence in the church. They found a new home in America.", why:"They come right after the Church of England in your reading. They wanted something plainer than the church they left behind." },
        { q:"What are the main branches of Christianity?", a:"Three.\nOrthodox: the Eastern church after the Great Schism.\nRoman Catholic: the Western church.\nProtestant: churches that broke away during the Reformation, such as the Church of England.", why:"The worksheet asks you to look at the graphic called Major Branches of Christianity and summarize it. These three are what it shows." },
        { q:"What is a denomination?", a:"A denomination, or sect, is a branch or group within Christianity. The denomination often decides what the church building looks like. Roman Catholic churches are often elaborately decorated. Protestant churches, meaning non-Catholic, tend to be plainer and more functional.", tip:"Protestant comes from protest. Those churches began by protesting against the Catholic church." },
        { q:"What do you find inside a church?", a:"Pews: long benches for worshipers to sit on.\nAltar: the table at the front of the church.\nSermon: the lesson given from the front.\nBaptism font: a container that holds the water used in the rite, meaning religious ceremony, of baptism." },
        { q:"What is the Eucharist?", a:"Bread and wine that stand for the body and blood of Christ. Christians eat and drink them to remember the last supper Jesus had before he was crucified. It is treated as a time of thanksgiving and prayer." },
        { q:"Besides Christmas, what festivals do Christians celebrate?", a:"Easter: celebrated each spring. It remembers the death and resurrection of Christ, and is seen as a time to renew your faith.\nMartyr days: some churches mark the birth or death of martyrs, meaning people killed because of their faith." },
        { q:"How many people in the world are Christian?", a:"About 2.2 billion people, which is 31.5 percent of the world population. Islam is second with 1.6 billion followers, about 23 percent of the world.", why:"These are the numbers printed in the Did You Know box of your handout, so they are the ones to use." }
      ]},
      { name:"Origins of Islam", cards:[
        { q:"What is Islam?", a:"Islam is a monotheistic religion. Monotheistic means believing in one God. Muslims call God Allah, which is the Arabic word for God.\nIslam began in Arabia in the 600s, with revelations that a man named Muhammad said he received from God.", why:"This is the sentence your teacher's directions start with, so it is the frame for the whole unit." },
        { q:"Muhammad's Background: who was he before the revelations?", a:"He was born around 570 in Mecca, a busy trading city in Arabia. His father died before he was born, his mother when he was about six, so relatives raised him. He became a trader with camel caravans. At about 25 he married Khadija, a successful merchant.", why:"His trading trips took him across Arabia, where he met Jewish and Christian people who already believed in one God." },
        { q:"Muhammad's Revelation: what happened, and when?", a:"Around 610, when he was about 40, Muhammad was praying alone in a cave outside Mecca. He said the angel Gabriel appeared and told him to recite God's words.\nHe believed God had chosen him as a messenger. Revelations kept coming for the rest of his life.", tip:"The very first thing Gabriel said was \"Recite.\" The word Quran means \"recitation.\" Same idea, same word root." },
        { q:"What is the Quran?", a:"The Quran is the holy book of Islam. It collects the revelations Muhammad received over about 22 years. Muslims believe it is God's exact words. Followers memorized and wrote them down, and they were gathered into one book after Muhammad died.", why:"Your directions say the revelations \"form the basis of the Islamic religion.\" The Quran is where those revelations live." },
        { q:"Mecca: how did people there react to Muhammad's message?", a:"Most Meccan leaders rejected it and turned hostile. Mecca was polytheistic, meaning people worshipped many gods. Pilgrims came to visit hundreds of idols at the Kaaba, and that brought money into the city.\nOne God threatened both that income and the leaders' power.", why:"This rejection is the reason the next stage, the move to Medina, had to happen." },
        { q:"What is the Kaaba?", a:"The Kaaba is a cube shaped stone shrine in the center of Mecca. Before Islam it held idols of many gods and drew pilgrims from across Arabia. Today Muslims face toward the Kaaba when they pray.", tip:"Kaaba is the Arabic word for cube, and the building really is a cube." },
        { q:"The Hijrah: what was it?", a:"In 622, Muhammad and his followers left Mecca and moved to Yathrib, a city about 200 miles north. That move is called the Hijrah.\nLeaders in Yathrib had invited him to settle fights between their clans. The city was later renamed Medina.", tip:"Hijrah means migration. It was a move, not a battle." },
        { q:"The Hijrah: why was it a turning point for Islam?", a:"In Medina, Muhammad became both a religious and a political leader. He built the first Muslim community, called the umma, with its own laws and government. Islam grew quickly there.", why:"The Muslim calendar counts year 1 from 622, the year of the Hijrah. That is how important Muslims consider this move." },
        { q:"Muhammad's Return to Mecca: what happened?", a:"In 630 he returned to Mecca with about 10,000 followers. The city gave in with almost no fighting.\nHe destroyed the idols inside the Kaaba and dedicated the shrine to Allah alone. Most people in Mecca then accepted Islam.", why:"This turned Mecca from Islam's biggest opponent into its holiest city." },
        { q:"What was the impact of the return to Mecca on the growth of Islam?", a:"Muhammad died in 632, about two years later. By then most of the Arabian Peninsula was united under Islam for the first time. Tribes that had been fighting now shared one faith, and Muslim rule spread quickly after his death.", why:"Your organizer asks for the impact of each stage, not just what happened. This is the impact box for the last stage." },
        { q:"The four stages of Muhammad's life, in order with dates", a:"1. Background: born about 570 in Mecca, orphaned, became a trader.\n2. Revelation and Mecca: about 610, the cave, Gabriel, and rejection by Meccan leaders.\n3. Hijrah: 622, the move to Medina, first Muslim community.\n4. Return to Mecca: 630, idols cleared from the Kaaba. He died in 632.", tip:"The dates climb in a neat line: 570, 610, 622, 630, 632. Learn 622 first, since it is year 1 of the Muslim calendar." },
        { q:"What is the main teaching of Islam?", a:"That there is only one God, Allah. Muhammad is a prophet and messenger, not a god, and Muslims do not worship him.\nMuslims believe Allah is the same God Jews and Christians worship, and that Muhammad was the last of many prophets.", why:"Slide 2 of your organizer opens with this line, so it is the frame for the Five Pillars." },
        { q:"What are the Five Pillars of Islam?", a:"Five duties every Muslim is expected to carry out:\n1. Faith (shahada)\n2. Prayer (salat)\n3. Charity (zakat)\n4. Fasting (sawm)\n5. Pilgrimage (hajj)\nThey are called pillars because they hold up the religion the way columns hold up a building." },
        { q:"Pillar 1: Shahada (faith)", a:"The statement of faith. A Muslim declares: \"There is no god but God, and Muhammad is the messenger of God.\"\nSaying this sincerely in front of witnesses is how a person becomes a Muslim. It is first because everything else rests on it.", tip:"Shahada means testimony, like testifying to what you believe." },
        { q:"Pillar 2: Salat (prayer)", a:"Prayer five times a day: dawn, noon, afternoon, sunset and night. Muslims face toward Mecca when they pray and can pray almost anywhere.\nOn Fridays, many gather at a mosque for a midday service led by a prayer leader." },
        { q:"Pillar 3: Zakat (charity)", a:"Giving part of your wealth to people in need. The usual amount is one fortieth, which is 2.5 percent, of a person's savings each year.\nIt is treated as a duty owed to God, not a favor or an optional donation.", why:"It is the pillar about how Muslims treat other people, not just how they worship." },
        { q:"Pillar 4: Sawm (fasting during Ramadan)", a:"Fasting during Ramadan, the ninth month of the Muslim calendar. From dawn until sunset, Muslims do not eat or drink. They eat a meal before sunrise and another after sunset.\nChildren, people who are sick, and travelers do not have to fast.", why:"Ramadan is the month Muslims believe Muhammad received his first revelation, which links this pillar back to the cave outside Mecca." },
        { q:"Pillar 5: Hajj (pilgrimage)", a:"The pilgrimage to Mecca. Every Muslim who is healthy enough and can afford the trip should go at least once in a lifetime.\nIt takes place during one set month each year. Pilgrims walk around the Kaaba seven times and wear simple white clothing.", why:"The white clothing makes rich and poor pilgrims look alike, which is the point: everyone stands equal before God." }
      ]},
      { name:"World Religions Review", cards:[
        { q:"What is on the World Religions Jeopardy review board?", a:"Five categories, five clues each, 25 in all. Holy Books, Founder, Symbol, Beliefs, Holy Sites. The religions are Christianity, Judaism, Islam, Hinduism, Buddhism.", why:"Almost every clue pairs one religion with one of those five categories. The Jerusalem clue is the one that asks for a city instead.", tip:"Book, founder, symbol, belief, site. Five categories, five clues each." },
        { q:"Holy Books: the holy book for Christianity.", a:"The Bible.", why:"The Christian Bible is the Old Testament, which is the Jewish Torah and scriptures, plus the New Testament." },
        { q:"Holy Books: the holy book for Judaism.", a:"The Torah. Old Testament or Hebrew Bible also count.", why:"The Torah is the Jewish scripture. Christians later included it in their Bible as the Old Testament, which is why all three names are accepted." },
        { q:"Holy Books: the holy book for Islam.", a:"The Quran.", why:"Your Islam organizer says the revelations of Muhammad are what Islam is built on." },
        { q:"Holy Books: the holy book for Hinduism.", a:"The Vedas, or the Bhagavad Gita. Either one counts, and you can say both.", why:"Hinduism does not have one single book. Your Hinduism stations sheet asks for two sacred texts, and the board accepts either title." },
        { q:"Holy Books: the holy book for Buddhism.", a:"There are none. The Tipitaka also counts.", why:"Buddhism has no one book the way Christianity has the Bible. It does have scriptures, called the Tipitaka, which is why both answers work.", tip:"Buddhism is the odd one in this category. If a holy book clue feels like a trick, it is Buddhism." },
        { q:"Founder: the founder of Christianity.", a:"Jesus.", why:"Early Christians were Jews who believed Jesus of Nazareth was the messiah, or savior, promised in the Torah." },
        { q:"Founder: the founder of Islam.", a:"Muhammad.", why:"Islam begins with Muhammad's revelations. Your Origins of Islam cards follow his life from Mecca, to Medina, and back to Mecca." },
        { q:"Founder: the founder of Judaism.", a:"Abraham.", why:"Abraham is the answer on this board. A textbook usually names Moses as well, so both names turn up in different places." },
        { q:"Founder: the founder of Buddhism.", a:"Siddhartha Gautama, also called the Buddha.", why:"Either name works. Buddhism is a reform of Hinduism, and Siddhartha Gautama is the person it started with." },
        { q:"Founder: the founder of Hinduism.", a:"There is no known founder.", why:"Hinduism developed slowly over a long time instead of starting with one teacher.", tip:"Two blanks on this board, one each. Buddhism has no book. Hinduism has no founder." },
        { q:"Symbol: the Cross.", a:"Christianity.", why:"Pontius Pilate sentenced Jesus to death on a cross, and Christians believe he rose three days later." },
        { q:"Symbol: the Star of David.", a:"Judaism.", tip:"The name carries the answer. Star of David goes with Judaism." },
        { q:"Symbol: the Crescent and Star.", a:"Islam.", why:"It is the only symbol on the board that names two things, a crescent and a star, so it is easy to pick out." },
        { q:"Symbol: the Ohm symbol.", a:"Hinduism." },
        { q:"Symbol: the circle with eight spokes.", a:"Buddhism.", why:"Your Hinduism and Buddhism notes say the way to end suffering is the eight-fold path of Buddhism.", tip:"Count the spokes. Eight spokes, Eightfold Path, Buddhism." },
        { q:"Beliefs: Brahman, Shiva, Aadharsha, Vishnu. Which one is not a Hindu god?", a:"Aadharsha.", why:"Brahman, Shiva and Vishnu are all Hindu names. You already know Brahman as the universal soul. Aadharsha is the one that does not belong.", tip:"The fake one is the one you have never seen anywhere else in this unit." },
        { q:"Beliefs: Buddhism, Hinduism, Judaism. Which one does not believe in karma, dharma and reincarnation?", a:"Judaism.", why:"Karma, dharma and reincarnation come out of Hinduism, and Buddhism kept them when it reformed Hinduism. Judaism is not part of that group.", tip:"The two from your Hinduism and Buddhism notes share it. The leftover one is the answer." },
        { q:"Beliefs: believes in the Trinity.", a:"Christianity.", why:"The Nicene Creed says God is three persons in one: the Father who creates, the Son who is Christ, and the Holy Spirit." },
        { q:"Beliefs: believes that living the Five Pillars brings you closer to God.", a:"Islam.", why:"The Five Pillars are the five duties every Muslim carries out, and you already have a card for each one." },
        { q:"Beliefs: the goal of the Eightfold Path in Buddhism.", a:"To end the cycle of reincarnation, meaning rebirth.", why:"The Eightfold Path is the fourth of the Four Noble Truths on your Buddhism cards, the way to stop suffering. Stopping suffering means getting out of the rebirth cycle.", tip:"Same idea as nirvana and moksha on your other cards. Getting out of the loop." },
        { q:"Holy Sites: the city that is a holy site for three world religions.", a:"Jerusalem.", why:"The board asks only for the city. It never names which three religions." },
        { q:"Holy Sites: has the Church of the Nativity.", a:"Christianity.", why:"Nativity means birth. Your Christianity reading places the birth of Jesus at Bethlehem." },
        { q:"Holy Sites: has the Ganges River.", a:"Hinduism.", why:"It is the only holy site on the board that is a river, and your Hinduism stations sheet has a whole station on the Ganges." },
        { q:"Holy Sites: has the Kaaba.", a:"Islam.", why:"Your Origins of Islam cards have a Kaaba card: the cube shaped shrine at Mecca that Muslims face when they pray." },
        { q:"Holy Sites: has a site at Kushinagar for its leader's death.", a:"Buddhism.", why:"The board's leader for Buddhism is Siddhartha Gautama, the Buddha, and Kushinagar is where his death is marked.", tip:"Nativity is a birth, Kushinagar is a death. Those two are the ends of this category." },
        { q:"Christianity: book, founder, symbol, holy site.", a:"The Bible. Jesus. The Cross. The Church of the Nativity." },
        { q:"Judaism: book, founder, symbol, holy site.", a:"The Torah. Abraham. The Star of David. No holy site of its own on the board.", why:"Judaism is the answer or is named in four clues on the board, even though there is no Judaism packet in your folder." },
        { q:"Islam: book, founder, symbol, holy site.", a:"The Quran. Muhammad. The Crescent and Star. The Kaaba." },
        { q:"Hinduism: book, founder, symbol, holy site.", a:"The Vedas or the Bhagavad Gita. No known founder. The Ohm. The Ganges River." },
        { q:"Buddhism: book, founder, symbol, holy site.", a:"None, or the Tipitaka. Siddhartha Gautama. The circle with eight spokes. Kushinagar." }
      ]}
    ] },
  span: { name:"Spanish I",         teacher:"Owsley",  color:"var(--c-span)", units:[
      { name:"Unidad 1A: Introducing Yourself", cards:[
        { q:"¡Hola!", a:"Hello!\nYou can use it at any time of day.", why:"Almost every conversation in this unit starts with it." },
        { q:"¿Cómo te llamas?", a:"What is your name?\nYou answer it with: Me llamo ___", tip:"Word for word it is \"How do you call yourself?\" The llamas part comes from llamar, to call." },
        { q:"Me llamo ___", a:"My name is ___\nExample: Me llamo Alex.", tip:"Literally \"I call myself.\" Same llam- piece as ¿Cómo te llamas?" },
        { q:"¿Y tú?", a:"And you?\nYou say it to bounce the same question back at the other person.", why:"Two words keep the conversation going without building a new sentence. It shows up four times in the Unit 1A dialogue." },
        { q:"Mucho gusto", a:"Nice to meet you.\nBoth people say it, one right after the other.", tip:"Word for word it is \"much pleasure.\"" },
        { q:"¿Cómo se escribe ___?", a:"How do you spell ___?\nExample: ¿Cómo se escribe Sofía?" },
        { q:"Se escribe ___", a:"It is spelled ___\nAfter you say it, you read out the letters one at a time." },
        { q:"¿De dónde eres?", a:"Where are you from?\nYou answer with: Soy de ___", tip:"Dónde means where. The de in front means from." },
        { q:"Soy de ___", a:"I am from ___\nExample: Soy de Argentina." },
        { q:"¿Cuántos años tienes?", a:"How old are you?\nYou answer with: Tengo ___ años", tip:"Keep the ñ in años. Without it the word means something else entirely." },
        { q:"Tengo ___ años", a:"I am ___ years old.\nExample: Tengo quince años means I am 15.", tip:"Spanish says you have years, not that you are years old. Tengo means I have." },
        { q:"¿Cómo estás?", a:"How are you?\nThree answers from the deck: Estoy bien (good), Estoy más o menos (okay), Estoy mal (not good)." },
        { q:"Estoy bien", a:"I am good. I am doing well." },
        { q:"Estoy más o menos", a:"I am okay. So-so.", tip:"Word for word it is \"more or less.\"" },
        { q:"Estoy mal", a:"I am not doing well.\nMal means badly. It is a normal, allowed answer." },
        { q:"Soy de Argentina uses soy. Estoy bien uses estoy. Why two words for am?", a:"Soy is for who you are and where you are from. Those stay the same.\nEstoy is for how you feel right now. Feelings change, so they get estoy.", why:"Both words come out as am in English, so the only way to pick one is by what you are talking about." },
        { q:"Say it in Spanish: ask someone's name, then give yours.", a:"¿Cómo te llamas?\nMe llamo ___\nAdd ¿Y tú? to hand the question back." },
        { q:"Say it in Spanish: ask how someone is, and give all three possible answers.", a:"¿Cómo estás?\nEstoy bien. (good)\nEstoy más o menos. (okay)\nEstoy mal. (not good)" },
        { q:"Say it in Spanish: ask where someone is from, then say where you are from.", a:"¿De dónde eres?\nSoy de ___" },
        { q:"Say it in Spanish: ask someone's age, then give yours.", a:"¿Cuántos años tienes?\nTengo ___ años" },
        { q:"Say it in Spanish: Nice to meet you.", a:"Mucho gusto.\nThe other person says Mucho gusto right back." },
        { q:"Adiós", a:"Goodbye.", tip:"The accent sits on the o: a-di-ÓS." },
        { q:"Hasta luego", a:"See you later.", tip:"Hasta means until. Luego means later. So: until later." },
        { q:"Nos vemos", a:"See you.", tip:"Word for word it is \"we see each other.\"" },
        { q:"Numbers 0 to 5 in Spanish", a:"0 cero\n1 uno\n2 dos\n3 tres\n4 cuatro\n5 cinco" },
        { q:"Numbers 6 to 10 in Spanish", a:"6 seis\n7 siete\n8 ocho\n9 nueve\n10 diez" },
        { q:"Numbers 11 to 15 in Spanish", a:"11 once\n12 doce\n13 trece\n14 catorce\n15 quince", tip:"Quince (15) is worth knowing cold. Tengo quince años is in the class reading." },
        { q:"Numbers 16 to 20 in Spanish", a:"16 dieciséis\n17 diecisiete\n18 dieciocho\n19 diecinueve\n20 veinte", tip:"16 through 19 are just diez y seis, diez y siete, diez y ocho, diez y nueve squashed into one word." },
        { q:"Which number from 0 to 20 has an accent mark?", a:"Dieciséis (16). The accent goes on the e: dieciséis.\nEvery other number from 0 to 20 is written with no accent.", why:"It is the only one in the whole list, so once you spot it you have them all." },
        { q:"What is a cognate?", a:"A word that looks or sounds similar AND has a similar meaning in two languages.\nThat is the deck's own definition.", why:"Cognates are free vocabulary. You already know hundreds of Spanish words without studying them." },
        { q:"Cognate examples from the deck", a:"animal, actor, hospital, capital, chocolate, restaurante, teléfono, música, familia, importante, profesor, problema, estudiante, libro, computadora, escuela", tip:"Libro (book) and escuela (school) are the two that look least like their English words." },
        { q:"False cognate: what does carpeta mean?", a:"Carpeta means folder.\nIt does NOT mean carpet, even though it looks like it." },
        { q:"False cognate: what does éxito mean?", a:"Éxito means success.\nIt does NOT mean exit.", tip:"In Spanish, a hit song is un éxito." },
        { q:"Spanish-speaking countries of North and Central America, with capitals", a:"Mexico: Mexico City\nGuatemala: Guatemala City\nHonduras: Tegucigalpa\nEl Salvador: San Salvador\nNicaragua: Managua\nCosta Rica: San José\nPanama: Panama City", tip:"Three are just the country's name plus City: Mexico City, Guatemala City, Panama City." },
        { q:"Spanish-speaking places in the Caribbean, Europe and Africa, with capitals", a:"Cuba: Havana\nDominican Republic: Santo Domingo\nPuerto Rico: San Juan\nSpain: Madrid\nEquatorial Guinea: the deck lists two, Malabo and Ciudad de la Paz. Malabo is the one on most maps." },
        { q:"Spanish-speaking countries of South America, with capitals", a:"Argentina: Buenos Aires\nBolivia: La Paz and Sucre\nChile: Santiago\nColombia: Bogotá\nEcuador: Quito\nParaguay: Asunción\nPeru: Lima\nUruguay: Montevideo\nVenezuela: Caracas" },
        { q:"Which Spanish-speaking country on the list has two capitals?", a:"Bolivia. La Paz and Sucre.\nSucre is the official capital. La Paz is where the government actually works.", why:"It is the only country on the deck's list with two capitals." },
        { q:"Which two places on the list are outside the Americas?", a:"Spain, in Europe. Capital: Madrid.\nEquatorial Guinea, in Africa. The deck lists two capitals for it, Malabo and Ciudad de la Paz.", why:"Spanish is not only spoken in Latin America, which is the point the deck is making." },
        { q:"Which capitals on the list are written with an accent?", a:"Bogotá (Colombia)\nAsunción (Paraguay)\nSan José (Costa Rica)\nAll the others on the deck's list are written with no accent.", why:"If you write the capitals out, these are the three where an accent is part of the correct spelling." },
        { q:"Argentina: capital, location, and the fact from the deck", a:"Capital: Buenos Aires.\nIt takes up the southern half of South America.\nThe deck's fact: it is home to the Iguazú Falls, the widest major waterfall system in the world." },
        { q:"The five words the deck puts on the Argentina slide", a:"Fútbol: soccer\nAsado: barbecue, grilled meat\nMate: a herbal tea people share\nPatagonia: the wild southern region\nBuenos Aires: the capital city" },
        { q:"¿Cómo se escribe Sofía?", a:"Se escribe: ese, o, efe, i, a.\nThose are the Spanish names of the letters S, O, F, I, A.", why:"This is the deck's own example, so it shows exactly what a full answer sounds like." },
        { q:"What does mayúscula mean when you spell a name out loud?", a:"Capital letter.\nThe deck spells Mateo as: eme mayúscula, a, te, e, o.\nSo eme mayúscula means capital M.", tip:"It comes right after the letter it describes: eme mayúscula, not mayúscula eme." },
        { q:"Translate the class reading passage.", a:"¡Hola! Me llamo Mateo. Soy un estudiante de Argentina. Vivo en Buenos Aires, la capital de Argentina. Me gusta la música, el chocolate y los animales. Tengo quince años.\n\nHi! My name is Mateo. I am a student from Argentina. I live in Buenos Aires, the capital of Argentina. I like music, chocolate and animals. I am fifteen years old." },
        { q:"Class reading: the five answers about Mateo", a:"Name: Mateo\nCountry: Argentina\nCity: Buenos Aires\nLikes: música, chocolate, animales\nAge: 15", tip:"All three things he likes are cognates, so you can read that line without studying it." },
        { q:"Unit 1A dialogue, first half", a:"A: ¡Hola!\nB: ¡Hola! ¿Cómo estás?\nA: Estoy bien. ¿Y tú?\nB: Estoy bien.\nA: ¿Cómo te llamas?\nB: Me llamo ___. ¿Y tú?\nA: Me llamo ___. Mucho gusto.\nB: Mucho gusto." },
        { q:"Unit 1A dialogue, second half", a:"A: ¿De dónde eres?\nB: Soy de ___. ¿Y tú?\nA: Soy de ___.\nB: ¿Cuántos años tienes?\nA: Tengo ___ años. ¿Y tú?\nB: Tengo ___ años.\nA: ¡Hasta luego!\nB: ¡Adiós!" },
        { q:"What order does the Unit 1A conversation go in?", a:"1. Hello\n2. How are you\n3. Names\n4. Nice to meet you\n5. Where you are from\n6. How old you are\n7. Goodbye\nAfter almost every answer, one person adds ¿Y tú?", why:"If you know the order, you only have to remember one line at a time." },
        { q:"¿Qué día viene después de jueves?", a:"The question means: What day comes after Thursday?\nAnswer: viernes (Friday).", tip:"Viene después de means \"comes after.\" The same pattern gets used for months." },
        { q:"¿Qué mes viene después de agosto?", a:"The question means: What month comes after August?\nAnswer: septiembre (September)." },
        { q:"¿Qué tiempo hace hoy?", a:"What is the weather like today?\nTiempo can mean weather or time. Here it means weather.", why:"The deck uses it as a warm up question from an earlier week and never lists the answer phrases, so recognizing the question is all this unit asks for." }
      ]},
      { name:"Unidad 0: Weather, Seasons, Days and Months", cards:[
        { q:"¿Qué tiempo hace?", a:"What is the weather like?\nIt is one of the two ways this sheet gives you to ask about the weather.", why:"Every Hace, Está and Hay phrase in this unit is an answer to this question." },
        { q:"¿Cómo está el clima?", a:"How is the weather?\nIt means the same thing as ¿Qué tiempo hace? Either one works.", tip:"Notice both question marks. Spanish opens a question with ¿ and closes it with ?" },
        { q:"What is the difference between el tiempo and el clima?", a:"On this sheet they are two labels for the same topic, the weather. Either word works in the question.", why:"El tiempo also means time, so the weather meaning is the one to hold on to here." },
        { q:"Spanish weather uses three different verbs. Which one goes where?", a:"Hace goes with heat, cold, and good or bad weather: Hace calor.\nEstá goes with how the sky looks, and with raining or snowing: Está nublado.\nHay goes with fog, lightning and storms: Hay neblina.", why:"Each phrase keeps its own verb. There is no rule that predicts it, so learn them in these three groups." },
        { q:"Which weather phrases use Hace?", a:"Hace calor. It is hot.\nHace fresco. It is cool.\nHace frío. It is cold.\nHace buen tiempo. The weather is good.\nHace mal tiempo. The weather is bad.\nHace ___ grados. It is ___ degrees.", tip:"Hace comes from hacer, to make. Spanish says the weather makes heat where English says it is hot." },
        { q:"Which weather phrases use Está?", a:"Está soleado. It is sunny.\nEstá ventoso. It is windy.\nEstá nublado. It is cloudy.\nEstá parcialmente nublado. It is partly cloudy.\nEstá lloviendo. It is raining.\nEstá nevando. It is snowing.", why:"These describe how the sky looks, or what it is doing right now." },
        { q:"Which weather phrases use Hay?", a:"Hay neblina. It is foggy.\nHay relámpagos. There is lightning.\nHay tormentas. There are storms.", why:"Hay means there is or there are. Spanish says there is fog, not it is foggy." },
        { q:"Está soleado.", a:"It is sunny.", tip:"Soleado comes from sol, the sun." },
        { q:"Está ventoso.", a:"It is windy.", tip:"Ventoso comes from viento, wind. Same root as the word ventilate." },
        { q:"Está nublado.", a:"It is cloudy.", tip:"Nublado comes from nube, cloud." },
        { q:"Está parcialmente nublado.", a:"It is partly cloudy.", tip:"Parcialmente looks like partially, and it means the same thing." },
        { q:"Está lloviendo.", a:"It is raining.", why:"The ending iendo works like the English ending ing. It means the rain is happening right now." },
        { q:"Está nevando.", a:"It is snowing.", tip:"The ando ending works like ing. Nevando comes from nevar, to snow." },
        { q:"Hay neblina.", a:"It is foggy. Word for word it is there is fog.", tip:"Neblina is related to nebula, a cloudy haze." },
        { q:"Hay relámpagos.", a:"There is lightning.", tip:"Relámpago hides the word lamp. Think of a lamp flashing in the sky." },
        { q:"Hay tormentas.", a:"There are storms." },
        { q:"Hace buen tiempo.", a:"The weather is good.", why:"This is the all round answer when the weather is just nice and nothing else stands out." },
        { q:"Hace mal tiempo.", a:"The weather is bad.", tip:"Mal is the same mal as in malfunction. Something is wrong." },
        { q:"How do you say the temperature in Spanish?", a:"Hace ___ grados.\nIt is ___ degrees.\nThe number goes in the blank. Hace quince grados means it is fifteen degrees.", tip:"Grados is the same idea as the English word gradient. Both are steps on a scale." },
        { q:"How do you say it is very hot or very cold?", a:"Put mucho between hace and the word.\nHace mucho calor. It is very hot.\nHace mucho frío. It is very cold.", why:"The sheet lists mucho as a modifier. Use it with calor and frío." },
        { q:"What does las estaciones mean?", a:"The seasons.", tip:"Estación also means station, like a train station. One word, two meanings." },
        { q:"What are the four seasons in Spanish?", a:"el verano, summer\nel otoño, autumn\nel invierno, winter\nla primavera, spring", tip:"Three take el. Only la primavera takes la." },
        { q:"el verano", a:"Summer.\nThe sheet pairs it with Hace calor. It is hot.", why:"The sheet puts a weather phrase next to the season, so learn the two together." },
        { q:"el otoño", a:"Autumn, or fall.\nThe sheet pairs it with Hace fresco. It is cool.", tip:"Otoño and autumn come from the same old word, autumnus." },
        { q:"el invierno", a:"Winter.\nThe sheet pairs it with Hace frío. It is cold.", tip:"Invierno and the English word hibernate come from the same Latin root." },
        { q:"la primavera", a:"Spring.\nThe sheet lists the other three seasons with a weather phrase, but it leaves the space next to primavera empty.", tip:"Prima means first. Primavera is the first season of new growth." },
        { q:"What does Hace fresco mean, and which season goes with it?", a:"It is cool. It goes with el otoño, autumn.", tip:"Fresco is the same word as fresh. Cool air, not cold air." },
        { q:"What are the twelve months in Spanish?", a:"enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre", tip:"Say them out loud. Eleven of the twelve sound close to their English names. Only enero is a real stranger." },
        { q:"Do Spanish months start with a capital letter?", a:"No. Spanish writes months in lowercase: enero, marzo, octubre.\nOnly capitalize one if it starts a sentence.", why:"English capitalizes months and Spanish does not. That difference is the whole rule." },
        { q:"Which Spanish month looks least like its English name?", a:"enero, which is January.\nThe other eleven are close once you say them out loud: febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre.", why:"It means there is really only one to drill." },
        { q:"What does los meses del año mean?", a:"The months of the year.\nel mes is the month. el año is the year.", tip:"Keep the ñ in año. Without it the word means something rude." },
        { q:"What are the seven days in Spanish?", a:"lunes, martes, miércoles, jueves, viernes, sábado, domingo", why:"The Spanish week starts on lunes (Monday), not Sunday. So domingo is last, not first." },
        { q:"Do Spanish days start with a capital letter?", a:"No. Spanish writes days in lowercase: lunes, jueves, domingo.\nOnly capitalize one if it starts a sentence.", tip:"Same rule as the months. Learn one, get both." },
        { q:"Which two days of the week have accent marks?", a:"miércoles and sábado.\nThe accent sits on the é in miércoles and the á in sábado. Every other day has none.", why:"A missing accent is a spelling error, so these two are worth a second look." },
        { q:"Why do the Spanish days sound like the moon and the planets?", a:"Because they are named after them.\nlunes from la luna, the moon\nmartes from Marte, Mars\nmiércoles from Mercurio, Mercury\njueves from Júpiter, Jupiter\nviernes from Venus", tip:"Sábado comes from Sabbath and domingo from the Lord's day, which is why those two break the pattern." },
        { q:"What does los días de la semana mean?", a:"The days of the week.\nel día is the day. la semana is the week.", tip:"Día keeps its accent on the í, even in the plural días." },
        { q:"Ayer fue...", a:"Yesterday was...\nExample: Ayer fue lunes. Yesterday was Monday.", why:"Fue is the past form. It is the piece that makes the sentence about yesterday." },
        { q:"Hoy es...", a:"Today is...\nExample: Hoy es martes. Today is Tuesday.", tip:"The h is silent in Spanish, so hoy sounds like the oy in boy." },
        { q:"Mañana será...", a:"Tomorrow will be...\nExample: Mañana será miércoles. Tomorrow will be Wednesday.", tip:"Mañana means both tomorrow and morning. The ñ and the accent on será both matter." },
        { q:"How do you say yesterday, today and tomorrow was or is or will be a certain day?", a:"Ayer fue... Yesterday was...\nHoy es... Today is...\nMañana será... Tomorrow will be...\nThe day name goes in the blank, in lowercase.", why:"These three are one set. The verb changes with the time: fue, es, será." },
        { q:"What is mayúscula?", a:"A capital letter.\nWhen you spell a name out loud, you add mayúscula to mark a capital. Eme mayúscula means capital M.", tip:"Mayúscula comes from mayor, which means bigger. A bigger letter." },
        { q:"How do you spell the name Sofía out loud in Spanish?", a:"ese - o - efe - i - a\nThose are the Spanish names of the letters S, O, F, I and A.", why:"Spanish letters have their own names, so spelling aloud is its own small skill." },
        { q:"How do you spell the name Mateo out loud in Spanish?", a:"eme mayúscula - ah - te - eh - oh\nMayúscula marks the capital M at the start.", tip:"Say mayúscula right after the letter it applies to, not before." }
      ]}
    ] } /* 0 owed as of 2026-09-20 */,
  zoo:  { name:"Zoology",           teacher:"Finch",   color:"var(--c-zoo)",  units:[
      { name:"Week 2 Vocab: AFNR, FFA, SAE", cards:[
        { q:"What does AFNR stand for?", a:"Agriscience, Food and Natural Resources.", why:"It is the name for the whole field this class sits inside." },
