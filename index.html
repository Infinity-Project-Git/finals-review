        { id:"hist-5451402", q:"Holy Books: the holy book for Hinduism.", a:"The Vedas, or the Bhagavad Gita. Either one counts, and you can say both.", why:"Hinduism does not have one single book. Your Hinduism stations sheet asks for two sacred texts, and Mr. Flores's Jeopardy review accepts either title.", memType:"Link it", mem:"G for Gita, like the G in Ganges, Hinduism's holy river. Hinduism's books: the Vedas and the Bhagavad Gita. Either one counts." },
        { id:"hist-bbac418", q:"Holy Books: the holy book for Buddhism.", a:"There are none. The Tipitaka also counts.", why:"Buddhism has no one book the way Christianity has the Bible. It does have scriptures, called the Tipitaka, which is why both answers work.", memType:"Link it", mem:"The trick question of the category: Buddhism has no one book the way Christianity has the Bible, so \"none\" works. The Tipitaka also counts." },
        { id:"hist-a1a5428", q:"Founder: the founder of Christianity.", a:"Jesus.", why:"Early Christians were Jews who believed Jesus of Nazareth was the messiah, or savior, promised in the Torah.", memType:"Link it", mem:"The founder hides in the name: Christianity comes from Christ, the title given to Jesus. Founder: Jesus." },
        { id:"hist-b2b4eb4", q:"Founder: the founder of Islam.", a:"Muhammad.", why:"Islam begins with Muhammad's revelations. Your Origins of Islam cards follow his life from Mecca, to Medina, and back to Mecca.", memType:"Link it", mem:"The three M's of Islam: Muslims follow it, it began in Mecca, and its founder is Muhammad." },
        { id:"hist-68c8556", q:"Founder: the founder of Judaism.", a:"Abraham.", why:"Abraham is the answer in Mr. Flores's Jeopardy review. A textbook usually names Moses as well, so both names turn up in different places.", memType:"Link it", mem:"A starts the alphabet, and Abraham starts Judaism. Founder of Judaism: Abraham." },
        { id:"hist-ed3829f", q:"Founder: the founder of Buddhism.", a:"Siddhartha Gautama, also called the Buddha.", why:"Either name works. Buddhism is a reform of Hinduism, and Siddhartha Gautama is the person it started with.", memType:"Link it", mem:"The founder's title is in the name, like Christ in Christianity: Buddha in Buddhism. The Buddha's name was Siddhartha Gautama." },
        { id:"hist-6b04324", q:"Founder: the founder of Hinduism.", a:"There is no known founder.", why:"Hinduism developed slowly over a long time instead of starting with one teacher.", memType:"Link it", mem:"Like the English language, Hinduism has no single inventor; it grew slowly over a long time. Two blanks: Hinduism no founder, Buddhism no book." },
        { id:"hist-b2db543", q:"Symbol: the Cross.", a:"Christianity.", why:"Pontius Pilate sentenced Jesus to death on a cross, and Christians believe he rose three days later.", memType:"Link it", mem:"Cross and Christ start with the same KR sound. Christians use the cross because Jesus was put to death on one." },
        { id:"hist-d2d1d2c", q:"Symbol: the Star of David.", a:"Judaism.", memType:"Link it", mem:"David, as in David and Goliath, from the Hebrew Bible. Star of David goes with Judaism. The star beside a crescent is Islam." },
        { id:"hist-c576f53", q:"Symbol: the Crescent and Star.", a:"Islam.", why:"It is the only symbol in Mr. Flores's Jeopardy review that names two things, a crescent and a star, so it is easy to pick out.", memType:"Picture it", mem:"A crescent moon and a star over the desert city of Mecca, home of the Kaaba. Crescent and Star means Islam." },
        { id:"hist-4233d39", q:"Symbol: the Ohm symbol.", a:"Hinduism.", memType:"Sounds like", mem:"Ohm sounds like home. Picture the Ohm sign over the door of a home beside the Ganges River: Hinduism." },
        { id:"hist-6234c55", q:"Symbol: the circle with eight spokes.", a:"Buddhism.", why:"Your Hinduism and Buddhism notes say the way to end suffering is the eight-fold path of Buddhism.", memType:"Link it", mem:"Count the spokes: eight spokes, Eightfold Path, Buddhism. The number on the wheel matches the path." },
        { id:"hist-deccce2", q:"Beliefs: Brahman, Shiva, Aadharsha, Vishnu. Which one is not a Hindu god?", a:"Aadharsha.", why:"Brahman, Shiva and Vishnu are all Hindu names. You already know Brahman as the universal soul. Aadharsha is the one that does not belong.", memType:"Link it", mem:"Shiva and Vishnu are two of Hinduism's best-known gods, and Brahman is its universal soul. Aadharsha matches none of them, so it is the odd one out." },
        { id:"hist-de7c66e", q:"Beliefs: Buddhism, Hinduism, Judaism. Which one does not believe in karma, dharma and reincarnation?", a:"Judaism.", why:"Karma, dharma and reincarnation come out of Hinduism, and Buddhism kept them when it reformed Hinduism. Judaism is not part of that group.", memType:"Link it", mem:"Buddhism grew out of Hinduism, so the two share karma, dharma and reincarnation, like family traits. Judaism is the leftover: the answer." },
        { id:"hist-b220d8a", q:"Beliefs: believes in the Trinity.", a:"Christianity.", why:"The Nicene Creed says God is three persons in one: the Father who creates, the Son who is Christ, and the Holy Spirit.", memType:"Link it", mem:"Tri means three, as in triangle. The Trinity is three persons in one God: Father, Son, Holy Spirit. That belief is Christianity." },
        { id:"hist-35336d5", q:"Beliefs: believes that living the Five Pillars brings you closer to God.", a:"Islam.", why:"The Five Pillars are the five duties every Muslim carries out, and you already have a card for each one.", memType:"Link it", mem:"Pillars hold up a building the way five duties hold up Islam: faith, prayer, charity, fasting, pilgrimage. Five Pillars means Islam." },
        { id:"hist-0541d5c", q:"Beliefs: the goal of the Eightfold Path in Buddhism.", a:"To end the cycle of reincarnation, meaning rebirth.", why:"The Eightfold Path is the fourth of the Four Noble Truths on your Buddhism cards, the way to stop suffering. Stopping suffering means getting out of the rebirth cycle.", memType:"Link it", mem:"Getting out of the loop: the Eightfold Path aims to end the cycle of reincarnation, or rebirth. Same idea as nirvana and moksha." },
        { id:"hist-8afd8de", q:"Holy Sites: the city that is a holy site for three world religions.", a:"Jerusalem.", why:"Mr. Flores's Jeopardy review asks only for the city. The three religions are Judaism, Christianity and Islam.", memType:"Picture it", mem:"One old walled city where a Jewish holy wall, Christian churches and a gold-domed mosque stand close together: Jerusalem, holy to all three faiths." },
        { id:"hist-86b5cc9", q:"Holy Sites: has the Church of the Nativity.", a:"Christianity.", why:"Nativity means birth. Your Christianity reading places the birth of Jesus at Bethlehem.", memType:"Link it", mem:"Nativity means birth, like native, the place you were born. Church of the Nativity: the birth of Jesus, so Christianity." },
        { id:"hist-9908f1f", q:"Holy Sites: has the Ganges River.", a:"Hinduism.", why:"It is the only holy site in Mr. Flores's Jeopardy review that is a river, and your Hinduism stations sheet has a whole station on the Ganges.", memType:"Link it", mem:"The Ganges flows through India, home to most of the world's Hindus, who treat it as a holy river and bathe in it." },
        { id:"hist-9ef9b29", q:"Holy Sites: has the Kaaba.", a:"Islam.", why:"Your Origins of Islam cards have a Kaaba card: the cube shaped shrine at Mecca that Muslims face when they pray.", memType:"Link it", mem:"Kaaba is Arabic for cube: the cube-shaped shrine in Mecca that Muslims face when they pray. Kaaba goes with Islam." },
        { id:"hist-68135e9", q:"Holy Sites: has a site at Kushinagar for its leader's death.", a:"Buddhism.", why:"The founder of Buddhism is Siddhartha Gautama, the Buddha, and Kushinagar is where his death is marked.", memType:"Sounds like", mem:"Kushinagar starts like cushion. Picture a quiet meditation cushion at the place marking the Buddha's death: Buddhism." },
        { id:"hist-c645eb7", q:"Christianity: book, founder, symbol, holy site.", a:"The Bible. Jesus. The Cross. The Church of the Nativity.", memType:"Story", mem:"Jesus, born where the Church of the Nativity now stands, dies on a cross, and his life is written in the Bible." },
        { id:"hist-12362b7", q:"Judaism: book, founder, symbol, holy site.", a:"The Torah. Abraham. The Star of David. Jerusalem, a holy city it shares with Christianity and Islam.", why:"Judaism is the answer or is named in four clues in Mr. Flores's Jeopardy review, even though there is no Judaism packet in your folder. Its holy site there is Jerusalem, the city holy to three religions.", memType:"First letters", mem:"Title it The Ancient Star of Jerusalem: T for Torah, A for Abraham, the Star of David, and Jerusalem, holy to Jews, Christians and Muslims." },
        { id:"hist-aeb3c80", q:"Islam: book, founder, symbol, holy site.", a:"The Quran. Muhammad. The Crescent and Star. The Kaaba.", memType:"Story", mem:"Muhammad receives the revelations that become the Quran, then returns to Mecca and the Kaaba. Islam's symbol: the Crescent and Star." },
        { id:"hist-e5a741d", q:"Hinduism: book, founder, symbol, holy site.", a:"The Vedas or the Bhagavad Gita. No known founder. The Ohm. The Ganges River.", memType:"Link it", mem:"Two G's: the Bhagavad Gita, or the Vedas, and the Ganges. Add the Ohm, which sounds like home, and no known founder." },
        { id:"hist-3f431a6", q:"Buddhism: book, founder, symbol, holy site.", a:"None, or the Tipitaka. Siddhartha Gautama. The circle with eight spokes. Kushinagar.", memType:"Link it", mem:"No single book, or the Tipitaka; founder Siddhartha Gautama, the Buddha; a circle with eight spokes; Kushinagar, which starts like cushion." }
      ]}
    ] },
  span: { name:"Spanish I",         teacher:"Owsley",  color:"var(--c-span)", units:[
      { name:"Unidad 1A: Introducing Yourself", cards:[
        { id:"span-dce5230", q:"¡Hola!", a:"Hello.\nYou can use it at any time of day.", why:"Almost every conversation in this unit starts with it.", memType:"Sounds like", mem:"You wave hello and a friend sings back an opera oh, la. It works morning, noon or night.", sound:"OH-lah, like \"oh, la\"" },
        { id:"span-65432b5", q:"¿Cómo te llamas?", a:"What is your name?\nYou answer it with: Me llamo ___", memType:"Sounds like", mem:"Waking from a coma, you ask Tay, a mossy rock: yah, moss, what do they call you? What is your name?", sound:"KOH-moh teh YAH-mahs, like \"coma, Tay, yah moss\"" },
        { id:"span-9a76fee", q:"Me llamo ___", a:"My name is ___\nExample: Me llamo Alex.", memType:"Sounds like", mem:"May mows her name into the lawn, shouting yah: I call myself May. My name is May.", sound:"meh YAH-moh, like \"May, yah, mow\"" },
        { id:"span-b38bd39", q:"¿Y tú?", a:"And you?\nYou say it to bounce the same question back at the other person.", why:"Two words keep the conversation going without building a new sentence. It shows up four times in the Unit 1A dialogue.", memType:"Sounds like", mem:"Your friend answers, then points back at you with a squeaky eee, too? Your turn: and you?", sound:"ee TOO, like \"eee, too\"" },
        { id:"span-644770a", q:"Mucho gusto", a:"Nice to meet you.\nBoth people say it, one right after the other.", memType:"Sounds like", mem:"A mooching cow shakes a goose's toe: oh, much pleasure, nice to meet you. The goose says it right back.", sound:"MOO-choh GOOS-toh, like \"mooch, oh, goose toe\"" },
        { id:"span-46a6a22", q:"¿Cómo se escribe ___?", a:"How do you spell ___?\nExample: ¿Cómo se escribe Sofía?", memType:"Sounds like", mem:"Waking from a coma, you say: ask Reba how to spell it. Reba writes every name letter by letter.", sound:"KOH-moh seh ehs-KREE-beh, like \"coma, say, ask Reba\"" },
        { id:"span-df8b9a6", q:"Se escribe ___", a:"It is spelled ___\nAfter you say it, you read out the letters one at a time.", memType:"Sounds like", mem:"Ask Reba and she will say: it is spelled, then read out the letters one at a time.", sound:"seh ehs-KREE-beh, like \"say, ask Reba\"" },
        { id:"span-d17ac6f", q:"¿De dónde eres?", a:"Where are you from?\nYou answer with: Soy de ___", memType:"Sounds like", mem:"On Don Day, Don meets an heiress and asks: from where are you? De means from, dónde means where.", sound:"deh DOHN-deh EH-rehs, like \"day, Don Day, heiress\"" },
        { id:"span-a5f5a50", q:"Soy de ___", a:"I am from ___\nExample: Soy de Argentina.", memType:"Sounds like", mem:"A soy sauce bottle brags every day about where it is from: I am from Argentina.", sound:"SOY deh, like \"soy, day\"" },
        { id:"span-cd6d58d", q:"¿Cuántos años tienes?", a:"How old are you?\nYou answer with: Tengo ___ años", memType:"Sounds like", mem:"Kwan balances onions on his toes at tennis, one per year: how old are you? Keep the ñ, the ny in onions.", sound:"KWAHN-tohs AH-nyohs TYEH-nehs, like \"Kwan toes, onions, tennis\"" },
        { id:"span-235576c", q:"Tengo ___ años", a:"I am ___ years old.\nExample: Tengo quince años means I am 15.", memType:"Sounds like", mem:"Ten, go: grab your onions. I have fifteen onions, one per year. Spanish says you have years: tengo, I have.", sound:"TEHN-goh ___ AH-nyohs, like \"ten, go ___ onions\"" },
        { id:"span-208018d", q:"¿Cómo estás?", a:"How are you?\nThree answers from your class slides: Estoy bien (good), Estoy más o menos (okay), Estoy mal (not good).", memType:"Sounds like", mem:"May wakes from a coma. You S toss her a toy: how are you? S toy bean (good), S toy, moss, oh, May knows (okay), S toy mall (not good).", sound:"KOH-moh ehs-TAHS, like \"coma, S toss\". ehs-TOY BYEHN, like \"S toy bean\". ehs-TOY MAHS oh MEH-nohs, like \"S toy, moss, oh, May knows\". ehs-TOY MAHL, like \"S toy, mall\"" },
        { id:"span-5c92269", q:"Estoy bien", a:"I am good. I am doing well.", memType:"Sounds like", mem:"Your S toy is a smiling bean that squeaks: I am good, doing well.", sound:"ehs-TOY BYEHN, like \"S toy bean\"" },
        { id:"span-f93142a", q:"Estoy más o menos", a:"I am okay. So-so.", memType:"Sounds like", mem:"Your S toy has a little moss on it, oh. May knows it is okay, more or less.", sound:"ehs-TOY MAHS oh MEH-nohs, like \"S toy, moss, oh, May knows\"" },
        { id:"span-153bb4c", q:"Estoy mal", a:"I am not doing well.\nMal means badly. It is a normal, allowed answer.", memType:"Sounds like", mem:"Your S toy got lost at the mall, and you feel bad: I am not doing well.", sound:"ehs-TOY MAHL, like \"S toy, mall\"" },
        { id:"span-397272f", q:"Soy de Argentina uses soy. Estoy bien uses estoy. Why two words for am?", a:"Soy is for who you are and where you are from. Those stay the same.\nEstoy is for how you feel right now. Feelings change, so they get estoy.", why:"Both words come out as am in English, so the only way to pick one is by what you are talking about.", memType:"Link it", mem:"Soy is your player profile: name and home country stay put. Estoy is your health bar right now, and it changes." },
        { id:"span-1b6c47e", q:"Say it in Spanish: ask someone's name, then give yours.", a:"¿Cómo te llamas?\nMe llamo ___\nAdd ¿Y tú? to hand the question back.", memType:"Sounds like", mem:"Tay wakes from a coma on moss and asks: coma, Tay, yah moss? (what's your name?) The mower says: May, yah, mow (my name is May). Eee, too? (and you?)", sound:"KOH-moh teh YAH-mahs, like \"coma, Tay, yah moss\". meh YAH-moh, like \"May, yah, mow\". ee TOO, like \"eee, too\"" },
        { id:"span-dc3147c", q:"Say it in Spanish: ask how someone is, and give all three possible answers.", a:"¿Cómo estás?\nEstoy bien. (good)\nEstoy más o menos. (okay)\nEstoy mal. (not good)", memType:"Sounds like", mem:"May wakes from a coma. You S toss her a toy: how are you? S toy bean (good), S toy, moss, oh, May knows (okay), S toy mall (not good).", sound:"KOH-moh ehs-TAHS, like \"coma, S toss\". ehs-TOY BYEHN, like \"S toy bean\". ehs-TOY MAHS oh MEH-nohs, like \"S toy, moss, oh, May knows\". ehs-TOY MAHL, like \"S toy, mall\"" },
        { id:"span-85a872d", q:"Say it in Spanish: ask where someone is from, then say where you are from.", a:"¿De dónde eres?\nSoy de ___", memType:"Sounds like", mem:"On Don Day, Don asks an heiress where she is from. She waves her soy sauce every day: I am from ___.", sound:"deh DOHN-deh EH-rehs, like \"day, Don Day, heiress\". SOY deh, like \"soy, day\"" },
        { id:"span-7a7dd0e", q:"Say it in Spanish: ask someone's age, then give yours.", a:"¿Cuántos años tienes?\nTengo ___ años", memType:"Sounds like", mem:"Kwan balances onions on his toes at tennis: how old are you? Ten, go: I have fifteen onions, one per year.", sound:"KWAHN-tohs AH-nyohs TYEH-nehs, like \"Kwan toes, onions, tennis\". TEHN-goh ___ AH-nyohs, like \"ten, go ___ onions\"" },
        { id:"span-bbeb39b", q:"Say it in Spanish: Nice to meet you.", a:"Mucho gusto.\nThe other person says Mucho gusto right back.", memType:"Sounds like", mem:"The mooching cow shakes the goose's toe: oh, nice to meet you. The goose says it straight back.", sound:"MOO-choh GOOS-toh, like \"mooch, oh, goose toe\"" },
        { id:"span-b33b9f2", q:"Adiós", a:"Goodbye.", memType:"Sounds like", mem:"The nurse hands you a dose and waves goodbye. Lean on the dose: the accent sits on the o, a-di-ÓS.", sound:"ah-DYOHS, like \"a dose\"" },
        { id:"span-7c50039", q:"Hasta luego", a:"See you later.", memType:"Sounds like", mem:"You leave your pasta Lego castle until later and wave: see you later. Hasta means until, luego means later.", sound:"AHS-tah LWEH-goh, like \"pasta Lego\" with no p" },
        { id:"span-c5bcee4", q:"Nos vemos", a:"See you.", memType:"Sounds like", mem:"Two friends bump noses on a bay of moss: we see each other. See you.", sound:"nohs BEH-mohs, like \"nose, bay moss\"" },
        { id:"span-e1f423b", q:"Numbers 0 to 5 in Spanish", a:"0 cero\n1 uno\n2 dos\n3 tres\n4 cuatro\n5 cinco", memType:"Sounds like", mem:"0: an O, said oh. 1: Uno, one card left. 2: two-pill dose. 3: three-strand tress. 4: quad row. 5: high-five a sink, oh.", sound:"SEH-roh, OO-noh, DOHS, TREHS, KWAH-troh, SEEN-koh, like \"said oh, Uno, dose, tress, quad row, sink oh\"" },
        { id:"span-77f6947", q:"Numbers 6 to 10 in Spanish", a:"6 seis\n7 siete\n8 ocho\n9 nueve\n10 diez", memType:"Sounds like", mem:"6: say S six times. 7: seven S-yetis. 8: octopus nachos: oh, cho. 9: nine new webs, eh. 10: ten toes, Dee, yes.", sound:"SAYS, SYEH-teh, OH-choh, NWEH-beh, DYEHS, like \"say S, S-yeti, oh-cho, new web eh, Dee yes\"" },
        { id:"span-0589525", q:"Numbers 11 to 15 in Spanish", a:"11 once\n12 doce\n13 trece\n14 catorce\n15 quince", memType:"Sounds like", mem:"Each ends in say. 11 own, say. 12 dough, say. 13 tress, say. 14 cat tore, say. 15 keen, say: fifteen and keen to drive.", sound:"OHN-seh, DOH-seh, TREH-seh, kah-TOHR-seh, KEEN-seh, like \"own, say\", \"dough, say\", \"tress, say\", \"cat tore, say\", \"keen, say\"" },
        { id:"span-6cc8875", q:"Numbers 16 to 20 in Spanish", a:"16 dieciséis\n17 diecisiete\n18 dieciocho\n19 diecinueve\n20 veinte", memType:"Sounds like", mem:"16 to 19 are diez y seis squashed: Dee-yes-see, then say S, S-yeti, oh-cho, new web. 20: Bane, tay.", sound:"dyeh-see-SAYS, dyeh-see-SYEH-teh, dyeh-see-OH-choh, dyeh-see-NWEH-beh, BAYN-teh, like \"Dee-yes-see\" plus \"say S, S-yeti, oh-cho, new web\", then \"Bane, tay\"" },
        { id:"span-06be0ee", q:"Which number from 0 to 20 has an accent mark?", a:"Dieciséis (16). The accent goes on the e: dieciséis.\nEvery other number from 0 to 20 is written with no accent.", why:"It is the only one in the whole list, so once you spot it you have them all.", memType:"Sounds like", mem:"Dee-yes-see, say S: the accent hat sits on the e of seis, where your voice leans. Sixteen is the only one wearing it.", sound:"dyeh-see-SAYS, like \"Dee-yes-see, say S\"" },
        { id:"span-0d736d6", q:"What is a cognate?", a:"A word that looks or sounds similar AND has a similar meaning in two languages.\nThat is the definition on your class slides.", why:"Cognates are free vocabulary. You already know hundreds of Spanish words without studying them.", memType:"Link it", mem:"Cognates are word cousins: they look or sound alike AND mean the same thing, like chocolate and chocolate, música and music." },
        { id:"span-e7be24e", q:"Name some Spanish words that are cognates of English words.", a:"animal, actor, hospital, capital, chocolate, restaurante, teléfono, música, familia, importante, profesor, problema, estudiante, libro (book), computadora, escuela (school)", why:"Libro and escuela are on the class list too, but they are harder to spot: libro is related to library, and escuela to school.", memType:"Story", mem:"An actor eats chocolate at a restaurante in the capital, gets sick, and the hospital calls his familia on the teléfono: importante problema. At escuela (S, quell, ah), a profesor, an estudiante and the class animal share a computadora, música and a libro (Lee, bro).", sound:"LEE-broh, like \"Lee, bro\". ehs-KWEH-lah, like \"S, quell, ah\"" },
        { id:"span-7b64a68", q:"False cognate: what does carpeta mean?", a:"Carpeta means folder.\nIt does NOT mean carpet, even though it looks like it.", memType:"Sounds like", mem:"A pet riding in the car hugs a folder of papers: car, pet, ah. Carpeta is a folder.", sound:"kahr-PEH-tah, like \"car, pet, ah\"" },
        { id:"span-8b6c2ff", q:"False cognate: what does éxito mean?", a:"Éxito means success.\nIt does NOT mean exit.", memType:"Sounds like", mem:"X marks the treasure. See, toe? You kicked it up: success. A hit song is un éxito.", sound:"EHK-see-toh, like \"X, see, toe\"" },
        { id:"span-ed346b8", q:"Spanish-speaking countries of North and Central America, with capitals", a:"Mexico: Mexico City\nGuatemala: Guatemala City\nHonduras: Tegucigalpa\nEl Salvador: San Salvador\nNicaragua: Managua\nCosta Rica: San José\nPanama: Panama City", memType:"Link it", mem:"Mexico, Guatemala and Panama just add City. El Salvador and Costa Rica start with San: San Salvador, San José. Nicaragua keeps its agua: Managua. Honduras gets the long one: Tay, goosey, gal, pa, Tegucigalpa." },
        { id:"span-60f0973", q:"Spanish-speaking places in the Caribbean, Europe and Africa, with capitals", a:"Cuba: Havana\nDominican Republic: Santo Domingo\nPuerto Rico: San Juan\nSpain: Madrid\nEquatorial Guinea: your class slides list two, Malabo and Ciudad de la Paz. Malabo is the one on most maps.", memType:"Link it", mem:"Real Madrid: Spain. Dominican holds Domingo: Santo Domingo. Have a Cuban sandwich: Havana. Puerto Rico is number Juan: San Juan. Equatorial Guinea: Malabo, plus Ciudad de la Paz." },
        { id:"span-35dd082", q:"Spanish-speaking countries of South America, with capitals", a:"Argentina: Buenos Aires\nBolivia: La Paz and Sucre\nChile: Santiago\nColombia: Bogotá\nEcuador: Quito\nParaguay: Asunción\nPeru: Lima\nUruguay: Montevideo\nVenezuela: Caracas", memType:"Link it", mem:"Peru: Lima, like lima beans. Venezuela: car races, Caracas. Uruguay: a video, Montevideo. Paraguay: parasol, sun, Asunción. Bolivia has two: La Paz and Sucre. Argentina: good air, Buenos Aires. Chile: a chilly Santa, Santiago. Colombia: Columbus's boat, Bogotá. Ecuador: equator mosquitoes, Quito." },
        { id:"span-d45fab0", q:"Which Spanish-speaking country on the list has two capitals?", a:"Bolivia. La Paz and Sucre.\nSucre is the official capital. La Paz is where the government actually works.", why:"It is the only country on your class list of Spanish-speaking countries with two capitals.", memType:"Picture it", mem:"Bolivia has two capitals: Queen Sucre, sweet as sucrose, holds the official title while La Paz does the real government work." },
        { id:"span-e7a6952", q:"Which two places on the list are outside the Americas?", a:"Spain, in Europe. Capital: Madrid.\nEquatorial Guinea, in Africa. Your class slides list two capitals for it, Malabo and Ciudad de la Paz.", why:"Spanish is not only spoken in Latin America, which is the point your class slides are making.", memType:"Link it", mem:"Spain is where Spanish started, in Europe: think Real Madrid. Equatorial Guinea sits near the equator in Africa: Malabo and Ciudad de la Paz." },
        { id:"span-12208a7", q:"Which capitals on the list are written with an accent?", a:"Bogotá (Colombia)\nAsunción (Paraguay)\nSan José (Costa Rica)\nAll the others on your class list are written with no accent.", why:"If you write the capitals out, these are the three where an accent is part of the correct spelling.", memType:"First letters", mem:"B, A, S: the accents play bass. Bogotá, Asunción, San José, each with the accent on the last syllable." },
        { id:"span-6852380", q:"Argentina: what is its capital, where is it, and what famous waterfalls is it home to?", a:"Capital: Buenos Aires.\nIt is in the southern half of South America.\nIt is home to the Iguazú Falls, the widest major waterfall system in the world.", memType:"Picture it", mem:"Ride the world's widest waterfall, Iguazú, south down South America and splash down in the capital, Buenos Aires." },
        { id:"span-ff5f5c9", q:"Fútbol, asado, mate, Patagonia, Buenos Aires: what is each one, and which country are they all associated with?", a:"All five are associated with Argentina.\nFútbol: soccer\nAsado: barbecue, grilled meat\nMate: a herbal tea people share\nPatagonia: the wild southern region\nBuenos Aires: the capital city", memType:"Sounds like", mem:"Argentina's capital, Buenos Aires: soccer (football) fans barbecue meat on a sod, oh, share herbal tea ('Ma, tay?'), then tour wild southern Patagonia.", sound:"FOOT-bohl, like \"football\". ah-SAH-doh, like \"a sod, oh\". MAH-teh, like \"ma, tay\"" },
        { id:"span-86e66a3", q:"¿Cómo se escribe Sofía?", a:"Se escribe: ese, o, efe, i, a.\nThose are the Spanish names of the letters S, O, F, I, A.", why:"This is the example on your class slides, so it shows exactly what a full answer sounds like.", memType:"Sounds like", mem:"Sofía writes an essay, oh, F-ay, ee, ah: that spells her name. S and F get an e on each side: ese, efe.", sound:"EH-seh, OH, EH-feh, EE, AH, like \"essay, oh, F-ay, ee, ah\"" },
        { id:"span-7b8f2fb", q:"What does mayúscula mean when you spell a name out loud?", a:"Capital letter.\nYour class slides spell Mateo as: eme mayúscula, a, te, e, o.\nSo eme mayúscula means capital M.", memType:"Sounds like", mem:"Ma says: use cool capitals, ah. Eme mayúscula is a capital M, and mayúscula comes after the letter.", sound:"mah-YOOS-koo-lah, like \"ma, use cool, ah\"" },
        { id:"span-9a6cf26", q:"What does this mean in English? ¡Hola! Me llamo Mateo. Soy un estudiante de Argentina. Vivo en Buenos Aires, la capital de Argentina. Me gusta la música, el chocolate y los animales. Tengo quince años.", a:"Hi. My name is Mateo. I am a student from Argentina. I live in Buenos Aires, the capital of Argentina. I like music, chocolate and animals. I am fifteen years old.", memType:"Sounds like", mem:"A bee with a bow lives in Buenos Aires: vivo en, I live in. May's goose goes tah over chocolate: me gusta, I like.", sound:"BEE-boh ehn, like \"bee, bow, in\". meh GOOS-tah, like \"May, goose, tah\"" },
        { id:"span-3ea37f9", q:"Read it: ¡Hola! Me llamo Mateo. Soy un estudiante de Argentina. Vivo en Buenos Aires, la capital de Argentina. Me gusta la música, el chocolate y los animales. Tengo quince años. What are his name, country, city, likes and age?", a:"Name: Mateo\nCountry: Argentina\nCity: Buenos Aires\nLikes: música, chocolate, animales\nAge: 15", memType:"Picture it", mem:"Picture Mateo's player card: age 15, lives in Buenos Aires, Argentina, holding chocolate, headphones and a puppy. All three likes are cognates." },
        { id:"span-f228f8d", q:"Say it in Spanish: two people greet each other, ask how they are, trade names, and say nice to meet you.", a:"A: ¡Hola!\nB: ¡Hola! ¿Cómo estás?\nA: Estoy bien. ¿Y tú?\nB: Estoy bien.\nA: ¿Cómo te llamas?\nB: Me llamo ___. ¿Y tú?\nA: Me llamo ___. Mucho gusto.\nB: Mucho gusto.", memType:"Sounds like", mem:"Two patients wake from comas in beds side by side. Oh, la. Coma, S toss? (how are you?) S toy bean, eee, too? Coma, Tay, yah moss? (name?) May, yah, mow. They shake hands: mooch, oh, goose toe (nice to meet you).", sound:"OH-lah, like \"oh, la\". KOH-moh ehs-TAHS, like \"coma, S toss\". ehs-TOY BYEHN, like \"S toy bean\". ee TOO, like \"eee, too\". KOH-moh teh YAH-mahs, like \"coma, Tay, yah moss\". meh YAH-moh, like \"May, yah, mow\". MOO-choh GOOS-toh, like \"mooch, oh, goose toe\"" },
        { id:"span-693ae88", q:"Say it in Spanish: two people ask each other where they are from and how old they are, then say goodbye.", a:"A: ¿De dónde eres?\nB: Soy de ___. ¿Y tú?\nA: Soy de ___.\nB: ¿Cuántos años tienes?\nA: Tengo ___ años. ¿Y tú?\nB: Tengo ___ años.\nA: ¡Hasta luego!\nB: ¡Adiós!", memType:"Sounds like", mem:"Don Day, an heiress, asks where you are from: day, Don Day, heiress? Soy, day... (I'm from...). Eee, too? Your age: Kwan toes, onions, tennis? Ten, go fifteen onions (I'm fifteen). Leaving: pasta Lego (see you later), a dose (bye).", sound:"deh DOHN-deh EH-rehs, like \"day, Don Day, heiress\". SOY deh, like \"soy, day\". ee TOO, like \"eee, too\". KWAHN-tohs AH-nyohs TYEH-nehs, like \"Kwan toes, onions, tennis\". TEHN-goh ___ AH-nyohs, like \"ten, go ___ onions\". AHS-tah LWEH-goh, like \"pasta Lego\" with no p. ah-DYOHS, like \"a dose\"" },
        { id:"span-6626a00", q:"When you introduce yourself in a Spanish conversation, what order do the parts go in?", a:"1. Hello\n2. How are you\n3. Names\n4. Nice to meet you\n5. Where you are from\n6. How old you are\n7. Goodbye\nAfter almost every answer, one person adds ¿Y tú?", why:"If you know the order, you only have to remember one line at a time.", memType:"Story", mem:"New kid: say hi, ask how he is, swap names, shake hands, ask where from, ask age, wave bye. Bounce each back: ¿Y tú?" },
        { id:"span-bc3b652", q:"¿Qué día viene después de jueves?", a:"The question means: What day comes after Thursday?\nAnswer: viernes (Friday).", memType:"Sounds like", mem:"Bess drinks whey on Thursday. What day comes after? Friday: a bee in the air visits Ness. Viene después de: comes after.", sound:"HWEH-behs, like \"whey, Bess\". BYEHR-nehs, like \"bee, air, Ness\"" },
        { id:"span-632dfaa", q:"¿Qué mes viene después de agosto?", a:"The question means: What month comes after August?\nAnswer: septiembre (September).", memType:"Sounds like", mem:"A ghost, oh, haunts August. The month that comes after is September, when the ghost heads back to school.", sound:"ah-GOHS-toh, like \"a ghost, oh\". sehp-TYEHM-breh, like \"September\"" },
        { id:"span-3f0fa00", q:"¿Qué tiempo hace hoy?", a:"What is the weather like today?\nTiempo can mean weather or time. Here it means weather.", why:"Your Unidad 1A slides use it as a warm up question and do not list answers there. The answers are the Hace, Está and Hay weather phrases from Unidad 0.", memType:"Sounds like", mem:"Kay taps her temp-oh app: ah, say, oy, what is the weather like today? Here tiempo means weather, not time.", sound:"KEH TYEHM-poh AH-seh OY, like \"Kay, temp-oh, ah-say, oy\"" }
      ]},
      { name:"Unidad 0: Weather, Seasons, Days and Months", cards:[
        { id:"span-5059b9f", q:"¿Qué tiempo hace?", a:"What is the weather like?\nIt is one of two ways your Unidad 0 sheet asks about the weather. The other is ¿Cómo está el clima?", why:"Every Hace, Está and Hay phrase in this unit is an answer to this question.", memType:"Sounds like", mem:"Kay checks her temp-oh app and asks, ah, say, what is the weather like?", sound:"KEH TYEHM-poh AH-seh, like \"Kay, temp-oh, ah-say\"" },
        { id:"span-5eabb9b", q:"¿Cómo está el clima?", a:"How is the weather?\nIt means the same thing as ¿Qué tiempo hace? Either one works.", memType:"Sounds like", mem:"Ma stops combing, oh, sees a star in a clean sky, and asks: how is the weather? Spanish opens that question with ¿.", sound:"KOH-moh ehs-TAH ehl KLEE-mah, like \"comb-oh, a star, el clean Ma\"" },
        { id:"span-24a2aa2", q:"What is the difference between el tiempo and el clima?", a:"On your Unidad 0 sheet they are two labels for the same topic, the weather. Either word works in the question.", why:"El tiempo also means time, so the weather meaning is the one to hold on to here. Outside class, el clima often means climate, the usual weather of a place over many years.", memType:"Link it", mem:"Tiempo shows up like a phone lock screen: time and weather together. Clima looks like climate. Both mean the weather here." },
        { id:"span-2b970da", q:"Spanish weather uses three different verbs. Which one goes where?", a:"Hace goes with heat, cold, and good or bad weather: Hace calor.\nEstá goes with how the sky looks, and with raining or snowing: Está nublado.\nHay goes with fog, lightning and storms: Hay neblina.", why:"Each phrase keeps its own verb. There is no rule that predicts it, so learn them in these three groups.", memType:"Link it", mem:"Weather app: Hace is the feels-like line (hot, cold, nice, bad). Está is the sky icon. Hay is the fog, lightning and storm alert." },
        { id:"span-3a99714", q:"Which weather phrases use Hace?", a:"Hace calor. It is hot.\nHace fresco. It is cool.\nHace frío. It is cold.\nHace buen tiempo. The weather is good.\nHace mal tiempo. The weather is bad.\nHace ___ grados. It is ___ degrees.", memType:"Link it", mem:"Hace, from hacer, to make: the weather makes heat. Thermostat: calor, fresco, frío on the dial, grados on the screen, buen or mal tiempo." },
        { id:"span-b54795b", q:"Which weather phrases use Está?", a:"Está soleado. It is sunny.\nEstá ventoso. It is windy.\nEstá nublado. It is cloudy.\nEstá parcialmente nublado. It is partly cloudy.\nEstá lloviendo. It is raining.\nEstá nevando. It is snowing.", why:"These describe how the sky looks, or what it is doing right now.", memType:"Story", mem:"You watch the sky change all day: solar sun (soleado), wind rattles the vent (ventoso), half the sky clouds over (parcialmente nublado), then a full nebula of clouds (nublado), the double L drips like two raindrops (lloviendo), then snow like Nevada's mountains (nevando)." },
        { id:"span-d4a1783", q:"Which weather phrases use Hay?", a:"Hay neblina. It is foggy.\nHay relámpagos. There is lightning.\nHay tormentas. There are storms.", why:"Hay means there is or there are. Spanish says there is fog, not it is foggy.", memType:"Sounds like", mem:"Hay sounds like eye. Your eye spots what is out there: fog (neblina), lightning (relámpagos), storms (tormentas). Hay means there is.", sound:"EYE, like \"eye\"" },
        { id:"span-097a84a", q:"Está soleado.", a:"It is sunny.", memType:"Sounds like", mem:"It is so sunny you can lay a dough on the sidewalk to bake. Soleado comes from sol, the sun.", sound:"ehs-TAH soh-leh-AH-doh, like \"está so, lay a dough\"" },
        { id:"span-df453ae", q:"Está ventoso.", a:"It is windy.", memType:"Sounds like", mem:"The wind has every tree bent, oh so low. Ventoso comes from viento, wind, the vent in ventilate.", sound:"ehs-TAH behn-TOH-soh, like \"está bent, oh, so\"" },
        { id:"span-1f88753", q:"Está nublado.", a:"It is cloudy.", memType:"Sounds like", mem:"A new, blah blanket of gray dough covers the whole sky: cloudy. Nublado comes from nube, cloud.", sound:"ehs-TAH noo-BLAH-doh, like \"está new blah dough\"" },
        { id:"span-d545a74", q:"Está parcialmente nublado.", a:"It is partly cloudy.", memType:"Sounds like", mem:"Only partial men show at Tay's game, half hidden under new blah dough clouds: partly cloudy. Parcialmente looks like partially.", sound:"ehs-TAH pahr-syahl-MEHN-teh noo-BLAH-doh, like \"está partial men, tay, new blah dough\"" },
        { id:"span-f223e4b", q:"Está lloviendo.", a:"It is raining.", why:"The ending iendo works like the English ending ing. It means the rain is happening right now.", memType:"Sounds like", mem:"Yo, Ben, bring the dough in, it is raining right now and your pizza is soaked.", sound:"ehs-TAH yoh-BYEHN-doh, like \"está yo, Ben, dough\"" },
        { id:"span-f081b33", q:"Está nevando.", a:"It is snowing.", memType:"Sounds like", mem:"A horse yells neigh as James Bond skis past, oh, in falling snow. Nevar is to snow; ando works like ing.", sound:"ehs-TAH neh-BAHN-doh, like \"está neigh, Bond, oh\"" },
        { id:"span-8cbc755", q:"Hay neblina.", a:"It is foggy. Word for word it is there is fog.", memType:"Sounds like", mem:"Your eye says nay: bleak, gray fog, nah, you cannot see a thing. Neblina is related to nebula, a hazy cloud.", sound:"EYE neh-BLEE-nah, like \"eye, nay, bleak, nah\"" },
        { id:"span-b402bac", q:"Hay relámpagos.", a:"There is lightning.", memType:"Sounds like", mem:"Your eye catches a ray from a giant sky lamp flashing on a ghost: lightning. Relámpago hides the word lamp.", sound:"EYE rreh-LAHM-pah-gohs, like \"eye, ray, lamp, a ghost\"" },
        { id:"span-26e5bcd", q:"Hay tormentas.", a:"There are storms.", memType:"Sounds like", mem:"Your eye sees storms out there: the wind tore men's umbrellas off and tosses them down the street.", sound:"EYE tohr-MEHN-tahs, like \"eye, tore men, toss\"" },
        { id:"span-fd77df1", q:"Hace buen tiempo.", a:"The weather is good.", why:"This is the all round answer when the weather is just nice and nothing else stands out.", memType:"Sounds like", mem:"B-when is it good weather? When the temp, oh, feels just right. Buen is short for bueno, good.", sound:"AH-seh BWEHN TYEHM-poh, like \"hace b-when temp-oh\"" },
        { id:"span-8a38e3b", q:"Hace mal tiempo.", a:"The weather is bad.", memType:"Sounds like", mem:"Bad weather, so everyone hides in the mall and checks the temp, oh no. Mal is the mal in malfunction.", sound:"AH-seh MAHL TYEHM-poh, like \"hace mall temp-oh\"" },
        { id:"span-fbf5650", q:"How do you say the temperature in Spanish?", a:"Hace ___ grados.\nIt is ___ degrees.\nThe number goes in the blank. Hace quince grados means it is fifteen degrees.", memType:"Sounds like", mem:"A cave grotto's thermometer climbs step by step to fifteen degrees. Grados are steps on a scale, like gradient.", sound:"AH-seh ___ GRAH-dohs, like \"hace ___ grotto's\"" },
        { id:"span-c6059e4", q:"How do you say it is very hot or very cold?", a:"Put mucho between hace and the word.\nHace mucho calor. It is very hot.\nHace mucho frío. It is very cold.", why:"Your Unidad 0 sheet lists mucho as a modifier. Use it with calor and frío.", memType:"Sounds like", mem:"At the moo show, cows sweat in heat galore: Hace mucho calor, very hot. Swap in frío for very cold.", sound:"AH-seh MOO-choh kah-LOHR, like \"hace moo show galore\"" },
        { id:"span-3108d79", q:"What does las estaciones mean?", a:"The seasons.", memType:"Sounds like", mem:"Ness the lake monster is lost at sea, oh, through all four seasons. Estación also means station, like a train station.", sound:"lahs ehs-tah-SYOH-nehs, like \"lost at sea, oh, Ness\"" },
        { id:"span-8bc7c5b", q:"What are the four seasons in Spanish?", a:"el verano, summer\nel otoño, autumn\nel invierno, winter\nla primavera, spring", memType:"Story", mem:"A bear sweats through verano, watches otoño leaves fall, hibernates through invierno, wakes to primavera's first green. Three el, one la: la primavera." },
        { id:"span-c5e4487", q:"el verano", a:"Summer.\nYour Unidad 0 sheet pairs it with Hace calor. It is hot.", why:"Your Unidad 0 sheet puts a weather phrase next to the season, so learn the two together.", memType:"Sounds like", mem:"A bear in a fur coat at the summer pool groans: ah, no, it is so hot. Verano goes with Hace calor.", sound:"ehl beh-RAH-noh, like \"el bear, ah, no\"" },
        { id:"span-5032b9f", q:"el otoño", a:"Autumn, or fall.\nYour Unidad 0 sheet pairs it with Hace fresco. It is cool.", memType:"Sounds like", mem:"Oh, Tony, yo, rake the autumn leaves while it is cool out, Hace fresco. Otoño and autumn share one old root.", sound:"ehl oh-TOH-nyoh, like \"el oh, Tony, yo\"" },
        { id:"span-cef3214", q:"el invierno", a:"Winter.\nYour Unidad 0 sheet pairs it with Hace frío. It is cold.", memType:"Sounds like", mem:"Knock on the den: in, bear? No answer. Bear hibernates through cold winter, Hace frío. Invierno and hibernate share a root.", sound:"ehl een-BYEHR-noh, like \"el in, bear, no\"" },
        { id:"span-ca9cabf", q:"la primavera", a:"Spring.", why:"Your Unidad 0 sheet pairs the other three seasons with a weather phrase but leaves primavera blank, so there is no phrase to learn with it.", memType:"Sounds like", mem:"Pre-dawn, Ma bear wakes, stretches, ah, and sniffs spring's first green. Prima means first. She is the only la season.", sound:"lah pree-mah-BEH-rah, like \"la pre, Ma, bear, ah\"" },
        { id:"span-d01b8a6", q:"What does Hace fresco mean, and which season goes with it?", a:"It is cool. It goes with el otoño, autumn.", memType:"Sounds like", mem:"The air feels like a fresh Coke from the cooler: cool, not cold. Fresco is fresh. It goes with el otoño.", sound:"AH-seh FREHS-koh, like \"hace fresh Coke\"" },
        { id:"span-c3f47b8", q:"What are the twelve months in Spanish?", a:"enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre", memType:"Link it", mem:"Same order as your phone calendar, and eleven sound like English said aloud. Only enero, January, is a stranger." },
        { id:"span-d7d337c", q:"Do Spanish months start with a capital letter?", a:"No. Spanish writes months in lowercase: enero, marzo, octubre.\nOnly capitalize one if it starts a sentence.", why:"English capitalizes months and Spanish does not. That difference is the whole rule.", memType:"Link it", mem:"Spanish months are like lowercase usernames: enero, marzo, octubre. A capital shows up only when one starts a sentence." },
        { id:"span-e68d4ed", q:"Which Spanish month looks least like its English name?", a:"enero, which is January.\nThe other eleven are close once you say them out loud: febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre.", why:"It means there is really only one to drill.", memType:"Sounds like", mem:"An arrow thunks into January 1st, the first box of the calendar. Enero is the one odd month out.", sound:"eh-NEH-roh, like \"an arrow\"" },
        { id:"span-fc90a21", q:"What does los meses del año mean?", a:"The months of the year.\nel mes is the month. el año is the year.", memType:"Sounds like", mem:"Twelve messes, one each month, pile up on the Dell on yo desk all year. Keep the ñ in año, or it turns rude.", sound:"lohs MEH-sehs dehl AH-nyoh, like \"los messes, Dell, on yo\"" },
        { id:"span-05391a3", q:"What are the seven days in Spanish?", a:"lunes, martes, miércoles, jueves, viernes, sábado, domingo", why:"The Spanish week starts on lunes (Monday), not Sunday. So domingo is last, not first.", memType:"First letters", mem:"Lazy Moms Make Juicy Veggie Sandwiches Daily: lunes, martes, miércoles, jueves, viernes, sábado, domingo. The week starts on Monday." },
        { id:"span-db6bddd", q:"Do Spanish days start with a capital letter?", a:"No. Spanish writes days in lowercase: lunes, jueves, domingo.\nOnly capitalize one if it starts a sentence.", memType:"Link it", mem:"Same as the months: think lowercase usernames, like lunes and domingo. Capital only at the start of a sentence. One rule, both lists." },
        { id:"span-66f429d", q:"Which two days of the week have accent marks?", a:"miércoles and sábado.\nThe accent sits on the é in miércoles and the á in sábado. Every other day has none.", why:"A missing accent is a spelling error, so these two are worth a second look.", memType:"Picture it", mem:"Two days wear party hats: hump-day Wednesday and Saturday. The hat sits on the é in miércoles and the á in sábado." },
        { id:"span-2257369", q:"Why do the Spanish days sound like the moon and the planets?", a:"Because they are named after them.\nlunes from la luna, the moon\nmartes from Marte, Mars\nmiércoles from Mercurio, Mercury\njueves from Júpiter, Jupiter\nviernes from Venus", memType:"Link it", mem:"Science-class space poster: Moon lunes, Mars martes, Mercury miércoles, Jupiter jueves, Venus viernes. Sábado is Sabbath, domingo the Lord's day." },
        { id:"span-0c3f273", q:"What does los días de la semana mean?", a:"The days of the week.\nel día is the day. la semana is the week.", memType:"Sounds like", mem:"Every day of the week you say, Ma, pizza tonight? And every day she says nah. Días keeps its í accent.", sound:"lohs DEE-ahs deh lah seh-MAH-nah, like \"los días de la say, Ma, nah\"" },
        { id:"span-6299b32", q:"Ayer fue...", a:"Yesterday was...\nExample: Ayer fue lunes. Yesterday was Monday.", why:"Fue is the past form. It is the piece that makes the sentence about yesterday.", memType:"Sounds like", mem:"Ah, yeah, yesterday already flew away, f-way. Ayer fue lunes: yesterday was Monday.", sound:"ah-YEHR FWEH, like \"ah, yeah, f-way\"" },
        { id:"span-e142968", q:"Hoy es...", a:"Today is...\nExample: Hoy es martes. Today is Tuesday.", memType:"Sounds like", mem:"A boy checks his lock screen: oy, yes, today is Tuesday. Hoy es martes. The h stays silent.", sound:"OY ehs, like \"oy, yes\"" },
        { id:"span-7f62ccf", q:"Mañana será...", a:"Tomorrow will be...\nExample: Mañana será miércoles. Tomorrow will be Wednesday.", memType:"Sounds like", mem:"Ma teases, nyah-nah, tomorrow will be Wednesday, and the cheer squad says rah. Mañana also means morning. Keep the ñ and the á.", sound:"mah-NYAH-nah seh-RAH, like \"Ma, nyah-nah, say rah\"" },
        { id:"span-07588ac", q:"How do you say yesterday, today and tomorrow was or is or will be a certain day?", a:"Ayer fue... Yesterday was...\nHoy es... Today is...\nMañana será... Tomorrow will be...\nThe day name goes in the blank, in lowercase.", why:"These three are one set. The verb changes with the time: fue, es, será.", memType:"Story", mem:"Monday morning you groan oy: hoy es lunes, today is Monday. Ah, yeah, ayer fue domingo, yesterday was Sunday. Mañana será martes, tomorrow will be Tuesday. Day names stay lowercase." },
        { id:"span-4f881a2", q:"What is mayúscula?", a:"A capital letter.\nWhen you spell a name out loud, you add mayúscula to mark a capital. Eme mayúscula means capital M.", memType:"Sounds like", mem:"Ma uses a cooler lid to write one giant letter: a capital. Mayúscula comes from mayor, bigger, like major.", sound:"mah-YOOS-koo-lah, like \"Ma, use cooler\"" },
        { id:"span-aebf769", q:"How do you spell the name Sofía out loud in Spanish?", a:"ese - o - efe - i - a\nThose are the Spanish names of the letters S, O, F, I and A.", why:"Spanish letters have their own names, so spelling aloud is its own small skill.", memType:"Picture it", mem:"Picture S and F each in an e sandwich: ese, efe. Vowels just say themselves. So: ese, o, efe, i, a." },
        { id:"span-b5bbd8a", q:"How do you spell the name Mateo out loud in Spanish?", a:"eme mayúscula - ah - te - eh - oh\nMayúscula marks the capital M at the start.", memType:"Picture it", mem:"M wears an e sandwich too: eme. Then mayúscula right after it, like a hat on the capital. Then ah, te, eh, oh." }
      ]}
    ] } /* 0 owed as of 2026-09-20 */,
  zoo:  { name:"Zoology",           teacher:"Finch",   color:"var(--c-zoo)",  units:[
      { name:"Week 2 Vocab: AFNR, FFA, SAE", cards:[
        { id:"zoo-04c6c06", q:"What does AFNR stand for?", a:"Agriscience, Food and Natural Resources.", why:"It is the name for the whole field this class sits inside.", memType:"Link it", mem:"Your lunch tray is AFNR: Agriscience grew it, it is Food, and Natural Resources like soil and water made it possible." },
        { id:"zoo-6395b6b", q:"What kinds of things does AFNR cover?", a:"A huge umbrella of industries and areas. It covers botany, zoology, animals, plants, natural resources, hunting, fishing, even jellyfish and farming.", why:"Zoology is one slice of AFNR, so this class is one piece of a much bigger field.", memType:"Picture it", mem:"A giant AFNR umbrella shelters plants (botany), animals (zoology), a forest (natural resources), a farmer, a hunter, a fisher, and one confused jellyfish." },
        { id:"zoo-168c72e", q:"What does FFA stand for?", a:"The National FFA Organization.\nThe letters originally stood for Future Farmers of America. That is still where they come from, but the official name today is just The National FFA Organization.", why:"The name changed because the group grew past farming into all of AFNR.", memType:"Link it", mem:"Like KFC, the letters outlived the words. FFA began as Future Farmers of America. Now the official name is The National FFA Organization." },
        { id:"zoo-87c0017", q:"What is FFA?", a:"The leadership organization centered around agriculture. It started in 1928 as Future Farmers of America. Today it covers all areas of AFNR, not just farming.", memType:"Link it", mem:"Think of FFA as a student council for agriculture: the key word is leadership. Started with farmers in 1928, now covers all of AFNR." },
        { id:"zoo-84c6244", q:"What year did FFA start, and what was it called then?", a:"1928. It was called Future Farmers of America.", memType:"Link it", mem:"FFA is almost 100 years old: founded in 1928 as Future Farmers of America. Its 100th birthday is 2028, when you are about 17." },
        { id:"zoo-db23cd4", q:"Name some FFA contests.", a:"Floriculture (working with flowers)\nVeterinary science\nForestry\nPublic speaking", why:"The range of contests shows how wide FFA is. Only some of them involve a farm.", memType:"Story", mem:"A flower grower (floriculture) hands a bouquet to a vet, who hikes into a forest and gives a public speech to the trees." },
        { id:"zoo-58e1cdb", q:"What does SAE stand for?", a:"Supervised Ag Experiences.\nAg is short for agricultural.", memType:"Link it", mem:"Like learner's permit driving: you do it yourself, with a supervisor along. Supervised Ag Experiences, Ag meaning agricultural." },
        { id:"zoo-6e78841", q:"What is an SAE?", a:"An individual planned project related to AFNR. You choose it and plan it yourself, and someone supervises it at some point.", why:"The project is yours, not a group assignment.", memType:"Link it", mem:"Like a solo science fair project about AFNR: your own idea, your own plan, and someone supervises it at some stage." },
        { id:"zoo-2545fb5", q:"Give examples of an SAE.", a:"Showing animals at the fair\nHunting\nFishing\nGardening\nGrowing plants in the school greenhouse\nThe FFA chicken broiler contest", why:"Things you might already do can count. An SAE does not have to start from scratch.", memType:"Story", mem:"One busy weekend: show a goat at the fair, hunt, fish, garden, water the school greenhouse, enter the FFA chicken broiler contest." },
        { id:"zoo-8f18ca3", q:"What does AET stand for, and what is it?", a:"The Ag Experience Tracker, at theaet.com. It is an online recordkeeping system. You use it to log the work and hours from your SAE and FFA activities.", memType:"Link it", mem:"AET is like a fitness tracker app for ag work: the Ag Experience Tracker, theaet.com. SAE is the workout, AET is the log." },
        { id:"zoo-83b7f87", q:"What percent of people in the US are farmers?", a:"2 percent.\nThis is production agriculture, meaning people directly working the farm.", why:"A very small number of people grow the food for everyone else.", memType:"Picture it", mem:"Picture 100 people in a gym. Only 2 stand up as farmers, working directly on the farm. That is 2 percent." },
        { id:"zoo-8c63635", q:"What percent of people in the US have jobs related to AFNR?", a:"21 percent.\nThese are indirect jobs: veterinarian, seed salesman, tractor sales, manufacturing, distribution.", why:"Most agriculture jobs are not farming. They are the jobs around farming.", memType:"Picture it", mem:"Picture 100 people in a gym. 21 stand for jobs around farming: a vet, seed seller, tractor dealer, factory worker, delivery driver." },
        { id:"zoo-88115fc", q:"What percent of people are consumers of AFNR?", a:"100 percent.\nEveryone eats food, wears clothing and uses products that come from agriculture and natural resources.", memType:"Link it", mem:"Look at yourself: cotton shirt, breakfast in your stomach, wooden pencil. Everyone uses AFNR products, so 100 percent are consumers." },
        { id:"zoo-a2580d6", q:"On average, how many people does one US farmer feed?", a:"155 people.", why:"It puts the 2 percent in perspective. Each farmer is feeding a crowd.", memType:"Picture it", mem:"Picture 1 farmer with both hands up: 5 fingers and 5 fingers. 1, 5, 5: one farmer feeds 155 people." },
        { id:"zoo-0b6a1a3", q:"What is the difference between the 2 percent and the 21 percent?", a:"The 2 percent work directly in production agriculture, on the farm.\nThe 21 percent have jobs related to AFNR but not on the farm, like a vet or a tractor salesman.", memType:"Link it", mem:"Football: the 2 percent are players on the field, direct. The 21 percent are coaches and trainers around it, indirect. Field means farm." },
        { id:"zoo-efe231e", q:"What is the full breakdown of the AFNR numbers?", a:"2 percent production agriculture\n21 percent indirect AFNR jobs\n77 percent consumers only\n100 percent are consumers in total", memType:"Picture it", mem:"Gym of 100: 2 farmers stand, 21 farm-related workers stand, 77 stay seated. 2 + 21 + 77 = 100, and everyone eats." },
        { id:"zoo-1589f00", q:"What does the 77 percent mean?", a:"77 percent of people have no job connected to AFNR at all. They are consumers only. They still use and eat AFNR products, which is why the consumer total is 100 percent.", memType:"Picture it", mem:"Picture 100 people in a gym. 77 stay seated: no AFNR job. They still eat lunch, so they are consumers only." },
        { id:"zoo-4f042f5", q:"What do AFNR, FFA, SAE and AET each stand for?", a:"AFNR: Agriscience, Food and Natural Resources\nFFA: The National FFA Organization\nSAE: Supervised Ag Experiences\nAET: The Ag Experience Tracker", memType:"Story", mem:"Take the class (Agriscience, Food and Natural Resources), join the club (The National FFA Organization), do a project (Supervised Ag Experience), log it (Ag Experience Tracker)." }
      ]},
      { name:"Week 3 Vocab: What is Zoology", cards:[
        { id:"zoo-dc716d5", q:"What is the term for the scientific study of the behavior, structure, physiology, classification, and distribution of animals?", a:"Zoology.\nIt is the branch of biology that deals with animals. It looks at how animals act, how their bodies are built, how those bodies work, how animals are grouped, and where they live.", memType:"Link it", mem:"Zoo comes from Greek for animal, and a zoo is full of them. Add -ology, study of. Zoology is the study of animals." },
        { id:"zoo-ec9f163", q:"What is the term for the study of life?", a:"Biology.\nIt covers every living thing: animals, plants, fungi, and tiny life like bacteria. Zoology is one part of biology.", memType:"Link it", mem:"Bio means life, like a biography, the story of a life. Add -ology, study of: biology is the study of life." },
        { id:"zoo-615f44d", q:"What is the term for non-domesticated animals and plants?", a:"Wildlife.\nThese are living things that are not tamed, farmed, or kept as pets. A deer in a forest is wildlife. A cow or a house cat is not. Wild plants count as wildlife too.", why:"The word shows up in job titles and laws, like wildlife biologist and wildlife refuge.", memType:"Link it", mem:"Wild plus life: living things not tamed, farmed or kept as pets. A deer and a wild berry bush count. Your dog does not." },
        { id:"zoo-ba978f7", q:"What is the term for the growing of fish in a controlled water environment?", a:"Aquaculture.\nIt means raising fish, and sometimes shellfish or water plants, in tanks, ponds, or netted pens instead of catching them in the wild.", memType:"Link it", mem:"Aqua means water, like an aquarium. Agriculture farms land, so aquaculture farms fish in controlled water, like tanks and ponds." },
        { id:"zoo-aef2207", q:"What is the term for an establishment that maintains a collection of wild animals for study, conservation, or display to the public?", a:"A zoo, also called a zoological park.\nIt keeps wild animals for three reasons: to study them, to protect species from dying out, and to show them to the public.", memType:"Picture it", mem:"Picture a zoo as three things at once: a science lab (study), a lifeboat for species (conservation), and a stage for visitors (display)." },
        { id:"zoo-f7f8d5c", q:"What is the term for something relating to the diseases, injuries, and treatment of animals?", a:"Veterinary.\nIt is the word for animal medicine. A veterinarian, or vet, is the doctor who treats animals. A veterinary clinic is where that care happens.", memType:"Link it", mem:"Veterinary is about animal diseases, injuries and treatment: a veterinary clinic. The person gets -ian, like librarian: veterinarian." },
        { id:"zoo-33b1034", q:"What is the term for the scientific study of organisms in the sea?", a:"Marine biology.\nIt is the study of living things in the ocean: fish, whales, coral, seaweed, and microscopic sea life.", memType:"Link it", mem:"Marine comes from mare, Latin for sea. The Marines began as soldiers on ships. Marine biology studies life in the sea." },
        { id:"zoo-45cf382", q:"What five things does zoology study about animals?", a:"Behavior, how animals act.\nStructure, how their bodies are built.\nPhysiology, how their bodies work.\nClassification, how animals are grouped and named.\nDistribution, where animals live.", why:"These five words are the whole definition, so knowing them means you can rebuild the definition from memory.", memType:"First letters", mem:"Big Snakes Probably Chase Ducks: Behavior, Structure, Physiology, Classification, Distribution, in the same order as the definition." },
        { id:"zoo-f47fb6f", q:"How are zoology and biology related?", a:"Biology is the study of all life. Zoology is the part of biology that focuses only on animals.", memType:"Picture it", mem:"Picture biology as a tree holding all life. Zoology is one branch, the animal branch, with monkeys swinging on it." },
        { id:"zoo-8142337", q:"What is the difference between wildlife and domesticated animals?", a:"Domesticated animals have been bred over many generations to live with people, like dogs, cows, and chickens.\nWildlife has not been bred that way. Those animals live on their own in nature.", memType:"Link it", mem:"Domestic comes from Latin for home. Dogs, cows and chickens were bred over generations to live with people. Wildlife lives on its own." },
        { id:"zoo-f8c736e", q:"How is aquaculture different from regular fishing?", a:"Fishing takes fish out of the wild.\nAquaculture raises fish in a controlled space like a tank or pond, where people control the food, water, and room to grow.", memType:"Link it", mem:"Fishing is hunting wild fish. Aquaculture is farming them: people control the food, water and space in a tank or pond." },
        { id:"zoo-ca3112e", q:"What are some careers that come from studying zoology?", a:"Zoologist\nVeterinarian and veterinary technician\nMarine biologist\nZookeeper\nWildlife biologist\nAquarist or fish farmer\nAnimal behaviorist\nWildlife rehabilitator\nConservation officer or park ranger\nZoo or museum educator", why:"Most of these job titles come straight from the vocabulary words in this unit.", memType:"Link it", mem:"Turn each vocab word into a person: zoologist, veterinarian, marine biologist, wildlife biologist, aquarist. Then add zookeeper, behaviorist, rehabilitator, ranger, educator." },
        { id:"zoo-a579f84", q:"What does a zoologist do?", a:"A zoologist studies animals: their behavior, their bodies, and their habitats. The work can be outdoors collecting data on wild animals, or in a lab, a university, or a government agency.", why:"This is the job that matches the word zoology most directly.", memType:"Link it", mem:"Zoology plus -ist, like artist, is the person who does zoology: studying animal behavior, bodies and habitats, outdoors or in a lab." },
        { id:"zoo-e1297d8", q:"What does a veterinarian do?", a:"Treats sick and injured animals. That includes checkups, vaccines, medicine, and surgery. Some vets work with pets, some with farm animals, some with zoo or wild animals.", why:"Veterinary is the vocabulary word. A veterinarian is the person who does that work.", memType:"Link it", mem:"A vet is like your doctor, but for sick and injured animals: checkups, vaccines, medicine, surgery, for pets, farm or zoo animals." },
        { id:"zoo-9ebdd93", q:"What does a zookeeper do?", a:"Takes care of zoo animals every day: feeding them, cleaning their habitats, watching for health problems, and giving them things to do so they stay active. Many also talk with visitors about the animals.", memType:"Story", mem:"A zookeeper's day: feed the lions, scrub their habitat, check for limping, hand them a puzzle toy, then answer visitors' questions." },
        { id:"zoo-14510e1", q:"What does a marine biologist do?", a:"Studies life in the ocean. The work can include diving, tagging animals, surveying from boats, testing water, and lab research. Some study one species; others study a whole ocean habitat.", why:"Marine biology is the vocabulary term. A marine biologist is the person who does it.", memType:"Story", mem:"A marine biologist dives to tag a shark, climbs onto the boat to survey, tests a jar of seawater, then heads to the lab." },
        { id:"zoo-9b67515", q:"What does a wildlife biologist do?", a:"Studies non-domesticated animals in the places they naturally live. They count populations, track animal health, and help build plans to protect species. Many work for state or federal agencies.", why:"Wildlife is the vocabulary word. A wildlife biologist studies wildlife for a living.", memType:"Link it", mem:"Like a coach tracking a roster and injuries: a wildlife biologist counts wild populations, checks their health, plans protection, often for government agencies." }
      ]},
      { name:"Classification and Category Names", cards:[
        { id:"zoo-c097efa", q:"1. The science of naming and classifying organisms is called what?", a:"Taxonomy.\nIt is the part of biology that gives every living thing a name and sorts it into groups with organisms that are like it.", why:"This is the name for the whole unit. Everything else in it is a rule that taxonomy uses.", memType:"Sounds like", mem:"Taxonomy starts like taxi, and Greek taxis means arrangement. Picture a taxi dispatcher naming every animal and sorting them into cars by group." },
        { id:"zoo-b8c2fe3", q:"2. Aristotle organized a system of classification. How long ago?", a:"More than 2,000 years ago.\nAristotle was a Greek thinker who lived from about 384 to 322 BC, so it is really closer to 2,350 years. Most notes just write it as more than 2,000 years ago.", why:"He grouped animals by where they lived, such as land, water, or air. That is habitat, not how closely related they are, so his system was replaced.", memType:"Picture it", mem:"Picture Aristotle in a toga blowing out a birthday cake with over 2,000 candles: his classification system is more than 2,000 years old." },
        { id:"zoo-b504fbb", q:"3. The system of binomial nomenclature we use now was developed by whom?", a:"Carolus Linnaeus, a Swedish scientist in the 1700s.\nHis name is also written Carl Linnaeus. He gave each organism a two word Latin name, and biologists still use his system today.", memType:"Sounds like", mem:"Picture animals lined up begging \"Lin, name us.\" Linnaeus, a Swede in the 1700s, gives each a two-word Latin name. Bi means two." },
        { id:"zoo-d7c05bd", q:"4. The first letter of the genus is always what?", a:"Capitalized.\nExample: in Homo sapiens, the H in Homo is a capital letter.", why:"This is a rule about how the name is written, not about the organism itself. The genus is the bigger group and it always comes first.", memType:"Picture it", mem:"Picture Homo sapiens with a giant capital H towering over a tiny s. Big group, big letter: the genus is always capitalized." },
        { id:"zoo-0645a99", q:"5. The first letter of the species is always what?", a:"Lowercase.\nExample: in Homo sapiens, the s in sapiens stays small. It stays lowercase even when the species name comes from a person's name or a place.", memType:"Picture it", mem:"Picture Homo sapiens with a giant H and a tiny s. Small group, small letter: species stays lowercase, even if named after a person." },
        { id:"zoo-4ba5cc4", q:"6. How is the scientific name for humans correctly written?", a:"Homo sapiens.\nCapital H, lowercase s, and both words in italics when typed. If you are writing by hand, underline each word instead.", why:"This one shows all the rules at once: genus first and capitalized, species second and lowercase, plus the italics.", memType:"Link it", mem:"Like a book title in an essay: italics when typed, underlined when handwritten. Homo sapiens: capital H, lowercase s." },
        { id:"zoo-6083607", q:"7. Scientific names are written in what language?", a:"Latin.\nLatin is nobody's everyday language now, so the words do not shift or change meaning over time.", why:"A shared naming language means biologists anywhere can talk about the same organism. A scientist in Japan and one in Brazil both write Homo sapiens.", memType:"Link it", mem:"Latin is like a game save file that never updates: nobody speaks it daily, so the names stay fixed for every scientist everywhere." },
        { id:"zoo-8666c83", q:"8. What two parts make up a scientific name?", a:"The genus and the species.\nGenus comes first and names the group of closely related organisms. Species comes second and names the one exact kind. In Homo sapiens, Homo is the genus and sapiens is the species.", why:"The genus is like a last name shared by close relatives. The species is like a first name for one exact kind. The order is flipped, so the last name goes first.", memType:"Link it", mem:"Like an attendance list, last name first: genus is the shared last name, species the first name. Homo, then sapiens." },
        { id:"zoo-0f59683", q:"9. What are the seven categories of classification in their proper order (a through g)?", a:"a. Kingdom\nb. Phylum\nc. Class\nd. Order\ne. Family\nf. Genus\ng. Species\nThey run from the biggest, broadest group down to the smallest, most exact one.", why:"Each step down holds fewer organisms that are more alike. A kingdom holds millions of species. A species holds just one kind.", memType:"First letters", mem:"King Philip Came Over For Good Soup: Kingdom, Phylum, Class, Order, Family, Genus, Species, biggest group to smallest." },
        { id:"zoo-42626e7", q:"10. A biological ___ is a group of actually or potentially interbreeding natural populations that are reproductively isolated from other such groups. What word fills the blank?", a:"Species.\nIn plain words, a species is a group of living things that can breed with each other and have young that can later have young of their own. In the wild they do not breed with other groups.", why:"Reproductively isolated is the key phrase. Two groups that cannot produce fertile offspring together count as two separate species.", memType:"Picture it", mem:"Picture a horse and a donkey with their baby mule, who can never have babies. No fertile young, so they stay two species." },
        { id:"zoo-a1152c4", q:"Bovine means which animals?", a:"Cattle.\nThat covers beef cattle and dairy cattle.", why:"It is the first word on Mrs. Finch's list, and cattle is the animal her breed example uses too: Bos taurus and Angus.", memType:"Link it", mem:"Bovine and beef share the Latin root bos, cattle. Picture a cow holding a burger and a milk carton: beef and dairy." },
        { id:"zoo-6b5c327", q:"Ovine means which animal?", a:"Sheep.", why:"Ovine is the one word on this list with no easy sound hook, so it usually needs a few extra passes. Ovine equals sheep. That is all it means.", memType:"Sounds like", mem:"Ovine sounds like \"oh, fine.\" Picture a sheep admiring its fluffy wool in a mirror: \"Oh, fine.\" Ovine means sheep." },
        { id:"zoo-a4fefb0", q:"Porcine means which animals?", a:"Swine, which means pigs and hogs.", memType:"Link it", mem:"Porcine and pork come from Latin porcus, pig. Even porcupine means spiny pig. Porcine means swine: pigs and hogs." },
        { id:"zoo-3994176", q:"Aves/Poultry means which animals?", a:"Birds.\nThe farm birds in this group are chickens and turkeys.", memType:"Link it", mem:"Aves shares a root with aviary and aviation: birds and flying. Poultry is the farm word for birds people raise: chickens and turkeys." },
        { id:"zoo-e6360e8", q:"Equine means which animals?", a:"Horses.", memType:"Link it", mem:"Equine matches equestrian, the Olympic horse-riding events. Picture a gold-medal rider on a horse: equine means horses." },
        { id:"zoo-448894d", q:"Caprine means which animals?", a:"Goats.", memType:"Link it", mem:"Caprine and Capricorn share a Latin root for goat. Picture Capricorn, the zodiac goat, headbutting a star: caprine means goats." },
        { id:"zoo-afef670", q:"Feline means which animals?", a:"Cats.", memType:"Link it", mem:"Feline is everyday English for cat, like calling a cat a feline friend. Lions, tigers and your neighbor's house cat are all felines." },
        { id:"zoo-c59bb8e", q:"Canine means which animals?", a:"Dogs.", memType:"Link it", mem:"Your canine teeth are the sharp fang-like ones, named after dog fangs. Police K-9 units are dog units too: canine means dogs." },
        { id:"zoo-ce28d06", q:"Ovine and caprine get mixed up a lot. Which is which?", a:"Ovine is sheep.\nCaprine is goats.", memType:"Link it", mem:"Capricorn, the star sign, is a goat, so caprine means goats. Ovine sounds like oh, fine: a sheep showing off its fine wool." },
        { id:"zoo-cbea666", q:"List all eight category words with the animal for each.", a:"Bovine equals cattle, beef and dairy.\nOvine equals sheep.\nPorcine equals swine, pigs and hogs.\nAves or poultry equals birds, chickens and turkeys.\nEquine equals horses.\nCaprine equals goats.\nFeline equals cats.\nCanine equals dogs.", why:"It is an eight word list, so it helps to be able to run the whole set in one go.", memType:"Link it", mem:"Buddy words: beef shares a root with bovine. Oh, fine wool: ovine sheep. Pork: porcine. Aviary: aves. Equestrian: equine. Capricorn: caprine. Felix the Cat: feline. K-9: canine." },
        { id:"zoo-34672fe", q:"What does breed mean?", a:"A breed is a smaller, more specific group inside a species.\nThe genus and species name the animal itself. A breed is a particular type within that species, usually one people developed for certain traits like size, milk, or meat.", memType:"Link it", mem:"Dog is the species. Labrador, poodle and beagle are breeds: types people developed inside that one species for certain traits." },
        { id:"zoo-3596495", q:"Bos taurus is the scientific name for beef cattle. So what is Angus?", a:"Angus is a breed of beef cattle.\nBos taurus is the species. Angus is one specific type of cattle inside that species.", memType:"Link it", mem:"Menus brag about Angus beef burgers: Angus is a breed of beef cattle, one type inside the species Bos taurus." },
        { id:"zoo-0c9e763", q:"Name the seven categories of classification in order, largest group to smallest.", a:"Kingdom, Phylum, Class, Order, Family, Genus, Species.", memType:"First letters", mem:"King Philip Came Over For Good Soup. Big king down to small soup: Kingdom, Phylum, Class, Order, Family, Genus, Species." },
        { id:"zoo-bb0a874", q:"A scientific name like Bos taurus is built from which two of the seven categories?", a:"Genus and species.\nGenus comes first and starts with a capital letter, like Bos. Species comes second and is lowercase, like taurus.", why:"Mrs. Finch's notes put it this way: a scientific name has two parts, genus and species, and it gives biologists one shared name whatever language they speak.", memType:"Link it", mem:"Name them from the end of King Philip Came Over For Good Soup: Good Soup is Genus, Species. Bos capital, taurus lowercase." }
      ]}
    ] }
