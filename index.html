        { q:"What kinds of things does AFNR cover?", a:"A huge umbrella of industries and areas. It covers botany, zoology, animals, plants, natural resources, hunting, fishing, even jellyfish and farming.", why:"Zoology is one slice of AFNR, so this class is one piece of a much bigger field." },
        { q:"What does FFA stand for?", a:"The National FFA Organization.\nThe letters originally stood for Future Farmers of America. That is still where they come from, but the official name today is just The National FFA Organization.", why:"The name changed because the group grew past farming into all of AFNR." },
        { q:"What is FFA?", a:"The leadership organization centered around agriculture. It started in 1928 as Future Farmers of America. Today it covers all areas of AFNR, not just farming.", tip:"The key word is leadership. FFA is about learning to lead, not only about crops and animals." },
        { q:"What year did FFA start, and what was it called then?", a:"1928. It was called Future Farmers of America." },
        { q:"Name some FFA contests.", a:"Floriculture (working with flowers)\nVeterinary science\nForestry\nPublic speaking", why:"The range of contests shows how wide FFA is. Only some of them involve a farm." },
        { q:"What does SAE stand for?", a:"Supervised Ag Experiences.\nAg is short for agricultural." },
        { q:"What is an SAE?", a:"An individual planned project related to AFNR. You choose it and plan it yourself, and someone supervises it at some point.", why:"The project is yours, not a group assignment." },
        { q:"Give examples of an SAE.", a:"Showing animals at the fair\nHunting\nFishing\nGardening\nGrowing plants in the school greenhouse\nThe FFA chicken broiler contest", why:"Things you might already do can count. An SAE does not have to start from scratch." },
        { q:"What does AET stand for, and what is it?", a:"The Ag Experience Tracker, at theaet.com. It is an online recordkeeping system. You use it to log the work and hours from your SAE and FFA activities.", tip:"AET is the website. SAE is the project you record on it." },
        { q:"What percent of people in the US are farmers?", a:"2 percent.\nThis is production agriculture, meaning people directly working the farm.", why:"A very small number of people grow the food for everyone else." },
        { q:"What percent of people in the US have jobs related to AFNR?", a:"21 percent.\nThese are indirect jobs: veterinarian, seed salesman, tractor sales, manufacturing, distribution.", why:"Most agriculture jobs are not farming. They are the jobs around farming." },
        { q:"What percent of people are consumers of AFNR?", a:"100 percent.\nEveryone eats food, wears clothing and uses products that come from agriculture and natural resources." },
        { q:"On average, how many people does one US farmer feed?", a:"155 people.", why:"It puts the 2 percent in perspective. Each farmer is feeding a crowd." },
        { q:"What is the difference between the 2 percent and the 21 percent?", a:"The 2 percent work directly in production agriculture, on the farm.\nThe 21 percent have jobs related to AFNR but not on the farm, like a vet or a tractor salesman.", tip:"Direct means on the farm. Indirect means around the farm." },
        { q:"What is the full breakdown of the AFNR numbers?", a:"2 percent production agriculture\n21 percent indirect AFNR jobs\n77 percent consumers only\n100 percent are consumers in total", tip:"The three job groups add up: 2 + 21 + 77 = 100. If you remember three of the numbers, you can work out the fourth." },
        { q:"What does the 77 percent mean?", a:"77 percent of people have no job connected to AFNR at all. They are consumers only. They still use and eat AFNR products, which is why the consumer total is 100 percent." },
        { q:"What are the four acronyms from Week 2?", a:"AFNR: Agriscience, Food and Natural Resources\nFFA: The National FFA Organization\nSAE: Supervised Ag Experiences\nAET: The Ag Experience Tracker" }
      ]},
      { name:"Week 3 Vocab: What is Zoology", cards:[
        { q:"What is the term for the scientific study of the behavior, structure, physiology, classification, and distribution of animals?", a:"Zoology.\nIt is the branch of biology that deals with animals. It looks at how animals act, how their bodies are built, how those bodies work, how animals are grouped, and where they live.", tip:"Zoo comes from a Greek word meaning animal. Ology means the study of. So zoology is the study of animals." },
        { q:"What is the term for the study of life?", a:"Biology.\nIt covers every living thing: animals, plants, fungi, and tiny life like bacteria. Zoology is one part of biology.", tip:"Bio means life. Ology means the study of." },
        { q:"What is the term for non-domesticated animals and plants?", a:"Wildlife.\nThese are living things that are not tamed, farmed, or kept as pets. A deer in a forest is wildlife. A cow or a house cat is not. Wild plants count as wildlife too.", why:"The word shows up in job titles and laws, like wildlife biologist and wildlife refuge." },
        { q:"What is the term for the growing of fish in a controlled water environment?", a:"Aquaculture.\nIt means raising fish, and sometimes shellfish or water plants, in tanks, ponds, or netted pens instead of catching them in the wild.", tip:"Aqua means water. Agriculture is farming on land, so aquaculture is farming in water." },
        { q:"What is the term for an establishment that maintains a collection of wild animals for study, conservation, or display to the public?", a:"A zoo, also called a zoological park.\nIt keeps wild animals for three reasons: to study them, to protect species from dying out, and to show them to the public." },
        { q:"What is the term for something relating to the diseases, injuries, and treatment of animals?", a:"Veterinary.\nIt is the word for animal medicine. A veterinarian, or vet, is the doctor who treats animals. A veterinary clinic is where that care happens.", tip:"Veterinary is the describing word. Veterinarian is the person." },
        { q:"What is the term for the scientific study of organisms in the sea?", a:"Marine biology.\nIt is the study of living things in the ocean: fish, whales, coral, seaweed, and microscopic sea life.", tip:"Marine comes from mare, the Latin word for sea. Anything marine has to do with the ocean." },
        { q:"What five things does zoology study about animals?", a:"Behavior, how animals act.\nStructure, how their bodies are built.\nPhysiology, how their bodies work.\nClassification, how animals are grouped and named.\nDistribution, where animals live.", why:"These five words are the whole definition, so knowing them means you can rebuild the definition from memory." },
        { q:"How are zoology and biology related?", a:"Biology is the study of all life. Zoology is the part of biology that focuses only on animals.", tip:"Picture biology as a tree and zoology as one branch of it." },
        { q:"What is the difference between wildlife and domesticated animals?", a:"Domesticated animals have been bred over many generations to live with people, like dogs, cows, and chickens.\nWildlife has not been bred that way. Those animals live on their own in nature." },
        { q:"How is aquaculture different from regular fishing?", a:"Fishing takes fish out of the wild.\nAquaculture raises fish in a controlled space like a tank or pond, where people control the food, water, and room to grow." },
        { q:"What are some careers that come from studying zoology?", a:"Zoologist\nVeterinarian and veterinary technician\nMarine biologist\nZookeeper\nWildlife biologist\nAquarist or fish farmer\nAnimal behaviorist\nWildlife rehabilitator\nConservation officer or park ranger\nZoo or museum educator", why:"Most of these job titles come straight from the vocabulary words in this unit." },
        { q:"What does a zoologist do?", a:"A zoologist studies animals: their behavior, their bodies, and their habitats. The work can be outdoors collecting data on wild animals, or in a lab, a university, or a government agency.", why:"This is the job that matches the word zoology most directly." },
        { q:"What does a veterinarian do?", a:"Treats sick and injured animals. That includes checkups, vaccines, medicine, and surgery. Some vets work with pets, some with farm animals, some with zoo or wild animals.", why:"Veterinary is the vocabulary word. A veterinarian is the person who does that work." },
        { q:"What does a zookeeper do?", a:"Takes care of zoo animals every day: feeding them, cleaning their habitats, watching for health problems, and giving them things to do so they stay active. Many also talk with visitors about the animals." },
        { q:"What does a marine biologist do?", a:"Studies life in the ocean. The work can include diving, tagging animals, surveying from boats, testing water, and lab research. Some study one species; others study a whole ocean habitat.", why:"Marine biology is the vocabulary term. A marine biologist is the person who does it." },
        { q:"What does a wildlife biologist do?", a:"Studies non-domesticated animals in the places they naturally live. They count populations, track animal health, and help build plans to protect species. Many work for state or federal agencies.", why:"Wildlife is the vocabulary word. A wildlife biologist studies wildlife for a living." }
      ]},
      { name:"Classification and Category Names", cards:[
        { q:"1. The science of naming and classifying organisms is called what?", a:"Taxonomy.\nIt is the part of biology that gives every living thing a name and sorts it into groups with organisms that are like it.", why:"This is the name for the whole unit. Everything else on this sheet is a rule that taxonomy uses.", tip:"Taxonomy comes from the Greek taxis, meaning arrangement, and nomos, meaning law. It is literally the rules for arranging things." },
        { q:"2. Aristotle organized a system of classification. How long ago?", a:"More than 2,000 years ago.\nAristotle was a Greek thinker who lived from about 384 to 322 BC, so it is really closer to 2,350 years. Most notes just write it as more than 2,000 years ago.", why:"He grouped animals by where they lived, such as land, water, or air. That is habitat, not how closely related they are, so his system was replaced." },
        { q:"3. The system of binomial nomenclature we use now was developed by whom?", a:"Carolus Linnaeus, a Swedish scientist in the 1700s.\nHis name is also written Carl Linnaeus. He gave each organism a two word Latin name, and biologists still use his system today.", tip:"Binomial means two names. Nomenclature means naming. So binomial nomenclature is just a two name naming system." },
        { q:"4. The first letter of the genus is always what?", a:"Capitalized.\nExample: in Homo sapiens, the H in Homo is a capital letter.", why:"This is a rule about how the name is written, not about the organism itself. The genus is the bigger group and it always comes first." },
        { q:"5. The first letter of the species is always what?", a:"Lowercase.\nExample: in Homo sapiens, the s in sapiens stays small. It stays lowercase even when the species name comes from a person's name or a place.", tip:"Big group, big letter. Small group, small letter." },
        { q:"6. How is the scientific name for humans correctly written?", a:"Homo sapiens.\nCapital H, lowercase s, and both words in italics when typed. If you are writing by hand, underline each word instead.", why:"This one shows all the rules at once: genus first and capitalized, species second and lowercase, plus the italics." },
        { q:"7. Scientific names are written in what language?", a:"Latin.\nLatin is nobody's everyday language now, so the words do not shift or change meaning over time.", why:"A shared naming language means biologists anywhere can talk about the same organism. A scientist in Japan and one in Brazil both write Homo sapiens." },
        { q:"8. What two parts make up a scientific name?", a:"The genus and the species.\nGenus comes first and names the group of closely related organisms. Species comes second and names the one exact kind. In Homo sapiens, Homo is the genus and sapiens is the species.", why:"The genus is like a last name shared by close relatives. The species is like a first name for one exact kind. The order is flipped, so the last name goes first." },
        { q:"9. What are the seven categories of classification in their proper order (a through g)?", a:"a. Kingdom\nb. Phylum\nc. Class\nd. Order\ne. Family\nf. Genus\ng. Species\nThey run from the biggest, broadest group down to the smallest, most exact one.", why:"Each step down holds fewer organisms that are more alike. A kingdom holds millions of species. A species holds just one kind.", tip:"King Philip Came Over For Good Soup.\nThe first letter of each word matches the first letter of each category, in order." },
        { q:"10. A biological ___ is a group of actually or potentially interbreeding natural populations that are reproductively isolated from other such groups. What word fills the blank?", a:"Species.\nIn plain words, a species is a group of living things that can breed with each other and have young that can later have young of their own. In the wild they do not breed with other groups.", why:"Reproductively isolated is the key phrase. Two groups that cannot produce fertile offspring together count as two separate species.", tip:"A horse and a donkey can produce a mule, but mules cannot have babies. That is why horses and donkeys stay two different species." },
        { q:"Bovine means which animals?", a:"Cattle.\nThat covers beef cattle and dairy cattle.", why:"It is the first word on Finch's list, and cattle is the animal her breed example uses too: Bos taurus and Angus.", tip:"Bovine and beef come from the same old Latin word for cattle, bos. Beef cattle are bovine." },
        { q:"Ovine means which animal?", a:"Sheep.", why:"Ovine is the one word on this list with no easy sound hook, so it usually needs a few extra passes. Ovine equals sheep. That is all it means." },
        { q:"Porcine means which animals?", a:"Swine, which means pigs and hogs.", tip:"Porcine and pork come from the same Latin word, porcus, meaning pig." },
        { q:"Aves, written on the list as Aves/Poultry, means which animals?", a:"Birds.\nOn Finch's list that means chickens and turkeys.", tip:"Aves is Latin for birds. Same root as aviary, the bird house at a zoo, and aviation, which means flying. Poultry is the farm word for birds people raise, like chickens and turkeys." },
        { q:"Equine means which animals?", a:"Horses.", tip:"Equine and equestrian match. Equestrian events at the Olympics are the horse events." },
        { q:"Caprine means which animals?", a:"Goats.", tip:"Caprine and Capricorn come from the same Latin root for goat. Capricorn is the goat sign in the zodiac." },
        { q:"Feline means which animals?", a:"Cats." },
        { q:"Canine means which animals?", a:"Dogs.", tip:"Your canine teeth are the pointed ones. They are named after dog fangs." },
        { q:"Ovine and caprine get mixed up a lot. Which is which?", a:"Ovine is sheep.\nCaprine is goats.", tip:"Lock down caprine first using Capricorn the goat. Then ovine is the leftover one, and leftover equals sheep." },
        { q:"List all eight category words with the animal for each.", a:"Bovine equals cattle, beef and dairy.\nOvine equals sheep.\nPorcine equals swine, pigs and hogs.\nAves or poultry equals birds, chickens and turkeys.\nEquine equals horses.\nCaprine equals goats.\nFeline equals cats.\nCanine equals dogs.", why:"It is an eight word list, so it helps to be able to run the whole set in one go.", tip:"Four of these already show up in everyday English: canine for dogs, feline for cats, equine for horses, porcine for pigs. That leaves four to really lock in: bovine, ovine, aves, caprine." },
        { q:"What does breed mean?", a:"A breed is a smaller, more specific group inside a species.\nThe genus and species name the animal itself. A breed is a particular type within that species, usually one people developed for certain traits like size, milk, or meat.", tip:"Think dog, then Labrador. Dog is the species level. Labrador is the breed." },
        { q:"Bos taurus is the scientific name for beef cattle. So what is Angus?", a:"Angus is a breed of beef cattle.\nBos taurus is the species. Angus is one specific type of cattle inside that species.", tip:"Order of size: species is the bigger group, breed is the narrower group inside it." },
        { q:"Name the seven categories of classification in order, largest group to smallest.", a:"Kingdom, Phylum, Class, Order, Family, Genus, Species.", tip:"King Philip Came Over For Good Soup. First letters match: K P C O F G S." },

      ]}
    ] }
};

function $(s){ return document.querySelector(s); }
var APP = $("#app");

/* ---- storage: memory is the truth, disk is best effort (iOS file:// safe) ---- */
function readLS(k, fallback){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function writeLS(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var PROGRESS = readLS("s1Progress", {}) || {};
var TASKDONE = readLS("s1Tasks", {}) || {};
var DAY      = readLS("s1Day", null);

function saveProgress(){ writeLS("s1Progress", PROGRESS); }
function saveTasks(){ writeLS("s1Tasks", TASKDONE); }
function saveDay(){ writeLS("s1Day", DAY); }

function isMastered(id){ return !!PROGRESS[id]; }
function setMastered(id, v){ if(v) PROGRESS[id] = 1; else delete PROGRESS[id]; saveProgress(); }

function todayKey(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function prettyDay(){
  try{ return new Date().toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" }); }
  catch(e){ return todayKey(); }
}

/* ---- card helpers ---- */
function classCards(key, unitIdx){
  var out = [];
  (CLASSES[key].units || []).forEach(function(u, ui){
    /* unitIdx scopes the pool to one section. The id below still uses the real
       ui, so "done" survives filtering. Never renumber it. */
    if(typeof unitIdx === "number" && ui !== unitIdx) return;
    (u.cards || []).forEach(function(c, ci){
      out.push({ q:c.q, a:c.a, why:c.why, tip:c.tip, unit:u.name, cls:key, id: key+":"+ui+":"+ci });
    });
  });
  return out;
}
/* Lets him move to a different class for the next thing. Collapsed behind one quiet
   link by default: naming four other classes with work outstanding, unprompted, is
   showing him the pile, which is the one thing this screen must not do. Only classes
   with an OPEN task appear, and only if there is more than one to choose from. */
function taskSwitcher(currentId){
  var seen = {}, keys = [];
  openTasks().forEach(function(t){
    if(t.id === currentId || seen[t.cls]) return;
    seen[t.cls] = 1; keys.push(t.cls);
  });
  if(!keys.length) return "";
  if(!taskPick) return '<button class="linkbtn swlink" id="swOpen">work on a different class</button>';
  var chips = keys.map(function(k){
    return '<button class="tab" data-k="'+k+'">'+esc(CLASSES[k].name)+'</button>';
  }).join("");
  return '<p class="swhead">Move to</p><div class="tabs swtabs">'+chips+'</div>'
    + '<button class="linkbtn swlink" id="swClose">never mind</button>';
}
function wireTaskSwitcher(d, step){
  var o = $("#swOpen");
  if(o) o.addEventListener("click", function(){ taskPick = true; render(); });
  var c = $("#swClose");
  if(c) c.addEventListener("click", function(){ taskPick = false; render(); });
  document.querySelectorAll(".swtabs .tab").forEach(function(b){
    b.addEventListener("click", function(){
      var next = openTasks().filter(function(t){ return t.cls === b.dataset.k; })[0];
      if(!next) return;
      /* Swap which task this step points at. The plan's LENGTH never changes, which is
         what ensureDay's warning is about: pos indexes into it. */
      step.taskId = next.id;
      taskPick = false; saveDay(); render();
    });
  });
}

/* One tappable row per section, so a Friday quiz on one unit can be drilled on its
   own. He is five weeks behind: mixing five units into one round is how a deck stops
   being useful. Sections with no cards are dropped rather than shown empty. */
function sectionList(key){
  var units = CLASSES[key].units || [];
  var rows = units.map(function(u, ui){
    var us = unitStats(key, ui);
    if(!us.total) return "";
    return '<button class="sec" data-u="'+ui+'" style="--accent:'+CLASSES[key].color+'">'
      + '<span class="secname">'+esc(u.name)+'</span>'
      + '<span class="cbar"><i style="width:'+us.pct+'%"></i></span>'
      + '<span class="cnum">'+us.mastered+'/'+us.total+'</span>'
      + '</button>';
  }).join("");
  if(!rows) return "";
  return '<p class="sechead">Or pick one section</p><div class="seclist">'+rows+'</div>';
}

function unitStats(key, ui){
  var all = classCards(key, ui), m = 0;
  all.forEach(function(c){ if(isMastered(c.id)) m++; });
  return { mastered:m, total:all.length, pct: all.length ? Math.round(m/all.length*100) : 0 };
}

function classStats(key){
  var all = classCards(key), m = 0;
  all.forEach(function(c){ if(isMastered(c.id)) m++; });
  return { mastered:m, total:all.length, pct: all.length ? Math.round(m/all.length*100) : 0 };
}
function anyContent(){
  return Object.keys(CLASSES).some(function(k){ return classCards(k).length > 0; }) || TASKS.length > 0;
}

function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){ return esc(s).replace(/\n/g,"<br>"); }

var _seed = 7;
function pseudo(){ _seed = (_seed*9301 + 49297) % 233280; return _seed/233280; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor((i+1)*pseudo()); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ==================================================================
   TODAY: a fixed, predictable plan. At most three things, one at a time.
   The rule is stated in the app so it is never a surprise:
     one assignment to turn in, then two short rounds.
     No assignments left -> three short rounds.
   The backlog is never shown.
   ================================================================== */
var ROUND_SIZE = 5;

function openTasks(){ return TASKS.filter(function(t){ return !TASKDONE[t.id]; }); }

function neediestClass(exclude){
  var best = null, bestN = 0;
  Object.keys(CLASSES).forEach(function(k){
    if(exclude && exclude.indexOf(k) !== -1) return;
    var n = classCards(k).filter(function(c){ return !isMastered(c.id); }).length;
    if(n > bestN){ bestN = n; best = k; }
  });
  return best;
}

function buildPlan(){
  var plan = [], t = openTasks();
  if(t.length) plan.push({ kind:"task", taskId:t[0].id });
  var used = [];
  while(plan.length < 3){
    var k = neediestClass(used);
    if(!k) break;
    used.push(k);
    plan.push({ kind:"round", cls:k });
  }
  /* fewer than three classes with cards: allow repeats rather than a short day */
  while(plan.length < 3 && used.length){
    plan.push({ kind:"round", cls:used[plan.length % used.length] });
  }
  return plan;
}

function ensureDay(){
  var key = todayKey();
  if(!DAY || DAY.key !== key){
    DAY = { key:key, plan:buildPlan(), pos:0, doneCount:0, cardsGot:0 };
    saveDay();
  }
  /* The plan is immutable once built. Never splice it: pos indexes into it, and
     a day that changes length mid-session is exactly the kind of surprise this
     screen exists to avoid. Already-done steps are skipped in renderToday. */
  if(DAY.pos > DAY.plan.length) DAY.pos = DAY.plan.length;
  return DAY;
}

   Both entry points render the SAME card. Alex asked to be able to open any item and get the

function drawTaskCard(t, opts){

  var stepsHTML = (t.steps || []).map(function(s){ return '<li>'+fmt(s)+'</li>'; }).join("");
  APP.innerHTML = demoBar()
    + (opts.backLabel ? '<button class="linkbtn backlink" id="backBtn">'+esc(opts.backLabel)+'</button>' : '')
    + '<div class="card" style="--accent:'+c.color+'">'
    +   '<span class="chip">'+esc(c.name)+'</span>'
    +   (t.mins ? '<span class="mins">about '+esc(t.mins)+' min</span>' : "")
    +   '<h2>'+fmt(t.title)+'</h2>'
    +   (t.due ? '<p class="lede">'+esc(dueLabel(t.due))+'</p>' : "")
    +   (stepsHTML ? '<ol class="steps">'+stepsHTML+'</ol>' : "")
    +   '<div class="actions">'
    +     '<button class="btn primary" id="doneBtn">Done<small>that is one off the list</small></button>'
    +     '<button class="btn" id="skipBtn">'+esc(opts.secondLabel || "Not today")+'</button>'
    +   '</div>'
    +   (opts.extra || "")
    + '</div>'
    + '<p class="lowkey">Stop whenever you want. Anything you do counts.</p>';

  $("#doneBtn").addEventListener("click", function(){
    TASKDONE[t.id] = 1; saveTasks();
    ping("task_done", { title:t.title, cls:c.name });
    if(opts.onDone) opts.onDone();
  });
  $("#skipBtn").addEventListener("click", function(){ if(opts.onSecond) opts.onSecond(); });
  if(opts.backLabel) $("#backBtn").addEventListener("click", function(){ if(opts.onBack) opts.onBack(); });
}

/* Neutral wording on purpose. Every one of these is already past its date, and ten red
   "LATE" badges is just a list of ways he has failed. State the fact, drop the alarm. */
function dueLabel(iso){
  var p = iso.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var today = new Date(); today.setHours(0,0,0,0);
  var days = Math.round((d - today) / 86400000);
  var when;
  try { when = d.toLocaleDateString(undefined, { month:"long", day:"numeric" }); }
  catch(e){ when = iso; }
  if(days === 0)  return "Due today";
  if(days === 1)  return "Due tomorrow";
  if(days > 1)    return "Due " + when;
  if(days === -1) return "Was due yesterday";
  return "Was due " + when;
}

/* ---------------- Check-in: the screen Alex SHOWS, rather than one that reports on him ----
   The OT prescribed "an assignment-tracking system with an adult touchpoint". This is that
   touchpoint. It is deliberately something he hands over, not something that phones home:
   nothing here leaves the device, and there is no version of it he does not know about.
   That matters more than the data would: a kid with demand avoidance who finds out he was
   being silently measured stops opening the app, and then there is no data at all. */
/* Parent-only. The answer keys and the MSDS scaffold, grouped by subject. */
function renderAnswerKeys(){
  var groups = ANSWER_KEYS.map(function(g){
    var lis = g.items.map(function(it){
      return '<li'+(it.all ? ' class="allrow"' : '')+'>'
        + '<a href="'+KEYS_BASE+it.f+'" target="_blank" rel="noopener">'
        +   '<span class="pdf">PDF</span>'
        +   '<span>'+esc(it.t)+'</span>'
        +   (it.isnew ? '<span class="isnew">NEW</span>' : '')
        + '</a></li>';
    }).join("");
    return '<div class="keygrp"><h4>'+esc(g.subject)+'</h4><ul class="keylist">'+lis+'</ul></div>';
  }).join("");
  return '<div class="card">'
    + '<p class="keyhead">Answer keys</p>'
    + '<p class="subline">The blue block in each one is what goes on his paper. Grey text is context for you.</p>'
    + groups
    + '</div>';
}

function renderCheckin(){
  var d = ensureDay();
  var doneTasks = TASKS.filter(function(t){ return !!TASKDONE[t.id]; });
  var keys = Object.keys(CLASSES).filter(function(k){ return classCards(k).length > 0; });

  setHeader("Semester 1", "For dad", false);

  var todayLine;
  if(d.doneCount) todayLine = d.doneCount + (d.doneCount === 1 ? " thing" : " things") + " today";
  else            todayLine = "nothing today";

  var rows = keys.map(function(k){
    var st = classStats(k), cl = CLASSES[k];

    return '<div class="crow" style="--accent:'+cl.color+'">'
      + '<span class="cname">'+esc(cl.name)+'</span>'
      + '<span class="cbar"><i style="width:'+pct+'%"></i></span>'
      + '<span class="cnum">'+st.mastered+'/'+st.total+'</span>'
      + '</div>';
  }).join("");

  var recent = doneTasks.slice(-3).reverse().map(function(t){
    return '<li>'+esc(t.title)+'</li>';
  }).join("");

  APP.innerHTML = demoBar()
    + '<button class="linkbtn backlink" id="backBtn">back</button>'

    +   '<p class="subline" style="text-align:center">'+esc(prettyDay())+'</p>'
    +   '<p class="statline" style="text-align:center"><b>'+doneTasks.length+' of '+TASKS.length+'</b> assignments finished'
    +     (d.cardsGot ? ' &middot; <b>'+d.cardsGot+'</b> right today' : '')+'</p>'
    +   (rows ? '<div class="clist">'+rows+'</div>' : '')
    +   (recent ? '<p class="bgtag2">Most recently finished</p><ul class="donelist">'+recent+'</ul>' : '')
    + '</div>'
    + '<p class="lowkey">Nothing on this screen is sent anywhere. It only reads what is on this phone.</p>';

  $("#backBtn").addEventListener("click", function(){ view = "today"; render(); });
}

/* ---------------- Everything: the full list, in date order ----------------
   Alex asked for this. A list he chooses to open is not a demand, it is agency,
   and ten items is not a wall. Done items stay visible so progress accumulates. */
function renderList(){
  var open = TASKS.filter(function(t){ return !TASKDONE[t.id]; });
  var done = TASKS.filter(function(t){ return !!TASKDONE[t.id]; });
  var byDue = function(a,b){ return (a.due||"").localeCompare(b.due||""); };
  open.sort(byDue); done.sort(byDue);

  setHeader("Semester 1", "Everything", false);

  var row = function(t, isDone){
    var c = CLASSES[t.cls];
    return '<button class="row'+(isDone?" rowdone":"")+'" data-id="'+esc(t.id)+'" style="--accent:'+c.color+'">'
      + '<span class="rowmark" aria-hidden="true">'+(isDone?"&#10003;":"")+'</span>'
      + '<span class="rowmain">'
      +   '<span class="rowtitle">'+esc(t.title)+'</span>'
      +   '<span class="rowmeta">'+esc(c.name)+(t.due ? ' &middot; '+esc(dueLabel(t.due)) : '')
      +     (t.mins && !isDone ? ' &middot; about '+esc(t.mins)+' min' : '')+'</span>'
      + '</span>'
      + '<span class="rowchev" aria-hidden="true">&rsaquo;</span>'
      + '</button>';
  };

  var html = demoBar() + backToTodayLink();
  if(!TASKS.length){
    html += '<div class="empty"><b>Nothing on the list</b>No assignments are loaded yet.</div>';
  } else {
    html += '<p class="counter">'+done.length+' of '+TASKS.length+' done</p>';
    if(open.length) html += '<div class="rows">'+open.map(function(t){ return row(t,false); }).join("")+'</div>';
    if(done.length){
      html += '<p class="grouphead">Finished</p>'
           +  '<div class="rows">'+done.map(function(t){ return row(t,true); }).join("")+'</div>';
    }
    if(!open.length) html += '<p class="lowkey">That is everything. Nothing is waiting on you.</p>';
  }
  APP.innerHTML = html;

  document.querySelectorAll(".row").forEach(function(r){
    r.addEventListener("click", function(){ detailId = r.dataset.id; view = "detail"; render(); });
  });
  wireBackToToday();
}

function renderDetail(){
  var t = TASKS.filter(function(x){ return x.id === detailId; })[0];
  if(!t){ view = "list"; return renderList(); }
  setHeader(CLASSES[t.cls].name, TASKDONE[t.id] ? "Finished" : "This one", false);
  drawTaskCard(t, {
    backLabel: "back to the list",
    secondLabel: "Leave it for now",
    onDone:   function(){ view = "list"; render(); },
    onSecond: function(){ view = "list"; render(); },
    onBack:   function(){ view = "list"; render(); }
  });
}

/* ---------------- the way through to the full list ----------------
   Deliberately a single quiet link, NOT a nav bar. A permanent "Everything" tab
   sits on screen all day inviting him to look at the pile, which is the opposite
   of what the Today screen is for. Today stays the default and the main event;
   the list is there when he goes looking for it. */
function listLink(){
  return '<button class="linkbtn" id="seeAllBtn">see everything</button>';
}
function wireListLink(){
  var b = $("#seeAllBtn");
  if(b) b.addEventListener("click", function(){ view = "list"; render(); });
}

/* Shown on Today whenever PING_URL is set. The rule from the day this app was built:
   sync is never silent. A kid with demand avoidance who discovers he was being measured
   without being told stops opening the app, and then there is no data at all. */
function syncNotice(){
  if(!PING_URL) return "";
  return '<p class="lowkey syncnote">Mom and dad can see how this is going.</p>';
}

function backToTodayLink(){
  return '<button class="linkbtn backlink" id="toTodayBtn">back to today</button>';
}
function wireBackToToday(){
  var b = $("#toTodayBtn");
  if(b) b.addEventListener("click", function(){ view = "today"; render(); });
}

/* ---------------- Today ---------------- */
function renderToday(){
  if(!anyContent()){
    setHeader("Semester 1", "Today", false);
    APP.innerHTML = demoBar() + '<div class="empty"><b>Nothing loaded yet</b>'
      + 'Your classes are set up, but there is no work in here yet. Nothing for you to do right now.</div>';
    return;
  }

  var d = ensureDay();
  setHeader("Semester 1", "Today", true);
  setToggle("today");

  if(d.pos >= d.plan.length){ view = "dayend"; return renderDayEnd(); }

  var step = d.plan[d.pos];

  if(step.kind === "task"){
    var t = TASKS.filter(function(x){ return x.id === step.taskId; })[0];
    /* gone from the data, or already ticked off elsewhere: step past it */
    if(!t || TASKDONE[step.taskId]){ d.pos++; saveDay(); return renderToday(); }
    drawTaskCard(t, {
      extra: taskSwitcher(t.id),
      secondLabel: "Not today",
      onDone: function(){
        d.doneCount++; d.pos++; saveDay();
        render();
      },
      onSecond: function(){ d.pos++; saveDay(); render(); }
    });
    wireTaskSwitcher(d, step);
    APP.insertAdjacentHTML("beforeend", syncNotice());
    APP.insertAdjacentHTML("beforeend", listLink());
    wireListLink();
    return;
  }

  /* round step */
  var k = step.cls, cl = CLASSES[k];
  APP.innerHTML = demoBar()
    + '<div class="card center" style="--accent:'+cl.color+'">'
    +   '<span class="chip">'+esc(cl.name)+'</span>'
    +   '<span class="mins">about 2 min</span>'
    +   '<h2>A quick round</h2>'
    +   '<p class="lede">'+ROUND_SIZE+' questions. You can stop after one.</p>'
    +   '<div class="actions">'
    +     '<button class="btn primary" id="startBtn">Start<small>'+ROUND_SIZE+' questions, about 2 minutes</small></button>'
    +     '<button class="btn" id="skipBtn">Not today</button>'
    +   '</div>'
    + '</div>'
    + '<p class="lowkey">Stop whenever you want. Anything you do counts.</p>';
  APP.insertAdjacentHTML("beforeend", syncNotice());
  APP.insertAdjacentHTML("beforeend", listLink());
  $("#startBtn").addEventListener("click", function(){ startRound(k, true); });
  $("#skipBtn").addEventListener("click", function(){ d.pos++; saveDay(); render(); });
  wireListLink();
}

/* ---------------- Round ---------------- */
function buildRound(k, unitIdx){
  var pool = classCards(k, unitIdx);
  if(!pool.length) return [];
  var un = pool.filter(function(c){ return !isMastered(c.id); });
  shuffle(un);
  var r = un.slice(0, ROUND_SIZE);
  if(r.length < ROUND_SIZE){
    var mas = pool.filter(function(c){ return isMastered(c.id); });
    shuffle(mas);
    r = r.concat(mas.slice(0, ROUND_SIZE - r.length));
  }
  return r;
}
function startRound(k, fromPlan, unitIdx){
  round = buildRound(k, unitIdx); rpos = 0; roundGot = 0; pclass = k;
  punit = (typeof unitIdx === "number") ? unitIdx : null;
  roundFromPlan = !!fromPlan;
  if(!round.length){ view = fromPlan ? "today" : "practice"; return render(); }
  view = "round"; render();
}
function renderRound(){
  var cl = CLASSES[pclass], c = round[rpos];
  var dots = "";
  for(var i=0;i<round.length;i++){ dots += '<i class="'+(i<rpos?"on":"")+(i===rpos?" now":"")+'"></i>'; }
  var us = (typeof punit === "number" && (cl.units||[])[punit]) ? (cl.units[punit].name || "") : "";
  $("#eyebrow").textContent = us || cl.name;
  $("#title").textContent = "Question " + (rpos+1) + " of " + round.length;
  $("#daterow").innerHTML = '<div class="dotrow" aria-hidden="true">'+dots+'</div>';

  APP.innerHTML = demoBar()
    + '<div class="card" id="qc" style="--accent:'+cl.color+'">'
    +   '<p class="qtext">'+fmt(c.q)+'</p>'
    +   '<div class="answer"><span class="lbl">Answer</span>'+fmt(c.a)
    +     (c.why ? '<div class="callout why"><span class="tag">Why</span>'+fmt(c.why)+'</div>' : "")
    +     (c.tip ? '<div class="callout tip"><span class="tag">Memory trick</span>'+fmt(c.tip)+'</div>' : "")
    +   '</div>'
    +   '<div class="actions" id="revealWrap"><button class="btn primary" id="showBtn">Show answer</button></div>'
    +   '<div class="btnrow hide" id="gradeWrap">'
    +     '<button class="btn rev" id="missBtn">Still learning</button>'
    +     '<button class="btn good" id="gotBtn">Got it</button>'
    +   '</div>'
    + '</div>'
    + '<button class="linkbtn" id="stopBtn">stop for now</button>';

  $("#showBtn").addEventListener("click", function(){
    $("#qc").classList.add("revealed");
    $("#revealWrap").classList.add("hide");
    $("#gradeWrap").classList.remove("hide");
    $("#gotBtn").focus();
  });
  $("#gotBtn").addEventListener("click", function(){ setMastered(c.id, true); roundGot++; advance(); });
  $("#missBtn").addEventListener("click", function(){ setMastered(c.id, false); advance(); });
  $("#stopBtn").addEventListener("click", function(){ view = "today"; render(); });
}
function advance(){
  rpos++;
  if(rpos >= round.length){
    var d = ensureDay();
    d.cardsGot += roundGot;
    /* only a round that came from today's plan advances today's plan;
       a round started from Practice must not consume a slot */
    if(roundFromPlan && d.plan[d.pos] && d.plan[d.pos].kind === "round"){ d.pos++; d.doneCount++; }
    saveDay();
    ping("round_done", { cls:CLASSES[pclass].name, score:roundGot + "/" + round.length });
    view = "win";
  }
  render();
}

/* ---------------- Win ---------------- */
function renderWin(){
  var cl = CLASSES[pclass], st = classStats(pclass), d = ensureDay();
  var msgs = ["That round is done.", "That counts.", "Every round adds up.", "You showed up. That matters."];
  var msg = msgs[(st.mastered + roundGot) % msgs.length];
  var left = roundFromPlan ? (d.plan.length - d.pos) : 0;

  $("#eyebrow").textContent = cl.name;
  $("#title").textContent = "Round complete";
  $("#daterow").innerHTML = "";

  APP.innerHTML = demoBar()
    + '<div class="card center" style="--accent:'+cl.color+'">'
    +   '<div class="mark" aria-hidden="true">&#10003;</div>'
    +   '<p class="bigline">Round complete</p>'
    +   '<p class="subline">'+esc(msg)+'</p>'
    +   '<p class="statline">Got <b>'+roundGot+' of '+round.length+'</b> this round'
    +     (st.total ? ' &middot; <b>'+st.mastered+' of '+st.total+'</b> known in '+esc(cl.name) : "")+'</p>'
    +   '<div class="actions">'
    +     (left > 0
        ? '<button class="btn primary" id="nextBtn">Next thing<small>'+left+' left today</small></button>'
        : '<button class="btn primary" id="nextBtn">Finish up<small>'
          + (roundFromPlan ? "that was the last one" : "back to where you were") + '</small></button>')
    +     '<button class="btn" id="againBtn">One more round</button>'
    +     '<button class="btn" id="stopBtn">I am good for now</button>'
    +   '</div>'
    + '</div>';

  $("#nextBtn").addEventListener("click", function(){ view = roundFromPlan ? "today" : "practice"; render(); });
  $("#againBtn").addEventListener("click", function(){ startRound(pclass, false); });
  $("#stopBtn").addEventListener("click", function(){ view = "dayend"; render(); });
}

/* ---------------- End of day ---------------- */
function renderDayEnd(){
  var d = ensureDay(), did = d.doneCount;
  /* Three states, not two. Saying "nothing owed" after he skipped everything
     would be a flat lie, and getting caught in one costs more than the nudge
     is worth. Skipping is allowed, so the copy stays neutral about it. */
  var head, sub;
  if(did){
    head = "Done for today";
    sub  = "You finished " + did + (did === 1 ? " thing" : " things") + " today. That is the whole ask.";
  } else if(d.plan.length){
    head = "Left for another day";
    sub  = "Nothing got done today, and that is allowed. It will be here tomorrow.";
  } else {
    head = "Nothing owed today";
    sub  = "Nothing is waiting on you right now.";
  }
  setHeader("Semester 1", "That is today", false);
  APP.innerHTML = demoBar()
    + '<div class="card center">'
    /* a checkmark over a day where nothing happened reads as mockery */
    +   (did || !d.plan.length ? '<div class="mark" aria-hidden="true">&#10003;</div>' : '')
    +   '<p class="bigline">'+esc(head)+'</p>'
    +   '<p class="subline">'+esc(sub)+'</p>'
    +   (d.cardsGot ? '<p class="statline">You got <b>'+d.cardsGot+'</b> question'+(d.cardsGot===1?"":"s")+' right today.</p>' : "")
    +   '<div class="actions">'
    +     '<button class="btn" id="showDadBtn">Show dad how it is going</button>'
    +     '<button class="btn" id="practiceBtn">Practice something anyway</button>'
    +   '</div>'
    + '</div>'
    + '<p class="lowkey">New list tomorrow. Nothing carries over as a punishment.</p>'
    + listLink();
  wireListLink();
  $("#showDadBtn").addEventListener("click", function(){ view = "checkin"; render(); });
  $("#practiceBtn").addEventListener("click", function(){ view = "practice"; pclass = pclass || neediestClass(); render(); });
}

/* ---------------- Practice on my own ---------------- */
function ringSVG(pct, color){
  var r = 40, c = 2*Math.PI*r, off = c*(1 - pct/100);
  return '<svg class="ring" width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="'+pct+' percent known">'
    + '<circle cx="52" cy="52" r="'+r+'" fill="none" stroke="#e3e8ec" stroke-width="9"/>'
    + '<circle cx="52" cy="52" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" '
    +   'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 52 52)"/>'
    + '<text x="52" y="60" text-anchor="middle" font-size="24" font-weight="800" fill="'+color+'">'+pct+'%</text>'
    + '</svg>';
}
function renderPractice(){
  setHeader("Semester 1", "Practice", false);
  setToggle("practice");
  var keys = Object.keys(CLASSES).filter(function(k){ return classCards(k).length > 0; });
  if(!keys.length){
    APP.innerHTML = '<div class="empty"><b>Nothing to practice yet</b>No questions have been added.</div>'
      + '<button class="linkbtn" id="backBtn">back to today</button>';
    $("#backBtn").addEventListener("click", function(){ view = "today"; render(); });
    return;
  }
  if(keys.indexOf(pclass) === -1) pclass = keys[0];
  var cl = CLASSES[pclass], st = classStats(pclass);

  var tabs = keys.map(function(k){
    var on = k === pclass;
    return '<button class="tab'+(on?" on":"")+'" data-k="'+k+'"'
      + (on ? ' style="background:'+CLASSES[k].color+'; border-color:'+CLASSES[k].color+'"' : "")
      + ' aria-pressed="'+on+'">'+esc(CLASSES[k].name)+'</button>';
  }).join("");

  APP.innerHTML = demoBar()
    + '<div class="tabs">'+tabs+'</div>'
    + '<div class="card center" style="--accent:'+cl.color+'">'
    +   ringSVG(st.pct, cl.color)
    +   '<p class="classname">'+esc(cl.name)+'</p>'
    +   '<p class="classstat">'+st.mastered+' of '+st.total+' known</p>'
    +   '<button class="btn primary" id="goBtn">Start a round<small>anything in '+esc(cl.name)+'</small></button>'
    + '</div>'
    + sectionList(pclass)
    + '<button class="linkbtn" id="backBtn">back to today</button>';

  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){ pclass = t.dataset.k; punit = null; render(); });
  });
  $("#goBtn").addEventListener("click", function(){ startRound(pclass, false); });
  document.querySelectorAll(".sec").forEach(function(b){
    b.addEventListener("click", function(){
      startRound(pclass, false, parseInt(b.dataset.u, 10));
    });
  });
  $("#backBtn").addEventListener("click", function(){ view = "today"; render(); });
}

/* ==================================================================
   PARENT PING
   Off until PING_URL is set. When it is on, the line under Today
   says so, so it is never something Alex discovers later.
   ================================================================== */
/* OFF, deliberately. Setting this to an Apps Script endpoint turns the app into something that
   reports on Alex in the background. The "Show dad how it is going" screen exists so that the
   check-in happens without that. If you do decide you want passive visibility, set the URL AND
   add a visible line to the Today screen telling Alex it is on. Do not run it silently. */
var PING_URL = "https://script.google.com/macros/s/AKfycbxKn-CXg9HWwE8QqVnDMfOTw1KY_lMdQizvvm5kkBlNfm6Kbw9sUSRVzVeTdOV6NdSxPA/exec";
var PING_KEY = "alexsem1";   /* must match KEY in the Apps Script */

/* The whole picture in one object, so the parent page can show real numbers instead of
   a stream of events. Sent with every ping; it is a few hundred bytes. */
function snapshot(){
  var done = TASKS.filter(function(t){ return !!TASKDONE[t.id]; });
  var cls = Object.keys(CLASSES).filter(function(k){ return classCards(k).length > 0; })
    .map(function(k){
      var st = classStats(k);
      return { name: CLASSES[k].name, known: st.mastered, total: st.total };
    });
  var total = 0, known = 0;
  cls.forEach(function(c){ total += c.total; known += c.known; });
  return {
    tasksDone: done.length, tasksTotal: TASKS.length,
    cardsKnown: known, cardsTotal: total,
    classes: cls,
    recent: done.slice(-3).reverse().map(function(t){ return t.title; })
  };
}

function sessionId(){
  var s = readLS("s1Session", null);
  if(!s){ s = Math.random().toString(36).slice(2,10); writeLS("s1Session", s); }
  return s;
}
function ping(event, extra){
  if(!PING_URL) return;
  try{
    var payload = { key:PING_KEY, student:"Alex", event:event, day:todayKey(), session:sessionId() };
    var snap = snapshot();
    for(var sk in snap) payload[sk] = snap[sk];
    if(extra) for(var k in extra) payload[k] = extra[k];
    fetch(PING_URL, { method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(payload) });
  }catch(e){}
}

render();
