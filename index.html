<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Semester 1</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1a1f24; --muted:#55606b; --faint:#646f7a;
    --line:#d8dee4; --line2:#e7ebef;
    --accent:#1d6fb8;
    --good:#1e7d4f; --review:#a8421b;
    --tipbg:#fff6e0; --tipink:#5c4708; --tipline:#e8c45a;
    --whybg:#eef4fb; --whyink:#1f3b54; --whyline:#bcd6ef;
    --c-eng:#6f46b0; --c-chem:#1d6fb8; --c-hist:#a8481f; --c-span:#1d6b42; --c-zoo:#0f6168;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px;}

  header{padding:calc(env(safe-area-inset-top) + 18px) 0 4px;}
  .eyebrow{font-size:12px; letter-spacing:.9px; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0;}
  h1{font-size:26px; margin:2px 0 0; letter-spacing:-.3px;}
  .daterow{display:flex; align-items:center; gap:10px; margin-top:10px; min-height:14px;}
  .dotrow{display:flex; gap:7px;}
  .dotrow i{width:9px; height:9px; border-radius:99px; background:#c3ccd4; display:block;}
  .dotrow i.on{background:var(--good);}
  .dotrow i.now{background:var(--accent); box-shadow:0 0 0 3px rgba(29,111,184,.18);}
  .daterow .when{font-size:13px; color:var(--muted);}

  main{max-width:560px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 40px);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:0 2px 10px rgba(16,24,32,.055);}
  .chip{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.3px;
    color:#fff; background:var(--accent); border-radius:99px; padding:3px 11px;}
  .mins{font-size:13px; color:var(--muted); margin-left:8px;}
  .card h2{font-size:20px; margin:13px 0 0; line-height:1.3; letter-spacing:-.2px;}
  .card .lede{font-size:14.5px; color:var(--muted); margin:7px 0 0;}

  ol.steps{margin:16px 0 0; padding-left:0; list-style:none; counter-reset:s;}
  ol.steps li{counter-increment:s; position:relative; padding:9px 0 9px 34px; font-size:15px; border-top:1px solid var(--line2);}
  ol.steps li:first-child{border-top:none;}
  ol.steps li::before{content:counter(s); position:absolute; left:0; top:9px;
    width:23px; height:23px; border-radius:99px; background:#eef1f4; color:var(--muted);
    font-size:12.5px; font-weight:800; text-align:center; line-height:23px;}

  .btn{display:block; width:100%; border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:13px 14px; border-radius:12px; font-size:15px; font-weight:650; cursor:pointer;
    font-family:inherit; text-align:center; -webkit-appearance:none;}
  .btn:focus-visible,.linkbtn:focus-visible,.tab:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-size:17px;
    font-weight:800; padding:17px 14px; box-shadow:0 4px 14px rgba(16,24,32,.14);}
  .btn.primary small{display:block; font-size:13px; font-weight:600; margin-top:3px; opacity:.94;}
  .btn.good{background:var(--good); border-color:var(--good); color:#fff;}
  .btn.rev{background:var(--review); border-color:var(--review); color:#fff;}
  .btnrow{display:flex; gap:9px; margin-top:12px;}
  .btnrow .btn{margin-top:0;}
  .actions{margin-top:20px; display:flex; flex-direction:column; gap:9px;}
  .linkbtn{background:none; border:none; color:var(--muted); font-size:13.5px; text-decoration:underline;
    cursor:pointer; font-family:inherit; padding:8px; display:block; margin:0 auto;}
  .lowkey{color:var(--muted); font-size:13.5px; text-align:center; margin:18px 6px 0; line-height:1.55;}

  /* question card */
  .qtext{font-size:18px; font-weight:650; margin:0; line-height:1.4;}
  .answer{font-size:15.5px; border-top:1px solid var(--line2); padding-top:15px; margin-top:16px; display:none;}
  .card.revealed .answer{display:block;}
  .answer .lbl{display:block; font-size:11px; letter-spacing:.8px; text-transform:uppercase;
    color:var(--faint); font-weight:800; margin-bottom:5px;}
  .callout{margin-top:12px; padding:10px 12px; border-radius:10px; font-size:13.5px;}
  .why{background:var(--whybg); border-left:3px solid var(--whyline); color:var(--whyink);}
  .tip{background:var(--tipbg); border-left:3px solid var(--tipline); color:var(--tipink);}
  .callout .tag{font-weight:800; text-transform:uppercase; font-size:10.5px; letter-spacing:.7px;
    display:block; margin-bottom:2px;}

  /* win / done */
  .center{text-align:center;}
  .mark{width:62px; height:62px; border-radius:99px; background:var(--good); color:#fff;
    font-size:32px; line-height:62px; margin:0 auto 14px;}
  .bigline{font-size:22px; font-weight:800; margin:0 0 5px; letter-spacing:-.2px;}
  .subline{color:var(--muted); font-size:15px; margin:0;}
  .statline{font-size:14px; margin:16px 0 0; color:var(--muted);}
  .statline b{color:var(--ink);}

  /* practice-on-my-own */
  .tabs{display:flex; gap:7px; flex-wrap:wrap; margin:0 0 14px;}
  .tab{flex:1 1 auto; min-width:92px; border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:10px 8px; border-radius:11px; font-size:13.5px; font-weight:700; cursor:pointer;
    font-family:inherit; text-align:center;}
  .tab.on{color:#fff;}
  .ring{display:block; margin:0 auto;}
  .classname{margin:14px 0 2px; font-size:19px; text-align:center;}
  .classstat{color:var(--muted); font-size:14px; margin:0 0 18px; text-align:center;}

  /* Everything list */
  .counter{font-size:13.5px; color:var(--muted); margin:0 0 12px; font-weight:650;}
  .grouphead{font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--faint);
    font-weight:700; margin:22px 0 8px;}
  .rows{display:flex; flex-direction:column; gap:8px;}
  .row{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:12px; padding:13px 14px; cursor:pointer; font-family:inherit; color:var(--ink);
    -webkit-appearance:none; box-shadow:0 1px 4px rgba(16,24,32,.045);}
  .row:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .rowmark{flex:0 0 20px; width:20px; height:20px; border-radius:99px; background:#eef1f4;
    color:#fff; font-size:12px; font-weight:800; line-height:20px; text-align:center;}
  .rowdone .rowmark{background:var(--good);}
  .rowmain{flex:1 1 auto; min-width:0;}
  .rowtitle{display:block; font-size:15.5px; font-weight:650; line-height:1.3;}
  .rowmeta{display:block; font-size:12.5px; color:var(--muted); margin-top:3px;}
  .rowdone .rowtitle{color:var(--muted); text-decoration:line-through;}
  .rowchev{flex:0 0 auto; color:var(--faint); font-size:20px; line-height:1;}
  .backlink{margin:0 0 12px; padding-left:0; text-align:left;}

  /* check-in screen */
  .clist{margin:18px 0 0; display:flex; flex-direction:column; gap:9px;}
  .crow{display:flex; align-items:center; gap:10px; font-size:13.5px;}
  .cname{flex:0 0 40%; font-weight:650;}
  .cbar{flex:1 1 auto; height:9px; background:#e7ebef; border-radius:99px; overflow:hidden;}
  .cbar i{display:block; height:100%; background:var(--accent); border-radius:99px;}
  .cnum{flex:0 0 auto; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px;}
  .bgtag2{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--faint);
    font-weight:800; margin:20px 0 6px;}
  ul.donelist{margin:0; padding-left:19px; font-size:14px; color:var(--muted);}
  ul.donelist li{margin:3px 0;}

  .empty{background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
    padding:30px 22px; text-align:center; color:var(--muted); font-size:15px;}
  .empty b{color:var(--ink); display:block; font-size:17px; margin-bottom:7px;}
  .hide{display:none !important;}
  .demobar{background:#fff4e0; color:#6b4800; border:1px solid #e8c45a; border-radius:10px;
    padding:9px 12px; font-size:13px; font-weight:700; text-align:center; margin-bottom:14px;}

  /* parent-only answer key index */
  .keyhead{font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted,#667);
    font-weight:700; margin:18px 0 6px;}
  .keygrp{margin:0 0 10px;}
  .keygrp h4{font-size:13.5px; margin:10px 0 4px; color:var(--muted,#667); font-weight:700;}
  .keylist{list-style:none; margin:0; padding:0;}
  .keylist li{margin:0; border-top:1px solid rgba(128,128,128,.22);}
  .keylist li:first-child{border-top:none;}
  .keylist a{display:flex; align-items:center; gap:8px; padding:9px 2px; text-decoration:none;
    color:inherit; font-size:15px; min-height:44px;}
  .keylist a:hover{text-decoration:underline;}
  .keylist .pdf{font-size:10.5px; font-weight:800; letter-spacing:.5px; opacity:.55;
    border:1px solid currentColor; border-radius:3px; padding:1px 4px;}
  .keylist .isnew{font-size:10.5px; font-weight:800; letter-spacing:.5px;
    background:#1d6fb8; color:#fff; border-radius:3px; padding:1px 5px;}
  .keylist .allrow a{opacity:.72; font-size:14px;}
  .sechead{font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted);
    font-weight:700; margin:22px 0 8px; text-align:center;}
  .seclist{display:flex; flex-direction:column; gap:7px; margin:0 0 4px;}
  .sec{display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    border:1px solid var(--line); background:#fff; border-radius:11px; padding:12px 13px;
    font-family:inherit; font-size:13.5px; color:var(--ink); min-height:44px;}
  .sec:hover{border-color:var(--accent);}
  .sec:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .secname{flex:1 1 auto; font-weight:650; line-height:1.3;}
  .sec .cbar{flex:0 0 52px;}
  .swlink{margin-top:12px; font-size:13px;}
  .swhead{font-size:11.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted);
    font-weight:700; margin:16px 0 7px; text-align:center;}
  .swtabs{margin:0 0 2px; justify-content:center;}
  .swtabs .tab{flex:0 1 auto; font-size:13px; padding:9px 12px;}
  .syncnote{margin-top:14px; font-size:12.5px; opacity:.85;}
  .segwrap{margin-top:12px;}
  .seg{display:flex; background:var(--line2); border-radius:999px; padding:3px; gap:3px;}
  .segbtn{flex:1 1 50%; border:none; background:none; cursor:pointer; font-family:inherit;
    font-size:14.5px; font-weight:650; color:var(--muted); padding:9px 10px; border-radius:999px;
    min-height:44px; transition:background .15s, color .15s;}
  .segbtn.on{background:var(--ink); color:#fff;}
  .segbtn:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .mem .memrow{margin:0;}
  .mem .memrow + .memrow{margin-top:8px; padding-top:8px; border-top:1px dashed var(--tipline);}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="eyebrow" id="eyebrow">Semester 1</p>
    <h1 id="title">Today</h1>
    <div class="daterow" id="daterow"></div>
    <div class="segwrap" id="segwrap"></div>
  </div>
</header>

<main id="app"></main>

<script>
/* ==================================================================
   CONTENT
   ------------------------------------------------------------------
   TASKS: pulled from Alex's Google Classroom 2026-09-20. Only the work he
   can actually finish himself. The three Illuminate assessments whose testing
   window closed are deliberately NOT here: they need an email to Mrs. Finch,
   not homework time. CLASSES[].units is still empty, cards come next.

   CLASSES[key].units[].cards[] = { q, a, why?, tip? }        -> "learn it"
   TASKS[]                      = { id, cls, title, steps[], mins } -> "do it"
   ================================================================== */

var CLASSES = {
  eng:  { name:"English 10",        teacher:"Walters", color:"var(--c-eng)",  units:[
      { name:"Week 4: Parts of Speech and A Problem", cards:[
        { id:"eng-adcc091", q:"What is a noun?", a:"A person, place, thing, or abstract idea.", why:"A noun names something, so it can be the thing a sentence is about.", memType:"Picture it", mem:"Picture teacher David at the zoo hugging a bear, full of excitement: person, place, thing, abstract idea." },
        { id:"eng-c22a69e", q:"Quick way to check whether a word is a noun?", a:"Put a or an in front of it. If that sounds right, it is a noun.", why:"The words a and an introduce nouns, which is why this test works.", memType:"Picture it", mem:"Picture a sticker gun stamping a or an onto words. A playground: sticks. A quickly: falls off. Only nouns hold it." },
        { id:"eng-3fe22ba", q:"What is a pronoun?", a:"A word that replaces a noun.", memType:"Link it", mem:"A pronoun is a sub off the bench: David comes out, he goes in. I, you, she, it, we, they." },
        { id:"eng-d4c858e", q:"Besides I, he, you, she, it, we, they and him, name other words that can work as pronouns.", a:"one, their, this, those, few, many, some, both, which.", why:"They all stand in for a noun instead of naming it.", memType:"Story", mem:"At lunch, one kid asks which pizza is their pick, this or those. A few want pepperoni, many want cheese, some want both." },
        { id:"eng-7b59207", q:"What is a verb?", a:"A word for a physical action, a mental action, or a state of being.", memType:"Link it", mem:"Gaming: you jump (physical), you plan (mental), you are online (state of being). Verbs are mostly doing words." },
        { id:"eng-97e0353", q:"What are the three kinds of verbs, with an example of each?", a:"Physical action (jump), mental action (think), state of being (is).", why:"A state of being word like is, exist or become counts as a verb too, even though nothing moves.", memType:"Picture it", mem:"Picture yourself: jump, think, then just be. Body, brain, being. Jump, think, is." },
        { id:"eng-a81577a", q:"What is a preposition?", a:"A word that shows time or location.", why:"It places one thing in relation to another, in space or in time.", memType:"Link it", mem:"Preposition has position inside it: where or when. Like a map pin with a timestamp." },
        { id:"eng-1009474", q:"Name five prepositions.", a:"Any five, such as: above, after, against, along, among, before, between, in, off, opposite, toward, with, without.", memType:"Picture it", mem:"Picture a squirrel running along the fence, above the dog, between trees, toward you. Before and after tell when." },
        { id:"eng-b0e2659", q:"What is an adjective?", a:"A word that describes or modifies a noun or a pronoun.", memType:"Picture it", mem:"Picture a narrow, fuzzy, happy caterpillar. Each adjective dresses up a noun, like caterpillar, or a pronoun, like it." },
        { id:"eng-914a543", q:"What is an adverb?", a:"A word that describes or modifies a verb, an adjective, or another adverb.", memType:"Picture it", mem:"Picture a surprisingly calm turtle walking slowly. Surprisingly tweaks calm, slowly tweaks walking. Adverbs tweak verbs, adjectives, adverbs." },
        { id:"eng-de118ad", q:"Do all adverbs end in -ly?", a:"No. Usually, but not always.", why:"Words like tomorrow, then, now and also are adverbs with no -ly on them.", memType:"Picture it", mem:"Picture an adverb club where most wear -ly name tags. Now, then and tomorrow walk in tagless and still belong." },
        { id:"eng-cfa3180", q:"Name four adverbs of time, words that tell when.", a:"tomorrow, then, everyday, now.", why:"Mrs. Walters' list writes it as one word, everyday. As a word that tells when, it is usually two words: every day. One word, everyday, describes a noun, as in everyday clothes.", memType:"Story", mem:"The coach's plan: stretch now, then run, rest tomorrow, and practice everyday. Each of the four words tells when." },
        { id:"eng-00e4144", q:"Name three adverbs that work as transitions.", a:"also, therefore, moreover.", memType:"Story", mem:"I ate pizza. Also, tacos. Therefore, I napped. Moreover, it was worth it." },
        { id:"eng-7b2c902", q:"Adjective and adverb: which one modifies what?", a:"An adjective modifies nouns and pronouns. An adverb modifies verbs, adjectives and other adverbs.", memType:"Link it", mem:"Adverb has verb inside it: it modifies verbs, plus adjectives and adverbs. Adjective sticks to nouns and pronouns." },
        { id:"eng-4a3a659", q:"What is a conjunction?", a:"A word that connects other words or groups of words.", memType:"Link it", mem:"Junction, like a train junction where tracks join. A conjunction joins words or groups of words." },
        { id:"eng-40bc5d2", q:"What does FANBOYS stand for?", a:"For, And, Nor, But, Or, Yet, So.", memType:"First letters", mem:"Picture seven fanboys in a line, one letter per shirt: For, And, Nor, But, Or, Yet, So. Seven letters, seven conjunctions." },
        { id:"eng-943384f", q:"Besides FANBOYS, name six more conjunctions.", a:"although, therefore, because, however, while, when.", memType:"First letters", mem:"A Tiny Bear Hugs Warm Waffles: although, therefore, because, however, while, when." },
        { id:"eng-771de0f", q:"What is a conjunctive adverb?", a:"It connects two clauses, but not two independent clauses.", why:"The limit in Mrs. Walters' definition is the not two independent clauses part.", memType:"Picture it", mem:"Picture a bridge between two clauses with a sign: not for two independent clauses. Therefore and thus cross it." },
        { id:"eng-32413ae", q:"Name three conjunctive adverbs.", a:"Any three of: therefore, nonetheless, moreover, consequently, thus.", memType:"First letters", mem:"Tall Ninjas Make Cool Tacos: therefore, nonetheless, moreover, consequently, thus." },
        { id:"eng-3a39821", q:"Can one word be more than one part of speech?", a:"Yes. Therefore is on Mrs. Walters' adverb list and on her conjunction list.", why:"Her slide says it directly: therefore is an adverb and a conjunction, and some words can be more than one thing.", memType:"Link it", mem:"Like a two-way player in football: therefore plays adverb and conjunction. One word, two positions." },
        { id:"eng-c50c4bc", q:"Flat or stock character?", a:"A character with just one or two traits, not a lot to them.", memType:"Picture it", mem:"Picture a paper cutout character, flat as a sheet: one side, one or two traits, nothing behind it." },
        { id:"eng-fbf2f6d", q:"Round or complex character?", a:"A character with many traits, faults and virtues.", memType:"Picture it", mem:"Picture a round 3D character you can spin: every side shows a new trait, fault or virtue." },
        { id:"eng-d947a37", q:"Static character?", a:"A character who does not change throughout the story.", memType:"Sounds like", mem:"STATic sounds like STATue. A statue stays put, and a static character never changes." },
        { id:"eng-9eae1d6", q:"Dynamic character?", a:"A character who changes, develops and learns from experiences in the story.", memType:"Link it", mem:"Like a game character leveling up: a dynamic character changes, develops and learns from what happens." },
        { id:"eng-429261d", q:"Flat and round, static and dynamic: what does each pair measure?", a:"Flat and round are about how many traits a character has. Static and dynamic are about whether the character changes.", why:"The two pairs come from Mrs. Walters' two separate definitions, traits and change.", memType:"Link it", mem:"Flat and round is the stats sheet: how many traits. Static and dynamic is leveling up: do they change." },
        { id:"eng-8aecce8", q:"Who wrote A Problem?", a:"Anton Chekhov.", memType:"Sounds like", mem:"CHEKhov sounds like check off. Picture Anton checking off A Problem on his to-do list." },
        { id:"eng-089d3a6", q:"Name three characters in Chekhov's A Problem.", a:"Sasha, Ivan Markovich, and the Colonel.", memType:"First letters", mem:"S, I, C, said like sick: Sasha, Ivan Markovich, the Colonel." },
        { id:"eng-b263f82", q:"How does Sasha appear while he waits for judgment?", a:"Meek, but not really humble.", why:"Mrs. Walters' note puts a question mark on meek and adds not really humble.", memType:"Picture it", mem:"Picture Sasha with his head down like a meek puppy, but his halo is a fake: not really humble." },
        { id:"eng-67456e6", q:"What do Sasha's thoughts and actions show readers about him?", a:"He does not take responsibility, he feels no guilt, and he is immature.", memType:"Picture it", mem:"Picture Sasha as a toddler (immature) pointing at others (no responsibility) and shrugging (no guilt)." },
        { id:"eng-dedf7bc", q:"What does Ivan Markovich do in A Problem?", a:"He gives a speech saying they should pay the IOU, because Sasha is not the one to blame.", memType:"Picture it", mem:"Picture Ivan Markovich on a soapbox waving the IOU: pay it, Sasha is not the one to blame." },
        { id:"eng-83b81a2", q:"What does Ivan Markovich's speech show about him?", a:"He believes in second chances, and he is persuasive or manipulative.", why:"Mrs. Walters' notes list both sides from the same speech, the kind one and the manipulative one.", memType:"Link it", mem:"Like a friend talking a ref out of a red card: believes in second chances, and is persuasive, maybe manipulative." },
        { id:"eng-37b3c1d", q:"What four parts, in order, build an argument about a story?", a:"A verdict (your claim), the reason, the strongest text evidence, and the other side: Our verdict is that ___ because ___. The strongest evidence is ___. However, someone might disagree because ___.", memType:"First letters", mem:"Very Rowdy Eagles Object: Verdict, Reason, Evidence, Other side. The last eagle objects, like someone who disagrees." }
      ]}
    ] },
  chem: { name:"Conceptual Chemistry", teacher:"Porter", color:"var(--c-chem)", units:[
      { name:"MSDS Project", cards:[
        { id:"chem-079f2ff", q:"What does MSDS stand for?", a:"Material Safety Data Sheet.", why:"A real one is a safety sheet for a chemical. Mrs. Porter's sample is a joke one about herself as if she were an element, written in the same shape as the real thing.", memType:"Picture it", mem:"Picture a bedsheet made of shiny material, stamped SAFETY, covered in data tables. Material, Safety, Data, Sheet." },
        { id:"chem-d2f6bb7", q:"What two kinds of properties does a safety data sheet use to describe a substance?", a:"Physical properties (what you can observe without changing it) and chemical properties (how it reacts).", memType:"Link it", mem:"Like a game character card: a Looks tab for physical properties, and a Battle tab for how it reacts, chemical." },
        { id:"chem-5a8b00b", q:"On an element data sheet, what does the 'Discovered by' line under General Information record?", a:"Who discovered the element.", why:"Mrs. Porter's sample sheet describes her as if she were an element. Her discoverers are her parents, Jerry and Mary Brandow.", memType:"Link it", mem:"Like the credits on a game that name who made it, the Discovered by line names who first found the element." },
        { id:"chem-c8b0d68", q:"In chemistry, what does an element's occurrence describe?", a:"Where it is found in large amounts, and where it is hardly found at all.", why:"Mrs. Porter's sample sheet describes her as if she were an element: large deposits in warm places like Key West, very small amounts in cold places like Antarctica.", memType:"Link it", mem:"Occurrence is a spawn map in a game: where it spawns a lot, and where it barely spawns at all." },
        { id:"chem-b83307e", q:"What is a physical property?", a:"Something you can observe without changing what it is.", memType:"Link it", mem:"Like checking a phone's color, size and weight: you learn about it and it is still the same phone. Physical." },
        { id:"chem-caa907c", q:"What is a chemical property?", a:"How something reacts.", memType:"Link it", mem:"Fireworks: light the fuse and they react, burn and bang. A chemical property is how something reacts." },
        { id:"chem-d829dfe", q:"Fast way to tell physical and chemical properties apart?", a:"Physical is what it looks like and what changes its state. Chemical is what it reacts to.", memType:"Picture it", mem:"Physical says Look at me: picture a mirror with an ice cube melting on it. Chemical says React to me: a lit fuse." },
        { id:"chem-77b86a7", q:"'Brown hair with highlights, blue/green eyes, glasses, short.' Physical or chemical property?", a:"Physical property.", why:"You can see all of it without changing anything.", memType:"Picture it", mem:"Picture a mirror: hair, eyes, glasses and height all show up, and nothing changes. Mirror traits are physical." },
        { id:"chem-8cf2738", q:"Porter wrote 'Boils when people lie to her.' Physical or chemical property?", a:"Physical property.", why:"Mrs. Porter's sample sheet describes her as if she were an element. Boiling is a change of state, and changes of state sit with the physical ones.", memType:"Link it", mem:"Pasta water boils into steam and is still water. A change of state, same stuff: physical." },
        { id:"chem-a69de3d", q:"Porter wrote 'May explode if her car gets damaged.' Physical or chemical property?", a:"Chemical property.", why:"Mrs. Porter's sample sheet describes her as if she were an element. Exploding is a reaction to something.", memType:"Picture it", mem:"Picture a dent in Porter's car lighting a fuse: BOOM. An explosion is a reaction, and reactions are chemical." },
        { id:"chem-725709b", q:"Name two changes of state. Which kind of property is a change of state?", a:"Boiling and melting. Changes of state are physical, not chemical.", memType:"Story", mem:"An ice cube melts into a puddle, then the puddle boils away in a pot. It is still water the whole time, so physical." },
        { id:"chem-91f1313", q:"What are the forms a substance can be found in called? Porter jokes she is found in joyful, grateful and impressed ones.", a:"States of matter.", why:"Her sample sheet describes her as if she were an element, so she swapped moods in for the states a real substance can be found in.", memType:"Picture it", mem:"Picture Porter as ice, water and steam, labeled joyful, grateful, impressed. Her moods stand in for states of matter." },
        { id:"chem-d8ca5e3", q:"What reactivity words describe a substance's chemical properties?", a:"Attracted to, repelled by, explodes, does not react, neutral.", memType:"Story", mem:"At a party: two people are attracted to each other, one is repelled and walks away, one explodes in anger, one does not react at all, one stays neutral." },
        { id:"chem-1f96315", q:"When describing how a substance reacts, what do 'repelled by' and 'attracted to' mean?", a:"Repelled is what pushes it away. Attracted is what pulls it in.", why:"Mrs. Porter's sample sheet describes her as if she were an element. She is repelled by being cold and attracted to beaches or pools.", memType:"Link it", mem:"Magnets: flip one and they push apart, repelled. Turn it back and they snap together, attracted." },
        { id:"chem-a8e2297", q:"Which two chemical property phrases mean something has no effect on a substance?", a:"Does not react, and is neutral to.", why:"Mrs. Porter's sample sheet describes her as if she were an element. She does not react if it snows, and she is neutral to making dinner.", memType:"Picture it", mem:"Picture a glass marble sitting in water all day: it does not react, and it stays neutral to the water. Nothing changes." },
        { id:"chem-3ccf5d4", q:"What four facts appear on an element tile, like an element's square on the periodic table?", a:"Atomic number, element symbol, element name, atomic mass.", memType:"First letters", mem:"Nachos Stay Nice Melted: Number, Symbol, Name, Mass. Number and mass both start with atomic." },
        { id:"chem-637c256", q:"Porter's element tile shows 51 and 512.6. Which is the atomic number, and where did it come from?", a:"51 is the atomic number, and it is her age. 512.6 is the atomic mass.", why:"Mrs. Porter's sample sheet describes her as if she were an element, so she used her own age as its atomic number.", memType:"Picture it", mem:"Picture 51 candles on her cake: age equals atomic number. Yours would be 15. The decimal, 512.6, is atomic mass." },
        { id:"chem-14b5206", q:"Porter's element is Portium. How is the name built, and what real element ending does it copy?", a:"Her last name plus -ium, an ending many real element names share.", why:"Mrs. Porter's sample sheet describes her as if she were an element, and she named the element after herself.", memType:"Link it", mem:"Helium in balloons, sodium in salt, calcium in milk: real elements end in -ium. Porter plus -ium makes Portium." },
        { id:"chem-38df437", q:"How is an element symbol written?", a:"One or two letters. The first is a capital, and a second letter is lowercase.", why:"Mrs. Porter's sample element, Portium, has the symbol Rp: a capital R, then a lowercase p.", memType:"Picture it", mem:"Picture Rp as a parent holding a kid's hand: big capital R, little lowercase p. Symbols like H walk alone, just one capital." }
      ]}
    ] },
  hist: { name:"World History",     teacher:"Flores",  color:"var(--c-hist)", units:[
      { name:"Forms of Government", cards:[
        { id:"hist-1083b8a", q:"What is a government, and what two powers does it hold?", a:"A government is the group that makes the rules for a place and makes sure people follow them. It has two powers: the power to make laws, and the power to enforce them.", why:"Every form of government on this list is a different answer to one question: who holds that power?", memType:"Link it", mem:"A referee crew that also writes the rulebook: a government makes the laws and enforces them." },
        { id:"hist-f5298f4", q:"Theocracy: a form of government where ___ rule in the name of God.", a:"Religious leaders. Priests, clerics, or other religious officials hold the power. The laws come from religious teaching.", memType:"Link it", mem:"Theos is Greek for god, as in theology. Theocracy: religious leaders rule in the name of God, and religious teaching becomes law." },
        { id:"hist-4ea0633", q:"Autocracy: a form of government where one leader has ___ power.", a:"Unlimited power. You may also see it written as absolute or total. No court, no parliament, and no election can legally stop that one leader.", memType:"Link it", mem:"Auto means self, like autopilot: one system flies the whole plane alone. Autocracy: one leader with unlimited power, nobody else at the controls." },
        { id:"hist-463438e", q:"Autocracy, type one: ___ (power taken through force).", a:"Dictatorship. A dictator takes power by force, usually with the military. A dictator is not elected, and does not inherit the job from family.", memType:"Picture it", mem:"A dictator dictates orders from the top of a tank. Tanks mean force: no election, no family inheritance, just power taken." },
        { id:"hist-2ceb898", q:"Autocracy, type two: ___ monarchy (power given through ruling family).", a:"Absolute monarchy. A king or queen inherits total power from their family and keeps it for life. No elected group can limit them.", why:"Both types are autocracy because one person holds all the power. Only the way they got it is different.", memType:"Picture it", mem:"Picture a crown handed from parent to child, stamped ABSOLUTE: all the power, inherited through the family, kept for life." },
        { id:"hist-bdabf16", q:"Oligarchy: a form of government where a ___ ___ of rich and powerful people have all of the power.", a:"A small group. In an oligarchy a handful of wealthy or powerful people rule. Citizens do not pick them and cannot vote them out.", memType:"Link it", mem:"Oligo means few. Five rich friends in a group chat decide everything for the whole school: a small group holds all the power." },
        { id:"hist-84dfebd", q:"In an oligarchy, decisions are made that usually benefit the ___ group.", a:"The ruling group. The small group in charge makes choices that help themselves and keep their own power, not choices that help everyone else.", memType:"Link it", mem:"Olig- means few. Picture five kids running student council who vote themselves the best lunch table. The ruling few help themselves." },
        { id:"hist-3665afb", q:"What is a similarity between oligarchy and autocracy?", a:"In both, the people have no say. Citizens do not choose the rulers and cannot remove them. The main difference is one ruler versus a small group of rulers.", memType:"Link it", mem:"One admin or a small clique runs the game server. Either way, players get no vote and cannot remove them." },
        { id:"hist-b495c66", q:"Constitutional monarchy: power is held by ___ person, who inherits the power through ___.", a:"One person, a king or queen. They inherit the power through birth, meaning through their family line.", why:"The monarch is one person, but the monarch is not the one really in charge.", memType:"Picture it", mem:"Picture one baby born already wearing a tiny crown: one person, and the power comes through birth." },
        { id:"hist-c49a43a", q:"In a constitutional monarchy, who has the authority to tax and make new laws?", a:"An elected body, such as a parliament. The monarch wears the crown and is mostly a symbol. The lawmakers the people elected hold the real power.", memType:"Link it", mem:"The monarch is the team mascot. The elected parliament is the coach: it sets taxes and makes laws. A constitution limits the crown." },
        { id:"hist-12cdaa5", q:"What is the difference between an absolute monarchy and a constitutional monarchy?", a:"In an absolute monarchy the king or queen holds all the power. In a constitutional monarchy they inherit the title, but elected lawmakers hold the power to tax and make laws.", memType:"Link it", mem:"Absolute monarch: team owner and coach at once, all the power. Constitutional monarch: the mascot, while elected lawmakers set taxes and laws." },
        { id:"hist-f1edabe", q:"Communism: the government controls the whole ___ (goods, services, and production).", a:"The economy. Under communism the government owns and runs the farms, factories, and businesses. People do not own businesses privately.", memType:"Link it", mem:"Communism comes from common. Picture the whole economy as one common pot the government owns: every farm, factory and business." },
        { id:"hist-c1e11c3", q:"Communist states are usually ruled by a communist ___, and there is ___ political party.", a:"Ruled by a communist party, and there is only one political party. Because there is no other party, voters have no real choice.", memType:"Picture it", mem:"Picture a ballot with only one name printed on it: the communist party. One party, so voters have no real choice." },
        { id:"hist-96fb327", q:"Socialism: the government takes an active role in controlling the ___.", a:"The economy. The government owns or controls key parts of it, such as healthcare, energy, or transportation. Private business still exists alongside it.", memType:"Picture it", mem:"Picture a government-run city bus driving past private shops. Socialism: the government controls key parts of the economy, not all of it." },
        { id:"hist-04acb91", q:"What is a similarity between socialism and communism?", a:"Both give the government control over the economy. The difference is how much. Communism controls all of it. Socialism controls only part of it.", memType:"Link it", mem:"Picture a volume knob for government control of the economy. Socialism turns it partway up. Communism turns it all the way." },
        { id:"hist-e0b0535", q:"Direct democracy means \"rule by the ___\". Citizens directly ___ in government.", a:"Rule by the people. Citizens directly vote, or participate, in government. They vote on the laws themselves instead of sending someone to do it.", memType:"Link it", mem:"Demos means people, kratos means power. Direct democracy is the whole class voting on the field trip: every citizen votes directly." },
        { id:"hist-26a20be", q:"Representative democracy is also known as a ___. It is governed by representatives ___ by citizens.", a:"Also known as a republic. It is governed by representatives elected by citizens. The United States is one example.", why:"Republic and representative democracy mean the same thing here, so a question can use either word.", memType:"Link it", mem:"REPublic and REPresentative share REP. Like student council, citizens elect reps who decide for them. The United States works this way." },
        { id:"hist-df46099", q:"What is a similarity between direct and representative democracy?", a:"In both, the power comes from the people. Citizens have a real say in government. The difference is only whether they vote on laws themselves or elect someone to vote for them.", memType:"Link it", mem:"Whole class votes on the field trip, or student council votes for them. Either way, the power comes from the people." },
        { id:"hist-68aa0ef", q:"Fascism: a strong ___ government led by a charismatic ___.", a:"A strong central government, led by a charismatic leader. Fascism uses strict control over social and economic life and pushes extreme patriotism.", why:"Charismatic means the leader is exciting to listen to, so crowds follow willingly.", memType:"Picture it", mem:"Picture one spellbinding leader at the center of a packed stadium, flags waving everywhere: strong central government, charismatic leader, extreme patriotism." },
        { id:"hist-888bd4d", q:"What is feudalism?", a:"A system where peasants and vassals work a powerful lord's land. In exchange, the lord protects them and takes care of their economic needs.", why:"Feudalism was common in Europe during the Middle Ages.", memType:"Picture it", mem:"Picture peasants farming the fields around a castle while the lord's knights guard the walls: they work his land, he protects them." },
        { id:"hist-274100a", q:"Which form of government is similar to feudalism, and which is similar to fascism? (One for each)", a:"Feudalism is most like oligarchy. A few powerful lords hold the land and the power.\nFascism is most like autocracy. One strong leader holds all the power.", memType:"Picture it", mem:"Picture a few castles for feudalism: a few lords, so oligarchy. Picture one podium for fascism: one leader, so autocracy." },
        { id:"hist-9518a56", q:"What is anarchy?", a:"Anarchy is the absence of government. Nobody is in charge, so there are no laws and no one to enforce them. It can happen when a government collapses.", memType:"Link it", mem:"An- means without, like anonymous means without a name. An-archy means without a ruler: no government, no laws, no one enforcing them." },
        { id:"hist-0acfeb4", q:"Name the 11 forms of government studied in this unit.", a:"Autocracy (dictatorship or absolute monarchy)\nOligarchy\nCommunism\nSocialism\nDirect democracy\nRepresentative democracy\nConstitutional monarchy\nFascism\nFeudalism\nTheocracy\nAnarchy", memType:"First letters", mem:"An Old Cat Sat Down, Read Comics, Fed Five Tiny Ants. Eleven words, eleven forms, in the same order as the list." }
      ]},
      { name:"Hinduism and Buddhism", cards:[
        { id:"hist-40d587c", q:"What main goal do Hinduism and Buddhism share?", a:"To escape the endless cycle of birth, death, and rebirth. That release is called liberation. In Hinduism it is moksha. In Buddhism it is nirvana, or enlightenment.", why:"Hindus see religion as a way of freeing the soul from the illusions, disappointments, and mistakes of everyday life. Buddhism, a reform of Hinduism, kept that goal.", memType:"Link it", mem:"Hinduism came first, and M comes before N: moksha for Hinduism, nirvana for Buddhism. Both mean escaping the cycle of rebirth." },
        { id:"hist-1d157f1", q:"How are Hinduism and Buddhism related?", a:"Buddhism began in India as a reform of Hinduism. That is why it shares many of the same ideas, like karma, reincarnation, and the goal of escaping rebirth.", why:"It is why the same terms show up on both sides of the list on your Buddhism Bumper Sticker worksheet.", memType:"Link it", mem:"Think family tree: Buddhism grew from Hinduism in India as a reform, so it inherited karma, reincarnation, and escaping rebirth." },
        { id:"hist-994d48d", q:"What is the caste system?", a:"It is how traditional Indian society was ranked. People were born into a group called a caste. Your caste set your job, who you could marry, and your place in society. You could not move to a different caste.", memType:"Link it", mem:"A locked team roster from birth: your caste set your job, marriage and rank, with no trades. Order: priests, warriors, merchants, laborers." },
        { id:"hist-36b52f5", q:"Who were the Brahmans?", a:"The priests, and the highest of the four castes. They studied the sacred texts, led the rituals, and taught religion. Only Brahmans could perform the most important ceremonies.", memType:"Link it", mem:"Brahmans, plural, are people: the priests, the top caste. Brahman, singular with no S, is the one universal soul." },
        { id:"hist-1bfeeb9", q:"Who were the Kshatriyas?", a:"The warriors, and the second caste. Kings, nobles, and soldiers came from this group. Their duty was to protect and govern everyone else.", why:"The Buddha was born into this caste, not the priest caste.", memType:"Sounds like", mem:"Kshatriya sounds like SHATTER: warriors shattering enemy shields to protect the land. Second caste: kings, nobles and soldiers." },
        { id:"hist-d94d9b6", q:"Who were the Vaisyas?", a:"The merchants, and the third caste. They were traders, shopkeepers, and farmers. They ran the everyday economy.", memType:"Link it", mem:"V for Vendors: Vaisyas were the merchants, traders and shopkeepers running the everyday economy. Third caste, under priests and warriors." },
        { id:"hist-3e4c0ea", q:"Who were the Shudras?", a:"The laborers, and the lowest of the four castes. They did the hard physical work and served the three castes above them. They were usually not allowed to study the sacred texts.", memType:"Link it", mem:"S for Service: Shudras were the laborers who did the hard physical work, serving the three castes above. Lowest of the four." },
        { id:"hist-69f879e", q:"Who were the Untouchables?", a:"People below all four castes, outside the system entirely. They did work seen as unclean, like handling garbage, dead bodies, or animal skins. Other people avoided touching them. Today they are usually called Dalits.", why:"They show how strict the system was. Being outside it was worse than being at the bottom of it.", memType:"Link it", mem:"The name tells you: others avoided touching them. Below all four castes, outside the system, doing work seen as unclean. Today: Dalits." },
        { id:"hist-1fa3193", q:"What were sadhus, also called samanas?", a:"Wandering monks. They gave up home, property, and family to travel, beg for food, and search for spiritual truth.", why:"Living this way put a person outside normal caste life. The Buddha lived as one before his enlightenment.", memType:"Picture it", mem:"A wandering monk: no house key, no wallet, no family photos. He walks town to town, holds out a bowl for food, seeks truth." },
        { id:"hist-99665eb", q:"What is reincarnation?", a:"The belief that after you die, your soul is born again in a new body. The same soul lives many lives in a row. What you come back as depends on how you lived this time.", why:"Karma, samsara, and moksha each describe a different part of this same cycle.", memType:"Link it", mem:"Re- means again, like replay. Re-in-carn-ation: again in a body. The same soul is born into a new body, life after life." },
        { id:"hist-808a434", q:"What is karma?", a:"The good and bad you do adds up. Good deeds build good karma, bad deeds build bad karma. Your total karma decides what you are reborn as in your next life.", memType:"Link it", mem:"Karma is a running score of good and bad deeds. What goes around comes around: that score decides your next life." },
        { id:"hist-8ef185c", q:"What is maya?", a:"Illusion. The physical world we see is not true reality. It is a kind of cover over what is actually real. Your Buddhism Bumper Sticker worksheet says the earth often stood for maya.", memType:"Link it", mem:"Maya is a phone filter: the world you see is a cover over true reality. Illusion. The earth often stood for maya." },
        { id:"hist-82452f5", q:"What is samsara?", a:"The false world that illusion produces. It is also the endless cycle of birth, death, and rebirth you are stuck inside.", memType:"Link it", mem:"Like a game world you cannot log out of: Hindus believe this world is an illusion where you spawn, die and respawn again and again." },
        { id:"hist-e8df8fd", q:"What is yoga?", a:"The process of meditation. It is training for the mind and body that helps a person settle down, focus, and move toward spiritual truth.", memType:"Link it", mem:"Not a stretching class here: yoga is the process of meditation, training mind and body to settle and focus." },
        { id:"hist-485ab20", q:"What is a yogi?", a:"A spiritual teacher or adviser. A yogi has practiced meditation for a long time, so other people come to them for guidance.", memType:"Link it", mem:"Yoga is the practice. Add an I for the Individual who guides it: a yogi is a spiritual teacher or adviser." },
        { id:"hist-58437ad", q:"What is atman?", a:"The individual soul. It is the divine part inside one person, the piece that does not die when the body dies. Atman is what moves on and is reborn.", memType:"Link it", mem:"A comes before B. Atman is A single person's soul, the part reborn. Brahman is the Boundless universal soul it belongs to." },
        { id:"hist-919a4e1", q:"What is Brahman?", a:"The universal soul, the divine, God. Brahman is the one reality behind everything that exists. Every individual atman is a piece of it.", memType:"Link it", mem:"B for Boundless: Brahman, no S, is the one universal soul. Every atman is part of it. Brahmans, with an S, are priests." },
        { id:"hist-dc95031", q:"What is enlightenment, also called liberation or nirvana?", a:"The realization that atman and Brahman are identical. Your soul and the universal soul were never separate. Once you truly see that, you are released from the cycle of rebirth.", why:"This is the goal of the whole system. Every other term either explains what traps you or how to get out.", memType:"Picture it", mem:"A drop of water (atman) meets the ocean (Brahman): same water all along. Seeing that frees you. Nirvana: desire blown out, like a flame." },
        { id:"hist-7a98391", q:"What is dharma?", a:"Your duty, or the right way to live. Dharma means doing what your role in life asks of you, honestly and well.", memType:"Link it", mem:"D for Duty: dharma means doing what your role in life asks of you, honestly and well." },
        { id:"hist-76ca059", q:"What is kama?", a:"Pleasure. It covers enjoyment, love, beauty, and the good feelings of life. Hinduism does not treat pleasure as evil. It is one of the four things a person aims for.", memType:"Link it", mem:"Kama has no R, so it is not karma. Kama is pleasure: fun, love and beauty, like a great weekend with friends." },
        { id:"hist-035ea7e", q:"What is artha?", a:"Wealth, money, and material possessions. It also covers success and security: a job, a home, and the means to support a family.", memType:"Sounds like", mem:"Artha starts with ART: picture pricey art on the walls of your own house. Artha means wealth, money and possessions." },
        { id:"hist-2e5c123", q:"What is moksha?", a:"Liberation. It is release from the cycle of rebirth. Your Buddhism Bumper Sticker worksheet also calls it retirement, because it comes last, when a person sets aside work and family duties to seek that release.", memType:"Link it", mem:"M for Moving on: like retiring after a career, moksha comes last. The soul seeks liberation, release from the cycle of rebirth." },
        { id:"hist-c9e45ff", q:"What do dharma, kama, artha, and moksha have in common?", a:"Your Buddhism Bumper Sticker worksheet lists them together as the stages of life. A person pursues duty, pleasure, and wealth during ordinary life. Moksha comes last, and it is the one that ends the cycle.", memType:"First letters", mem:"Duty, Kicks, Assets, Moving on: Dharma, Kama, Artha, Moksha. The stages of life, with moksha always last." },
        { id:"hist-92e9f0e", q:"What are the Four Noble Truths of Buddhism?", a:"1. Life is suffering.\n2. The cause of suffering is desire and selfishness.\n3. Suffering can be stopped.\n4. The way to stop it is the Eightfold Path.", why:"The four lines at the bottom of your Buddhism Bumper Sticker worksheet are these truths, even though it does not name them. They are the core of what the Buddha taught.", memType:"Story", mem:"A doctor visit: name the problem (suffering), find the cause (desire), say it can be cured, give the treatment (the Eightfold Path)." },
        { id:"hist-aa2ad66", q:"What does \"life is suffering\" actually mean?", a:"It does not mean life is always miserable. It means nothing lasts. Things you enjoy end, people change, bodies get sick and old. Wanting things to stay the same is where the pain comes from.", memType:"Link it", mem:"Like a favorite song: it ends, and wanting it to play forever is what hurts. Nothing lasts, and clinging to sameness brings pain." },
        { id:"hist-fe6f844", q:"Why does Buddhism say desire causes suffering?", a:"Because wanting has no end. You get the thing you wanted, feel good for a while, then want something else. Selfishness works the same way, keeping you at the center and never satisfied.", memType:"Link it", mem:"Like new sneakers: the thrill fades in a week and you want the next pair. Wanting never ends, so the suffering never ends." },
        { id:"hist-ef5fe69", q:"What is the Eightfold Path?", a:"The Buddha's eight step guide for ending suffering:\n1. Right view\n2. Right intention\n3. Right speech\n4. Right action\n5. Right livelihood\n6. Right effort\n7. Right mindfulness\n8. Right concentration", why:"It is the fourth noble truth spelled out. It is also called the Middle Way, because it avoids both luxury and extreme self denial.", memType:"First letters", mem:"Every step starts with Right. Pay with a VISA for a LEMon Cake: View, Intention, Speech, Action, Livelihood, Effort, Mindfulness, Concentration." }
      ]},
      { name:"Christianity", cards:[
        { id:"hist-986aa02", q:"Who were the first Christians, and what did they believe?", a:"They were Jews who were waiting for a messiah, or savior. They believed they had found him in Jesus of Nazareth. They believed he was the son of God, born to a virgin named Mary, and the deliverer promised in the Jewish Torah.", why:"This is the first box on your Christianity Reading and Questions sheet. It wants two things: who they were, and what they believed.", memType:"Link it", mem:"Two J's: they were Jews, and they believed the savior promised in the Torah had come as Jesus of Nazareth, son of God, born to virgin Mary." },
        { id:"hist-87379a0", q:"What does the word messiah mean, and why is Jesus called Christ?", a:"Messiah means savior, or deliverer. Early Christians believed Jesus was the deliverer promised in Jewish scripture. Christ is the title they gave him. It means the same thing as messiah.", memType:"Link it", mem:"Christ is a job title, not a last name, like Doctor in Doctor Smith. Christ and messiah both mean savior, or deliverer." },
        { id:"hist-e97590c", q:"Why do Christians celebrate Christmas?", a:"Christmas, each December, celebrates the birth of Jesus. Christians believe God's son took on an earthly form to save people from sin, which means wrongdoing. The story says shepherds from nearby fields came to Bethlehem to honor him.", why:"Your Christianity Reading and Questions sheet asks you to copy a portion of the text in quotation marks that best explains why Christians celebrate Christmas. Use this sentence from your reading: \"Jesus's immaculate conception and birth signifies to Christians that while divine by nature, God's son, took on an earthly form in order to save his followers from sin, or wrongdoing.\"", memType:"Picture it", mem:"A December nativity scene: shepherds from nearby fields honor newborn Jesus in Bethlehem. Christians believe God's son took earthly form to save people from sin." },
        { id:"hist-d56efa7", q:"What does the shepherd image mean in the Christmas story?", a:"Shepherds came to Bethlehem to honor the newborn Jesus. Your reading says this reminds Christians that Christ is like a shepherd, always tending and caring for his flock of sheep, meaning his believers.", why:"The box on your Christianity Reading and Questions sheet says \"Christ and Baptism, Main Idea.\" This is the main idea of that section.", memType:"Link it", mem:"A shepherd checks every sheep. Christians see Christ that way, always caring for his flock, the believers. Shepherds honored newborn Jesus in Bethlehem." },
        { id:"hist-6367282", q:"What is baptism?", a:"Baptism is a washing that stands for washing away sin. As a young adult, Jesus asked his cousin John to baptize him in the River Jordan. Churches today use either a small sprinkle of water or full immersion.", memType:"Picture it", mem:"Picture a river sign reading J, J, J: Jesus, cousin John, River Jordan. Baptism washes away sin, by sprinkle or full immersion." },
        { id:"hist-988a323", q:"Why did the Jewish leadership turn against Jesus?", a:"As Jesus grew more popular, the Jewish leadership grew more hostile to him and his followers. They thought he might have come to overthrow the Roman government. That would put their own power at risk.", why:"This is where the crucifixion story starts. It explains what happens next.", memType:"Link it", mem:"When someone new gets hugely popular, whoever is in charge gets nervous. Leaders feared Jesus might overthrow Roman rule and their power with it." },
        { id:"hist-2a96dc1", q:"What is Passover?", a:"Passover is a Jewish holiday. It remembers the exodus, when the Jews left Egypt. Jesus and his followers came to Jerusalem to celebrate it.", why:"Passover is the week Jesus was arrested and killed. In your reading, it is also the reason his followers could not return to his tomb for three days.", memType:"Link it", mem:"Exodus starts with ex, like exit: the Jews exiting Egypt. Passover, a Jewish holiday, remembers that exit. Jesus celebrated it in Jerusalem." },
        { id:"hist-4e554c2", q:"What happened when Jesus rode into Jerusalem?", a:"A very large crowd gathered around him. People waved palm branches at his feet while he rode into the city on a donkey. Christians believe he was filling the role of Messiah described in the Torah.", why:"This public welcome is what the Jewish leadership could not tolerate. It led to the charges against him.", memType:"Link it", mem:"A parade welcome: huge crowd, palm branches at his feet, a donkey ride into the city. Christians see the Torah's Messiah role fulfilled." },
        { id:"hist-8363707", q:"What does heresy mean?", a:"Heresy means an opinion or statement that goes against religious teachings. In your reading, the Jewish leadership saw the crowd treating Jesus as the Messiah as a show of heresy.", memType:"Link it", mem:"A hot take against the official line. Heresy is an opinion against religious teachings; leaders saw the crowd's Messiah welcome as heresy." },
        { id:"hist-becaa88", q:"What does blasphemy mean?", a:"Blasphemy means profaning the name of God. Profaning means treating it with disrespect. The Jewish leadership had Jesus charged with blasphemy.", memType:"Link it", mem:"Blasphemy is about a name: profaning, or disrespecting, God's name. Heresy is about beliefs against official teaching. Jesus was charged with blasphemy." },
        { id:"hist-9c22c1d", q:"Who ordered Jesus to be put to death, and how did he die?", a:"Pontius Pilate, the Roman governor, sentenced Jesus to death on a cross. Jesus was crucified alongside two criminals. Crucifixion was a common form of punishment at that time.", why:"Pilate could not calm the crowd or satisfy the accusers, so he gave the sentence. Christians believe the death was necessary so Jesus could take on the sins of people.", memType:"Sounds like", mem:"Pilate sounds like pilot, the one in charge. The Roman governor gave the sentence: death on a cross, beside two criminals." },
        { id:"hist-e3636d7", q:"What do Christians mean by the resurrection?", a:"Jesus's followers were allowed to take his body to an empty tomb. They laid him there and sealed it. Because it was Passover, they could not return for three days. When they did, the tomb was empty. Christians believe Jesus had risen.", why:"Your Christianity Reading and Questions sheet asks you to summarize the crucifixion and resurrection. Four beats cover it: arrest, cross, sealed tomb, empty tomb.", memType:"Story", mem:"Followers carry the body to a tomb, seal it, wait out three days of Passover, return: empty. Christians believe Jesus had risen." },
        { id:"hist-ee13ba7", q:"What is the ascension?", a:"Christians believe Jesus appeared to several different people after he rose. Then he ascended, which means rose, to heaven. They believe he sits at the right hand of God, and that they will also rise and live forever in heaven.", memType:"Link it", mem:"Ascend means go up, as in ascending order. Christians believe Jesus rose to heaven, to God's right hand, and that they will rise too." },
        { id:"hist-3535f47", q:"What are the Gospels?", a:"The Gospels are four books about the life and teachings of Jesus. Gospel means good news. They were written by Matthew, Mark, Luke, and John, and they are the first four books of the New Testament.", memType:"First letters", mem:"My Mother Loves Jesus: Matthew, Mark, Luke, John, in order. Gospel means good news; they open the New Testament." },
        { id:"hist-5dd56d7", q:"What is the Christian Bible made of?", a:"Two parts.\nOld Testament: the Jewish Torah and scriptures, written before Jesus.\nNew Testament: the four Gospels, plus epistles, which are letters written by early church leaders, plus two other books.\nTestament means covenant, or agreement.", why:"Your Christianity Reading and Questions sheet asks you to sketch your understanding of the Old and New Testament. Two stacked boxes with those labels is enough.", memType:"Link it", mem:"Testament means covenant, an agreement, like a contract. Old: the Jewish Torah and scriptures. New: Gospels, epistles, meaning letters, and two more books." },
        { id:"hist-2733484", q:"How did Christianity first spread?", a:"Soon after Jesus died, the Romans destroyed Jerusalem and scattered its people. Those people carried the faith across the Mediterranean, including the Roman and Byzantine empires. Wherever they went they evangelized, which means spreading the good news.", why:"They were also persecuted. Christians and Jews were blamed for harm and misfortune.", memType:"Picture it", mem:"A dandelion blown apart: Romans destroy Jerusalem, its people scatter across the Mediterranean, evangelizing, spreading the good news, into Roman and Byzantine empires." },
        { id:"hist-2d7961d", q:"What did Constantine do in 313 CE?", a:"Constantine was the Roman emperor. By 313 CE he had converted to Christianity and declared it a legal religion. Your reading calls it a political move to win the favor of Christians.", memType:"Link it", mem:"313 reads the same backward, a turnaround year: Emperor Constantine converted and made Christianity legal, a political move to win Christians' favor." },
        { id:"hist-b2dcd60", q:"What is the Nicene Creed?", a:"A statement of faith. Constantine gathered a council to write it so Christian teaching would be the same everywhere. It says God is three persons in one, called the Holy Trinity: the Father who creates, the Son who is Christ, and the Holy Spirit.", why:"Your reading adds that the Holy Spirit is the part that stays active in the world, like the conscience of God.", memType:"Link it", mem:"Nicene Creed: Constantine's council's statement of faith. Trinity starts with tri, as in triangle: three persons in one God, Father, Son, Holy Spirit." },
        { id:"hist-bb04645", q:"What was the Great Schism?", a:"The split of the Christian church into two branches. The Eastern church became the Orthodox Church. The Western church stayed the Roman Catholic Church. They kept the same beliefs but worship in different ways.", why:"Your reading ties the split to the Roman Empire splitting in the 5th and 6th centuries, which is the 400s and 500s. That is the version your worksheet is built on. Outside of class, historians usually date the final break to 1054.", memType:"Link it", mem:"Schism means split. Rome is in the West, so the West stayed Roman Catholic; the East became Orthodox. Same beliefs, different worship." },
        { id:"hist-c4a7eb5", q:"What was the Reformation?", a:"A time in Europe when people started to question their place in the universe, and their place in the church. Several reformers spoke out against church practices. The church split further because of it.", why:"Luther, Calvin, and Henry VIII all belong to this stretch of your Christianity reading.", memType:"Link it", mem:"Re-form means shape again. Reformation: Europeans questioned their place in the universe and the church, reformers spoke out, and the church split further." },
        { id:"hist-21cebbc", q:"Who was Martin Luther, and what did he object to?", a:"Luther was a German priest during the Reformation. He spoke out against indulgences, which was money people paid the church for their own sins and for the sins of dead family members. He also translated the Bible into German.", why:"He translated it because he thought people should be able to read the scriptures for themselves.", memType:"Link it", mem:"An indulgence was money paid toward sins, like paying off a fine. Luther, a German priest, objected, and translated the Bible into German." },
        { id:"hist-1090291", q:"What did John Calvin teach?", a:"Calvin was a French church reformer. He taught predestination. That is the idea that God has already decided who will be saved, before a person is born.", memType:"Link it", mem:"Pre plus destination: like a GPS route set before you leave. Calvin, the French reformer, taught God already decided who will be saved." },
        { id:"hist-0d422be", q:"Why did England start its own church?", a:"King Henry VIII wanted to divorce his wife and the pope refused. So Henry made himself head of the church in England. Later, Queen Elizabeth I established the Church of England, also called the Anglican or Episcopal Church.", why:"One thing to know: your reading calls Elizabeth I his granddaughter. She was actually his daughter. The reading has this wrong, so answer with the reading if your Christianity Reading and Questions sheet asks, but the real fact is daughter.", memType:"Story", mem:"Henry VIII wants a divorce, the pope refuses, Henry heads England's church himself. Later Elizabeth I founds the Church of England: Anglican, or Episcopal." },
        { id:"hist-9f61cea", q:"Who were the Puritans and Pilgrims?", a:"English Christians who wanted a simpler faith, free of harsh rules and laws. They wanted to get away from Catholic influence in the church. They found a new home in America.", why:"They come right after the Church of England in your reading. They wanted something plainer than the church they left behind.", memType:"Link it", mem:"Puritan contains pure: English Christians wanting a simpler faith, free of harsh rules and Catholic influence. Same Pilgrims as Thanksgiving: new home, America." },
        { id:"hist-9b51555", q:"What are the main branches of Christianity?", a:"Three.\nOrthodox: the Eastern church after the Great Schism.\nRoman Catholic: the Western church.\nProtestant: churches that broke away during the Reformation, such as the Church of England.", why:"Your Christianity Reading and Questions sheet asks you to look at the graphic called Major Branches of Christianity and summarize it. These three are what it shows.", memType:"First letters", mem:"COP: Catholic, the Roman West. Orthodox, the East after the Great Schism. Protestant, the Reformation break-offs, like the Church of England." },
        { id:"hist-e7b6fd2", q:"What is a denomination?", a:"A denomination, or sect, is a branch or group within Christianity. The denomination often decides what the church building looks like. Roman Catholic churches are often elaborately decorated. Protestant churches, meaning non-Catholic, tend to be plainer and more functional.", memType:"Link it", mem:"Like bills, $5 or $20: same money, different kinds. Denomination: a branch of Christianity. Protestant, from protest, builds plainer churches; Catholic, more elaborate." },
        { id:"hist-73ea5d5", q:"What do you find inside a church?", a:"Pews: long benches for worshipers to sit on.\nAltar: the table at the front of the church.\nSermon: the lesson given from the front.\nBaptism font: a container that holds the water used in the rite, meaning religious ceremony, of baptism.", memType:"Story", mem:"Walk past the baptism font, sit on a pew, a long bench, face the altar at the front, hear the sermon: a lesson." },
        { id:"hist-265cdd9", q:"What is the Eucharist?", a:"Bread and wine that stand for the body and blood of Christ. Christians eat and drink them to remember the last supper Jesus had before he was crucified. It is treated as a time of thanksgiving and prayer.", memType:"Link it", mem:"Eucharist comes from a Greek word for thanksgiving. Bread and wine stand for Christ's body and blood, remembering the last supper before the crucifixion." },
        { id:"hist-e0f20f7", q:"Besides Christmas, what festivals do Christians celebrate?", a:"Easter: celebrated each spring. It remembers the death and resurrection of Christ, and is seen as a time to renew your faith.\nMartyr days: some churches mark the birth or death of martyrs, meaning people killed because of their faith.", memType:"Link it", mem:"Spring is when things renew: Easter, each spring, renews faith and remembers Christ's death and resurrection. Martyr days honor people killed for their faith." },
        { id:"hist-c5d273b", q:"How many people in the world are Christian?", a:"About 2.2 billion people, which is 31.5 percent of the world population. Islam is second with 1.6 billion followers, about 23 percent of the world.", why:"These are the numbers printed in the Did You Know box of your handout, so they are the ones to use.", memType:"Link it", mem:"In a class of 30, about 9 would be Christian: 31.5 percent, 2.2 billion. About 7 would be Muslim: 23 percent, 1.6 billion." }
      ]},
      { name:"Origins of Islam", cards:[
        { id:"hist-ebccb5b", q:"What is Islam?", a:"Islam is a monotheistic religion. Monotheistic means believing in one God. Muslims call God Allah, which is the Arabic word for God.\nIslam began in Arabia in the 600s, with revelations that a man named Muhammad said he received from God.", why:"This is the sentence your teacher's directions start with, so it is the frame for the whole unit.", memType:"Link it", mem:"Mono means one, as in monorail. Monotheistic: one God, Allah, the Arabic word for God. Began in Arabia in the 600s through Muhammad's revelations." },
        { id:"hist-eb21a6c", q:"Muhammad's Background: who was he before the revelations?", a:"He was born around 570 in Mecca, a busy trading city in Arabia. His father died before he was born, his mother when he was about six, so relatives raised him. He became a trader with camel caravans. At about 25 he married Khadija, a successful merchant.", why:"His trading trips took him across Arabia, where he met Jewish and Christian people who already believed in one God.", memType:"Story", mem:"Three chapters: orphan, trader, husband. Orphan: born in Mecca about 570, father dead first, mother at six, relatives raise him. Trader: camel caravans. Husband: at 25, to merchant Khadija." },
        { id:"hist-28cc676", q:"Muhammad's Revelation: what happened, and when?", a:"Around 610, when he was about 40, Muhammad was praying alone in a cave outside Mecca. He said the angel Gabriel appeared and told him to recite God's words.\nHe believed God had chosen him as a messenger. Revelations kept coming for the rest of his life.", memType:"Link it", mem:"Gabriel's first word was Recite, and Quran means recitation: same root. About 610, age 40, in a cave outside Mecca: the first revelation." },
        { id:"hist-f0742b7", q:"What is the Quran?", a:"The Quran is the holy book of Islam. It collects the revelations Muhammad received over about 22 years. Muslims believe it is God's exact words. Followers memorized and wrote them down, and they were gathered into one book after Muhammad died.", why:"The directions in your Origins of Islam notebook say the revelations \"form the basis of the Islamic religion.\" The Quran is where those revelations live.", memType:"Link it", mem:"Quran means \"recitation\": Muslims believe it is God's exact words, received by Muhammad over 22 years, recited, written down, then made one book after his death." },
        { id:"hist-3aedfda", q:"Mecca: how did people there react to Muhammad's message?", a:"Most Meccan leaders rejected it and turned hostile. Mecca was polytheistic, meaning people worshipped many gods. Pilgrims came to visit hundreds of idols at the Kaaba, and that brought money into the city.\nOne God threatened both that income and the leaders' power.", why:"This rejection is the reason the next stage, the move to Medina, had to happen.", memType:"Link it", mem:"Follow the money: pilgrims visiting hundreds of idols brought Mecca income. One God threatened that money and the leaders' power, so leaders turned hostile." },
        { id:"hist-ea4d3a6", q:"What is the Kaaba?", a:"The Kaaba is a cube shaped stone shrine in the center of Mecca. Before Islam it held idols of many gods and drew pilgrims from across Arabia. Today Muslims face toward the Kaaba when they pray.", memType:"Link it", mem:"Kaaba is Arabic for cube, and it is one: a stone shrine in central Mecca. Once held idols; now Muslims face it to pray." },
        { id:"hist-43faeaa", q:"The Hijrah: what was it?", a:"In 622, Muhammad and his followers left Mecca and moved to Yathrib, a city about 200 miles north. That move is called the Hijrah.\nLeaders in Yathrib had invited him to settle fights between their clans. The city was later renamed Medina.", memType:"Link it", mem:"Hijrah means migration, a move, not a battle. 622: invited to settle clan fights, Muhammad moves from Mecca to Yathrib, later renamed Medina." },
        { id:"hist-8fab1aa", q:"The Hijrah: why was it a turning point for Islam?", a:"In Medina, Muhammad became both a religious and a political leader. He built the first Muslim community, called the umma, with its own laws and government. Islam grew quickly there.", why:"The Muslim calendar counts year 1 from 622, the year of the Hijrah. That is how important Muslims consider this move.", memType:"Link it", mem:"Two roles at once, like principal and mayor: in Medina, Muhammad led religion and government, built the umma, the first Muslim community." },
        { id:"hist-e339210", q:"Muhammad's Return to Mecca: what happened?", a:"In 630 he returned to Mecca with about 10,000 followers. The city gave in with almost no fighting.\nHe destroyed the idols inside the Kaaba and dedicated the shrine to Allah alone. Most people in Mecca then accepted Islam.", why:"This turned Mecca from Islam's biggest opponent into its holiest city.", memType:"Story", mem:"630: about 10,000 followers arrive, Mecca yields almost without fighting, the Kaaba's idols are destroyed, it is dedicated to Allah, and Meccans accept Islam." },
        { id:"hist-2f194c4", q:"What was the impact of the return to Mecca on the growth of Islam?", a:"Muhammad died in 632, about two years later. By then most of the Arabian Peninsula was united under Islam for the first time. Tribes that had been fighting now shared one faith, and Muslim rule spread quickly after his death.", why:"Your Origins of Islam organizer asks for the impact of each stage, not just what happened. This is the impact box for the last stage.", memType:"Link it", mem:"Like rival teams joining one league: by 632, when Muhammad died, most of Arabia's fighting tribes shared one faith, then Muslim rule spread fast." },
        { id:"hist-ba0f45f", q:"The four stages of Muhammad's life, in order with dates", a:"1. Background: born about 570 in Mecca, orphaned, became a trader.\n2. Revelation and Mecca: about 610, the first revelation in a cave, which Muslims believe came through the angel Gabriel, and rejection by Meccan leaders.\n3. Hijrah: 622, the move to Medina, first Muslim community.\n4. Return to Mecca: 630, idols cleared from the Kaaba. He died in 632.", memType:"Story", mem:"A round trip from Mecca: 570, born, orphaned, a trader. 610, first revelation, rejected. 622, to Medina, year 1 of the Muslim calendar. 630, back, idols cleared. 632, dies." },
        { id:"hist-0e1fd2c", q:"What is the main teaching of Islam?", a:"That there is only one God, Allah. Muhammad is a prophet and messenger, not a god, and Muslims do not worship him.\nMuslims believe Allah is the same God Jews and Christians worship, and that Muhammad was the last of many prophets.", why:"Slide 2 of your Origins of Islam organizer opens with this line. Right after it, the slide says every believer carries out five duties, called the Five Pillars of Islam.", memType:"Link it", mem:"Hold up one finger: one God. Muslims believe Allah is the God Jews and Christians worship, and Muhammad the last prophet: a messenger, not a god, not worshipped." },
        { id:"hist-a2d3884", q:"What are the Five Pillars of Islam?", a:"Five duties every Muslim is expected to carry out:\n1. Faith (shahada)\n2. Prayer (salat)\n3. Charity (zakat)\n4. Fasting (sawm)\n5. Pilgrimage (hajj)\nThey are called pillars because they hold up the religion the way columns hold up a building.", memType:"First letters", mem:"Friendly People Can Find Peace: Faith, Prayer, Charity, Fasting, Pilgrimage. Pillars hold Islam up the way columns hold up a building." },
        { id:"hist-f3c0627", q:"Pillar 1: Shahada (faith)", a:"The statement of faith. A Muslim declares: \"There is no god but God, and Muhammad is the messenger of God.\"\nSaying this sincerely in front of witnesses is how a person becomes a Muslim. It is first because everything else rests on it.", memType:"Link it", mem:"Shahada means testimony, like testifying in court: \"There is no god but God, and Muhammad is the messenger of God,\" said sincerely before witnesses." },
        { id:"hist-c37693b", q:"Pillar 2: Salat (prayer)", a:"Prayer five times a day: dawn, noon, afternoon, sunset and night. Muslims face toward Mecca when they pray and can pray almost anywhere.\nOn Fridays, many gather at a mosque for a midday service led by a prayer leader.", memType:"Story", mem:"Follow the sun across one day: dawn, noon, afternoon, sunset, night. Five prayers, facing Mecca; many gather at a mosque Friday midday." },
        { id:"hist-a6cc267", q:"Pillar 3: Zakat (charity)", a:"Giving part of your wealth to people in need. The usual amount is one fortieth, which is 2.5 percent, of a person's savings each year.\nIt is treated as a duty owed to God, not a favor or an optional donation.", why:"It is the pillar about how Muslims treat other people, not just how they worship.", memType:"Link it", mem:"One fortieth is 2.5 percent: $2.50 of every $100 saved, given each year to people in need, as a duty, not a favor." },
        { id:"hist-2137095", q:"Pillar 4: Sawm (fasting during Ramadan)", a:"Fasting during Ramadan, the ninth month of the Muslim calendar. From dawn until sunset, Muslims do not eat or drink. They eat a meal before sunrise and another after sunset.\nChildren, people who are sick, and travelers do not have to fast.", why:"Ramadan is the month Muslims believe Muhammad received his first revelation, which links this pillar back to the cave outside Mecca.", memType:"Link it", mem:"Breakfast before sunrise, dinner after sunset, no food or drink between: that is Ramadan, the ninth month. Children, sick people and travelers are excused." },
        { id:"hist-ac83d22", q:"Pillar 5: Hajj (pilgrimage)", a:"The pilgrimage to Mecca. Every Muslim who is healthy enough and can afford the trip should go at least once in a lifetime.\nIt takes place during one set month each year. Pilgrims walk around the Kaaba seven times and wear simple white clothing.", why:"The white clothing makes rich and poor pilgrims look alike, which is the point: everyone stands equal before God.", memType:"Link it", mem:"Like a school uniform, white clothing makes rich and poor equal. Mecca once in a lifetime if able; seven times around the Kaaba." }
      ]},
      { name:"World Religions Review", cards:[
        { id:"hist-b67b054", q:"What are the five major world religions, and what five things can you compare them by?", a:"Christianity, Judaism, Islam, Hinduism and Buddhism. Each one can be compared by its holy book, founder, symbol, beliefs and holy sites.", why:"Almost every clue pairs one religion with one of those five categories. The Jerusalem clue is the one that asks for a city instead.", memType:"First letters", mem:"Big Fans Sing Before Shows: Book, Founder, Symbol, Beliefs, Sites. Religions: Christianity, Judaism, Islam, Hinduism, Buddhism." },
        { id:"hist-1c2c3d8", q:"Holy Books: the holy book for Christianity.", a:"The Bible.", why:"The Christian Bible is the Old Testament, which is the Jewish Torah and scriptures, plus the New Testament.", memType:"Link it", mem:"Bible and bibliography share a root meaning books: the Bible is a book of books, Old Testament plus New Testament. Christianity's holy book." },
        { id:"hist-290b5b5", q:"Holy Books: the holy book for Judaism.", a:"The Torah. Old Testament or Hebrew Bible also count.", why:"The Torah is the Jewish scripture. Christians later included it in their Bible as the Old Testament, which is why all three names are accepted.", memType:"Link it", mem:"The Torah sits inside the Christian Bible's Old Testament, so for Judaism, Torah, Old Testament or Hebrew Bible all count." },
        { id:"hist-c8e2108", q:"Holy Books: the holy book for Islam.", a:"The Quran.", why:"Your Islam organizer says the revelations of Muhammad are what Islam is built on.", memType:"Link it", mem:"Match each faith to its book: Christianity has the Bible, Judaism the Torah, and Islam the Quran, which holds the revelations Islam is built on." },
